xists and is past its timeframe, then email Finance only. No second request. Expedited or overdue refund Move money to another booking Money Transfer Request queue on the source booking. Backup: email Res Support. Not Finance. Move money to another Classic booking Paid in CyberSource but not in Plex, or a duplicate charge Email Finance directly. No refund queue. Payment shows in CyberSource but not in Plex Group booking Groups Manager → Payment → Credit This Card Refund a Group booking"}, {"id": "refunds-before", "kind": "shared", "stage": "all", "title": "Before any cancellation or refund", "aliases": ["before refund", "cancellation checklist", "who pays", "supplier funded", "classic funded"], "updated": null, "rule": "", "use": "", "body": "<ol type=\"1\">\n<li>Find the right booking and ticket. Check for an existing refund request, Finance queue or Post-Travel owner.<\/li>\n<li>Confirm exactly what’s being canceled: the whole booking, one item, some nights, or one traveler.<\/li>\n<li>Note <strong>when<\/strong> the change happened: before travel began or during the trip. That sets the refund timing.<\/li>\n<li>Get the supplier’s position in writing before you promise a waiver or refund.<\/li>\n<li>Decide who’s paying: the supplier, Classic, or TSP. If Classic or TSP is paying, the supplier still gets its full cost.<\/li>\n<\/ol>", "escalate": "", "complete": "", "text": "Find the right booking and ticket. Check for an existing refund request, Finance queue or Post-Travel owner. Confirm exactly what’s being canceled: the whole booking, one item, some nights, or one traveler. Note when the change happened: before travel began or during the trip. That sets the refund timing. Get the supplier’s position in writing before you promise a waiver or refund. Decide who’s paying: the supplier, Classic, or TSP. If Classic or TSP is paying, the supplier still gets its full cost."}, {"id": "refunds-a", "kind": "proc", "stage": "pre", "title": "Cancel or change before travel, with a refund", "aliases": ["cancel booking", "cancel before travel", "pre-travel refund", "14 business days", "refund queue", "plex refund queue", "penalty", "cancellation terms", "change or cancel"], "updated": null, "rule": "Get the advisor’s OK on the penalty before you cancel. Never cancel first and check penalties after.", "use": "The advisor wants to cancel or change a booking, or part of it, before the trip starts.", "body": "<ol type=\"1\">\n<li>Read each supplier’s cancellation terms and penalty dates. Ticketed air refunds go through Flights (<a class=\"xref\" href=\"#air-c\">Change or cancel ticketed air<\/a>).<\/li>\n<li>Work out what’s refundable from money actually paid, minus supplier penalties, agency/planning fees and any ticketing fee. The Trip Protection premium isn’t refunded when the booking is canceled.<\/li>\n<li>Tell the advisor the penalty and the refund amount. Get their OK.<\/li>\n<li>Cancel only what was approved. Check that whatever’s left still works.<\/li>\n<li>Reopen the booking and check the status, penalty, amount paid, commission and refundable balance.<\/li>\n<li>Open the <strong>Plex Refund queue<\/strong> and choose <strong>Refund<\/strong>. Enter:\n<ul>\n<li>Booking number<\/li>\n<li>Last four digits of the original card<\/li>\n<li>The exact refund amount<\/li>\n<li>One reason only: <strong>CHANGE<\/strong> or <strong>CANCEL<\/strong><\/li>\n<\/ul><\/li>\n<li>Confirm the request is in the queue. Note it on the booking and in Zendesk.<\/li>\n<li>Tell the advisor: <strong>14 business days<\/strong>, and that it’s submitted, not paid yet.<\/li>\n<li>Recap what’s left on the booking and any balance due.<\/li>\n<\/ol>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>If<\/th>\n<th>Then<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>The money was paid on another Classic booking<\/td>\n<td>Trace it. It may need to be moved back first (<a class=\"xref\" href=\"#refunds-d\">Move money to another Classic booking<\/a>).<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Nothing was collected<\/td>\n<td>There’s no refund to send, even if the supplier says it’s refundable.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>The advisor asks for FTC instead<\/td>\n<td>FTC isn’t available before travel.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "escalate": "The advisor disputes the supplier’s terms, or the refund needs a manual adjustment or exception.", "complete": "The right items are canceled, the numbers reconcile, the refund request is in the queue, and the advisor was told 14 business days.", "text": "Get the advisor’s OK on the penalty before you cancel. Never cancel first and check penalties after. The advisor wants to cancel or change a booking, or part of it, before the trip starts. Read each supplier’s cancellation terms and penalty dates. Ticketed air refunds go through Flights ( Change or cancel ticketed air ). Work out what’s refundable from money actually paid, minus supplier penalties, agency/planning fees and any ticketing fee. The Trip Protection premium isn’t refunded when the booking is canceled. Tell the advisor the penalty and the refund amount. Get their OK. Cancel only what was approved. Check that whatever’s left still works. Reopen the booking and check the status, penalty, amount paid, commission and refundable balance. Open the Plex Refund queue and choose Refund . Enter: Booking number Last four digits of the original card The exact refund amount One reason only: CHANGE or CANCEL Confirm the request is in the queue. Note it on the booking and in Zendesk. Tell the advisor: 14 business days , and that it’s submitted, not paid yet. Recap what’s left on the booking and any balance due. If Then The money was paid on another Classic booking Trace it. It may need to be moved back first ( Move money to another Classic booking ). Nothing was collected There’s no refund to send, even if the supplier says it’s refundable. The advisor asks for FTC instead FTC isn’t available before travel. The advisor disputes the supplier’s terms, or the refund needs a manual adjustment or exception. The right items are canceled, the numbers reconcile, the refund request is in the queue, and the advisor was told 14 business days."}, {"id": "refunds-b", "kind": "proc", "stage": "in", "title": "Supplier approves a refund during the trip", "aliases": ["unused nights", "supplier approved refund", "in-travel refund", "7-10", "7–10", "tbo", "eps", "voyager", "supplier funded", "classic funded", "line item", "left early"], "updated": "Updated Oct 28", "rule": "Fix the traveler’s situation first. Get the supplier’s position in writing. Balance the booking before you send the refund.", "use": "A supplier approves refunding unused nights or services, or a cancellation, while the traveler is on the trip.", "body": "<ol type=\"1\">\n<li>Solve what the traveler needs right now: a place to stay, a transfer, a flight.<\/li>\n<li>Get the supplier’s position in writing: the amount or nights, any waiver or fee, and whether they’ll protect the advisor’s commission.\n<ul>\n<li><strong>EPS:<\/strong> check Voyager for the supplier’s confirmation.<\/li>\n<li><strong>TBO:<\/strong> TBO’s written confirmation is enough to proceed. You won’t see when TBO’s money reaches Classic, so don’t wait for it.<\/li>\n<\/ul><\/li>\n<li>Who’s paying?\n<ul>\n<li><strong>Supplier-funded:<\/strong> lower the client price and the supplier cost to the approved amount.<\/li>\n<li><strong>Classic- or TSP-funded:<\/strong> lower the client price only. The supplier cost stays.<\/li>\n<\/ul><\/li>\n<li>Make a <strong>line-item adjustment<\/strong> on that specific item, not a booking-level adjustment. For hotel nights, use <a class=\"xref\" href=\"#refunds-c\">Work out a partial hotel-night refund<\/a>.<\/li>\n<li>Check Mod History, the line values, commission and the booking balance. Fix anything off first. Finance rejects unbalanced refunds.<\/li>\n<li>Handle commission in this order: the supplier protects it; or the TSP courtesy (up to $100 total per booking); or a normal recall.<\/li>\n<li>Submit the <strong>Plex Refund queue<\/strong> request: booking number, last four of the original card, exact amount, CHANGE or CANCEL.<\/li>\n<li>Tell the advisor the amount, <strong>7–10 business days<\/strong>, and any commission change.<\/li>\n<li>Remark <strong>AFYK<\/strong>. In Zendesk, note the supplier contact, the approval, your calculation and the refund request.<\/li>\n<\/ol>\n<p><strong>Supplier says no?<\/strong> Don’t promise money. Goodwill or FTC may be an option within your limits (<a class=\"xref\" href=\"#refunds-auth\">How much you can approve<\/a>). They’re separate from a refund.<\/p>", "escalate": "The traveler still needs service and the supplier won’t help, or the amount is beyond your authority or would drop margin below 5%.", "complete": "The traveler is taken care of, the booking balances, the refund request is submitted, and the advisor knows the amount and 7–10 business days.", "text": "Fix the traveler’s situation first. Get the supplier’s position in writing. Balance the booking before you send the refund. A supplier approves refunding unused nights or services, or a cancellation, while the traveler is on the trip. Solve what the traveler needs right now: a place to stay, a transfer, a flight. Get the supplier’s position in writing: the amount or nights, any waiver or fee, and whether they’ll protect the advisor’s commission. EPS: check Voyager for the supplier’s confirmation. TBO: TBO’s written confirmation is enough to proceed. You won’t see when TBO’s money reaches Classic, so don’t wait for it. Who’s paying? Supplier-funded: lower the client price and the supplier cost to the approved amount. Classic- or TSP-funded: lower the client price only. The supplier cost stays. Make a line-item adjustment on that specific item, not a booking-level adjustment. For hotel nights, use Work out a partial hotel-night refund . Check Mod History, the line values, commission and the booking balance. Fix anything off first. Finance rejects unbalanced refunds. Handle commission in this order: the supplier protects it; or the TSP courtesy (up to $100 total per booking); or a normal recall. Submit the Plex Refund queue request: booking number, last four of the original card, exact amount, CHANGE or CANCEL. Tell the advisor the amount, 7–10 business days , and any commission change. Remark AFYK . In Zendesk, note the supplier contact, the approval, your calculation and the refund request. Supplier says no? Don’t promise money. Goodwill or FTC may be an option within your limits ( How much you can approve ). They’re separate from a refund. The traveler still needs service and the supplier won’t help, or the amount is beyond your authority or would drop margin below 5%. The traveler is taken care of, the booking balances, the refund request is submitted, and the advisor knows the amount and 7–10 business days."}, {"id": "refunds-c", "kind": "proc", "stage": "in", "title": "Work out a partial hotel-night refund", "aliases": ["partial hotel night", "average nightly rate", "early departure", "free night", "left early", "minimum stay", "unused night"], "updated": null, "rule": "Divide by the nights that were actually paid, not by calendar nights.", "use": "A hotel approves refunding one or more unused nights.", "body": "<ol type=\"1\">\n<li>Read the hotel’s approval: number of nights or a fixed amount, any waived fee, and the new checkout date. <strong>If it names a fixed amount, use that.<\/strong><\/li>\n<li>Find the hotel line’s total client price, rooms and nights.<\/li>\n<li>Check for free-night offers (4th or 5th night free). Leaving early can also break a minimum-stay rule and remove the offer.<\/li>\n<li>Count the <strong>paid<\/strong> nights.<\/li>\n<li>Average nightly rate = hotel line total ÷ paid nights.<\/li>\n<li>Refund = average nightly rate × paid nights being refunded.<\/li>\n<li>Make the line-item adjustment, check the booking balances, submit the refund (as in <a class=\"xref\" href=\"#refunds-b\">Supplier approves a refund during the trip<\/a>, steps 5–9).<\/li>\n<\/ol>\n<p><strong>Example:<\/strong> a $900 hotel line for four nights with one free night is three paid nights. Refunding one paid night: $900 ÷ 3 = <strong>$300<\/strong>.<\/p>\n<p>If the room mix or rates make it unclear, escalate rather than guess.<\/p>", "escalate": "", "complete": "The hotel’s approval, the paid-night count, your math, the adjustment and the refund request all agree.", "text": "Divide by the nights that were actually paid, not by calendar nights. A hotel approves refunding one or more unused nights. Read the hotel’s approval: number of nights or a fixed amount, any waived fee, and the new checkout date. If it names a fixed amount, use that. Find the hotel line’s total client price, rooms and nights. Check for free-night offers (4th or 5th night free). Leaving early can also break a minimum-stay rule and remove the offer. Count the paid nights. Average nightly rate = hotel line total ÷ paid nights. Refund = average nightly rate × paid nights being refunded. Make the line-item adjustment, check the booking balances, submit the refund (as in Supplier approves a refund during the trip , steps 5–9). Example: a $900 hotel line for four nights with one free night is three paid nights. Refunding one paid night: $900 ÷ 3 = $300 . If the room mix or rates make it unclear, escalate rather than guess. The hotel’s approval, the paid-night count, your math, the adjustment and the refund request all agree."}, {"id": "refunds-d", "kind": "proc", "stage": "all", "title": "Move money to another Classic booking", "aliases": ["money transfer", "transfer funds", "move payment", "move funds", "res support", "sjccustomersupport", "transfer request", "money transfer request"], "updated": "Updated Oct 28", "rule": "Transfers go through the Money Transfer Request queue. Finance isn’t involved.", "use": "The advisor wants money on one booking moved to another Classic booking.", "body": "<ol type=\"1\">\n<li>Note the <strong>source<\/strong> booking, the <strong>destination<\/strong> booking and the amount.<\/li>\n<li>The destination booking must be in <strong>Option<\/strong> or <strong>Invoiced<\/strong> status.<\/li>\n<li>On the source booking, open the <strong>Money Transfer Request<\/strong> queue. Enter the source booking number, destination booking number and amount.<\/li>\n<li>As a backup, email <strong>Res Support<\/strong>, sjccustomersupport@classicvacations.com, so they can follow up and get it completed. Don’t email Finance.<\/li>\n<li>If money is left over to refund, submit it separately in the Plex Refund queue.<\/li>\n<li>Check the destination booking until the payment shows. Submitting isn’t the same as done.<\/li>\n<\/ol>", "escalate": "", "complete": "The money shows on the destination booking, both balances are right, and any separate refund is submitted.", "text": "Transfers go through the Money Transfer Request queue. Finance isn’t involved. The advisor wants money on one booking moved to another Classic booking. Note the source booking, the destination booking and the amount. The destination booking must be in Option or Invoiced status. On the source booking, open the Money Transfer Request queue. Enter the source booking number, destination booking number and amount. As a backup, email Res Support , sjccustomersupport@classicvacations.com, so they can follow up and get it completed. Don’t email Finance. If money is left over to refund, submit it separately in the Plex Refund queue. Check the destination booking until the payment shows. Submitting isn’t the same as done. The money shows on the destination booking, both balances are right, and any separate refund is submitted."}, {"id": "refunds-e", "kind": "proc", "stage": "all", "title": "Payment shows in CyberSource but not in Plex", "aliases": ["cybersource", "cybs", "duplicate charge", "charged twice", "not in plex", "payment missing", "migration", "double charge"], "updated": null, "rule": "Don’t take another payment, and don’t open a regular refund request.", "use": "A payment went through in CyberSource but isn’t in Plex, the card was charged twice, or a CyberSource refund isn’t showing in Plex.", "body": "<ol type=\"1\">\n<li>Find the transaction in CyberSource. Use the last four digits only. Never put a full card number in Zendesk.<\/li>\n<li>Decide what it is: a payment that didn’t post, a duplicate charge, or a refund that didn’t post.<\/li>\n<li>Email Finance, sjctafinance@classicvacations.com, with the booking number, last four, amount and what went wrong.<\/li>\n<li>Note Finance’s owner and reference, and the next update time.<\/li>\n<li>Tell the advisor what you’ve verified. Don’t say a duplicate was reversed until Finance confirms it.<\/li>\n<\/ol>", "escalate": "", "complete": "Finance has fixed it and Plex matches the card, or Finance owns it and the advisor knows the next update.", "text": "Don’t take another payment, and don’t open a regular refund request. A payment went through in CyberSource but isn’t in Plex, the card was charged twice, or a CyberSource refund isn’t showing in Plex. Find the transaction in CyberSource. Use the last four digits only. Never put a full card number in Zendesk. Decide what it is: a payment that didn’t post, a duplicate charge, or a refund that didn’t post. Email Finance, sjctafinance@classicvacations.com, with the booking number, last four, amount and what went wrong. Note Finance’s owner and reference, and the next update time. Tell the advisor what you’ve verified. Don’t say a duplicate was reversed until Finance confirms it. Finance has fixed it and Plex matches the card, or Finance owns it and the advisor knows the next update."}, {"id": "refunds-f", "kind": "proc", "stage": "all", "title": "Refund a Group booking", "aliases": ["group refund", "groups manager", "credit this card", "group id", "booking id", "group history"], "updated": null, "rule": "Group refunds process immediately. Check everything before you submit.", "use": "A Group booking has an approved refund.", "body": "<ol type=\"1\">\n<li>Find the <strong>Group ID<\/strong> and the right <strong>individual Booking ID<\/strong> (for example, GroupID-10). Don’t refund the group master or a similarly named traveler.<\/li>\n<li>If an adjustment is needed first, make it on the individual booking with the correct service date, then check the price, cost, commission and balance.<\/li>\n<li>Group commission is usually paid after travel. Don’t open a recall for commission that hasn’t been paid.<\/li>\n<li>In Groups Manager, go to <strong>Payment<\/strong>, then <strong>Show Payments for booking #<\/strong> and pick the booking.<\/li>\n<li>Right-click the card → <strong>Credit This Card<\/strong>. Enter the approved amount. A card can only get back what was charged to it; split across cards if needed.<\/li>\n<li>Check the Group ID, Booking ID, card and amount, then submit.<\/li>\n<li>Note it in <strong>Group History<\/strong> with the booking number, and in Zendesk.<\/li>\n<li>Tell the advisor the amount and the timing for when the change happened.<\/li>\n<\/ol>", "escalate": "The contract, margin or adjustment is unclear. Send Groups leadership the Group ID, Booking ID and the before-and-after numbers.", "complete": "The individual booking reconciles, the card credit went through, and Group History, Zendesk and the advisor are updated.", "text": "Group refunds process immediately. Check everything before you submit. A Group booking has an approved refund. Find the Group ID and the right individual Booking ID (for example, GroupID-10). Don’t refund the group master or a similarly named traveler. If an adjustment is needed first, make it on the individual booking with the correct service date, then check the price, cost, commission and balance. Group commission is usually paid after travel. Don’t open a recall for commission that hasn’t been paid. In Groups Manager, go to Payment , then Show Payments for booking # and pick the booking. Right-click the card → Credit This Card . Enter the approved amount. A card can only get back what was charged to it; split across cards if needed. Check the Group ID, Booking ID, card and amount, then submit. Note it in Group History with the booking number, and in Zendesk. Tell the advisor the amount and the timing for when the change happened. The contract, margin or adjustment is unclear. Send Groups leadership the Group ID, Booking ID and the before-and-after numbers. The individual booking reconciles, the card credit went through, and Group History, Zendesk and the advisor are updated."}, {"id": "refunds-g", "kind": "proc", "stage": "post", "title": "Refund questions after the trip", "aliases": ["refund status", "where is my refund", "post travel concern", "after travel", "complaint", "specialist"], "updated": null, "rule": "A trip ending doesn’t mean a form. Simple status questions are answered directly.", "use": "The trip is over and the advisor asks about a refund or raises a new complaint.", "body": "<ol type=\"1\">\n<li>Check Plex, Zendesk and any Post-Travel case.<\/li>\n<li>Note when the original change or cancellation happened. That sets the timing (14 business days pre-travel, 7–10 in-travel), not today’s call.<\/li>\n<\/ol>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>If<\/th>\n<th>Then<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>It’s just a status question<\/td>\n<td>Answer it from what’s in the queue or the booking.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>The refund is overdue<\/td>\n<td>Follow <a class=\"xref\" href=\"#refunds-x\">Expedited or overdue refund<\/a>.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>It’s a new complaint that will take more than 24 hours<\/td>\n<td>Give the advisor the <strong>Post Travel Concern<\/strong> form: https://app.smartsheet.com/b/form/219a2f5e09bf46cd811b53a5bc5ad7b1. They fill in their own account. Note everything you’ve already done so the specialist doesn’t start over.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>A specialist already has the case<\/td>\n<td>Send the new information to them. Don’t start a second investigation.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "escalate": "", "complete": "The status question has a verified answer, or a specialist has accepted the case and the advisor knows who has it.", "text": "A trip ending doesn’t mean a form. Simple status questions are answered directly. The trip is over and the advisor asks about a refund or raises a new complaint. Check Plex, Zendesk and any Post-Travel case. Note when the original change or cancellation happened. That sets the timing (14 business days pre-travel, 7–10 in-travel), not today’s call. If Then It’s just a status question Answer it from what’s in the queue or the booking. The refund is overdue Follow Expedited or overdue refund . It’s a new complaint that will take more than 24 hours Give the advisor the Post Travel Concern form: https://app.smartsheet.com/b/form/219a2f5e09bf46cd811b53a5bc5ad7b1. They fill in their own account. Note everything you’ve already done so the specialist doesn’t start over. A specialist already has the case Send the new information to them. Don’t start a second investigation. The status question has a verified answer, or a specialist has accepted the case and the advisor knows who has it."}, {"id": "refunds-x", "kind": "proc", "stage": "all", "title": "Expedited or overdue refund", "aliases": ["refund hasn’t arrived", "refund hasnt arrived", "not arrived", "arrived", "never got refund", "expedite", "expedited", "urgent refund", "overdue refund", "refund not received", "hasn’t received", "hasnt received", "late refund", "24-48", "24–48", "tara cardona", "lina hernandez", "sjctafinance"], "updated": "Updated Oct 28", "rule": "The Finance email never replaces the refund request. It goes with it.", "use": "There’s a reason to expedite, or the advisor says a refund hasn’t arrived.", "body": "<p><strong>Expedite only for:<\/strong> a duplicate charge, a refund already past its timeframe, a client charged in full when only partial payment was meant, or a request Classic missed.<\/p>\n<ol type=\"1\">\n<li>Confirm the reason qualifies.<\/li>\n<li>Make sure there’s a request in the <strong>Plex Refund queue<\/strong>.\n<ul>\n<li><strong>Expedited:<\/strong> submit it if it isn’t there yet.<\/li>\n<li><strong>Overdue:<\/strong> it should already be there. Check it’s past its timeframe (14 business days pre-travel, 7–10 in-travel). If it isn’t past yet, give the advisor the remaining time. If there’s no request, submit one and expedite it.<\/li>\n<\/ul><\/li>\n<li>Email <strong>sjctafinance@classicvacations.com<\/strong> with the booking number, last four of the card, amount, CHANGE or CANCEL, the original request date and why it’s urgent. For urgent requests, copy Tara Cardona and Lina Hernandez.<\/li>\n<li>Note Finance’s reply, who owns it, and the next update time.<\/li>\n<li>Don’t promise 24–48 hours until Finance confirms it’s expedited.<\/li>\n<\/ol>", "escalate": "", "complete": "The refund request exists, Finance has the email, and the advisor knows the next update time.", "text": "The Finance email never replaces the refund request. It goes with it. There’s a reason to expedite, or the advisor says a refund hasn’t arrived. Expedite only for: a duplicate charge, a refund already past its timeframe, a client charged in full when only partial payment was meant, or a request Classic missed. Confirm the reason qualifies. Make sure there’s a request in the Plex Refund queue . Expedited: submit it if it isn’t there yet. Overdue: it should already be there. Check it’s past its timeframe (14 business days pre-travel, 7–10 in-travel). If it isn’t past yet, give the advisor the remaining time. If there’s no request, submit one and expedite it. Email sjctafinance@classicvacations.com with the booking number, last four of the card, amount, CHANGE or CANCEL, the original request date and why it’s urgent. For urgent requests, copy Tara Cardona and Lina Hernandez. Note Finance’s reply, who owns it, and the next update time. Don’t promise 24–48 hours until Finance confirms it’s expedited. The refund request exists, Finance has the email, and the advisor knows the next update time."}, {"id": "refunds-adjust", "kind": "shared", "stage": "all", "title": "Line-item or booking-level adjustment?", "aliases": ["adjustment", "line item", "line-item", "booking level", "booking-level", "supplier funded", "classic funded", "mod history", "who pays"], "updated": null, "rule": "Adjust at the level of what actually changed. Never use a booking-level adjustment to hide a refund on one component.", "use": "", "body": "<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Adjustment<\/th>\n<th>Use it for<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Line-item<\/strong><\/td>\n<td>A change to one component: a supplier-approved refund or increase, a hotel refund due to TSP, a partial service refund<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Booking-level<\/strong><\/td>\n<td>Whole-booking commission changes, goodwill, an L2 or advisor error, paying for a service from commission, TSP in-travel commission protection<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Who’s paying?<\/strong> If the <strong>supplier<\/strong> refunds or waives it, lower the client price, the commission (unless protected) and the supplier cost. If <strong>Classic or TSP<\/strong> pays, lower the client price only; the supplier cost stays, because Classic still owes it.<\/p>\n<p>After saving, check <strong>Mod History<\/strong>: the final price, cost, commission and balance must match what was approved.<\/p>", "escalate": "", "complete": "", "text": "Adjust at the level of what actually changed. Never use a booking-level adjustment to hide a refund on one component. Adjustment Use it for Line-item A change to one component: a supplier-approved refund or increase, a hotel refund due to TSP, a partial service refund Booking-level Whole-booking commission changes, goodwill, an L2 or advisor error, paying for a service from commission, TSP in-travel commission protection Who’s paying? If the supplier refunds or waives it, lower the client price, the commission (unless protected) and the supplier cost. If Classic or TSP pays, lower the client price only; the supplier cost stays, because Classic still owes it. After saving, check Mod History : the final price, cost, commission and balance must match what was approved."}, {"id": "refunds-auth", "kind": "shared", "stage": "all", "title": "How much you can approve", "aliases": ["goodwill", "ftc", "future travel credit", "commission recall", "commission protection", "$100", "$250", "margin", "5%", "authority", "cvcommprotect"], "updated": null, "rule": "", "use": "", "body": "<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Tool<\/th>\n<th>Limit<\/th>\n<th>When<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Refund of money already on the booking<\/td>\n<td>No dollar limit, but it must be valid<\/td>\n<td>Any stage<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Goodwill<\/td>\n<td>Up to <strong>$100 total per booking<\/strong>, only if Classic’s net margin stays <strong>5% or more<\/strong>. Otherwise leadership approves, whatever the amount.<\/td>\n<td>In-Travel and Post-Travel<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Future Travel Credit (FTC)<\/td>\n<td>Up to <strong>$250 total per booking<\/strong> (FIT or Group). Above that, leadership. It’s future value, not a refund.<\/td>\n<td>In-Travel and Post-Travel. Never pre-travel.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>TSP commission courtesy<\/td>\n<td>Up to <strong>$100 total per booking<\/strong>, booking must have TSP<\/td>\n<td>In-Travel changes only<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Full-cancellation commission protection<\/td>\n<td>Formal claim to Commission Protection, cvcommprotect@classicvacations.com<\/td>\n<td>When the plan qualifies<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Group bookings<\/td>\n<td>The group contract controls. Check with Groups before any exception.<\/td>\n<td>Any stage<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Record what’s already been used on the booking (goodwill, FTC, courtesy) so the next person knows what’s left. Never reduce a client’s valid refund to protect the advisor’s commission.<\/p>", "escalate": "", "complete": "", "text": "Tool Limit When Refund of money already on the booking No dollar limit, but it must be valid Any stage Goodwill Up to $100 total per booking , only if Classic’s net margin stays 5% or more . Otherwise leadership approves, whatever the amount. In-Travel and Post-Travel Future Travel Credit (FTC) Up to $250 total per booking (FIT or Group). Above that, leadership. It’s future value, not a refund. In-Travel and Post-Travel. Never pre-travel. TSP commission courtesy Up to $100 total per booking , booking must have TSP In-Travel changes only Full-cancellation commission protection Formal claim to Commission Protection, cvcommprotect@classicvacations.com When the plan qualifies Group bookings The group contract controls. Check with Groups before any exception. Any stage Record what’s already been used on the booking (goodwill, FTC, courtesy) so the next person knows what’s left. Never reduce a client’s valid refund to protect the advisor’s commission."}]}, {"id": "payments", "group": "Money", "title": "Payments and VCC", "sub": "Taking payment, splits, net payments, links, declines, CyberSource and VCC", "compare": "<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><\/th>\n<th>Pre-Travel<\/th>\n<th>In-Travel<\/th>\n<th>Post-Travel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Main job<\/td>\n<td>Take the authorized amount and verify it applied<\/td>\n<td>Keep the traveler’s stay secure; VCC or charge problems are urgent<\/td>\n<td>Confirm what actually posted or reversed<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Who helps<\/td>\n<td>Leadership after two declines; Finance for CyberSource gaps<\/td>\n<td>The property, Finance, and CS leadership after hours<\/td>\n<td>Finance<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "items": [{"id": "pay-take", "kind": "proc", "stage": "pre", "title": "Take a payment", "aliases": ["take payment", "apply payment", "deposit", "final payment", "balance", "8x8", "masking", "cybersource hosted page", "token", "card on file", "pay"], "updated": null, "rule": "Charge only what the advisor authorizes, and don’t say it worked until Plex or CyberSource shows it.", "use": "The advisor wants to pay a deposit, the balance, or another amount.", "body": "<p><strong>Stop first:<\/strong> if anything on the booking is <strong>Pending Request<\/strong> or <strong>Not Reserved<\/strong>, don’t take payment. Tell the advisor confirmation is still outstanding.<\/p>\n<ol type=\"1\">\n<li>Recap traveler names, dates and the amount with the advisor.<\/li>\n<li>If there’s air, check the ticketing deadline (TAW) and that names, birthdates and middle names are complete for ticketing.<\/li>\n<li>In <strong>Pricing Summary<\/strong>, check the balance, minimum deposit and final payment.<\/li>\n<li>Ask: minimum deposit, full balance, or another amount? And which card type?<\/li>\n<li>Turn on <strong>8x8 masking<\/strong> before collecting card details on a recorded call.<\/li>\n<li>Go to <strong>Pricing Summary → Apply Payments<\/strong> and choose <strong>Total Gross Payment<\/strong>, <strong>Minimum Deposit<\/strong> or <strong>Other<\/strong>.<\/li>\n<li>Use the stored token if that’s the card they want. Otherwise open the <strong>CyberSource Hosted Page<\/strong> and enter the cardholder name, full billing address, card type, number, expiration and security code. Make sure the card type in Plex matches the card.<\/li>\n<li>Recap the amount, then select <strong>Pay<\/strong> and wait.<\/li>\n<li>If it worked, confirm the amount applied and what’s still due.<\/li>\n<li>Turn masking off, and add the payment remark.<\/li>\n<\/ol>\n<table>\n<thead>\n<tr class=\"header\">\n<th>If<\/th>\n<th>Then<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>The advisor wants to split it across cards<\/td>\n<td><a class=\"xref\" href=\"#pay-split\">Split a payment across cards<\/a><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>The advisor wants to pay net of commission<\/td>\n<td><a class=\"xref\" href=\"#pay-net\">Net payment (advisor pays without their commission)<\/a><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>It declines<\/td>\n<td><a class=\"xref\" href=\"#pay-decline\">Card declined<\/a><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>You can’t tell whether it ran<\/td>\n<td><a class=\"xref\" href=\"#pay-cybs\">Check whether a card actually ran (CyberSource)<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "escalate": "", "complete": "The right booking was used, the amount shows applied, masking is back on, the advisor knows what’s left, and the remark is in.", "text": "Charge only what the advisor authorizes, and don’t say it worked until Plex or CyberSource shows it. The advisor wants to pay a deposit, the balance, or another amount. Stop first: if anything on the booking is Pending Request or Not Reserved , don’t take payment. Tell the advisor confirmation is still outstanding. Recap traveler names, dates and the amount with the advisor. If there’s air, check the ticketing deadline (TAW) and that names, birthdates and middle names are complete for ticketing. In Pricing Summary , check the balance, minimum deposit and final payment. Ask: minimum deposit, full balance, or another amount? And which card type? Turn on 8x8 masking before collecting card details on a recorded call. Go to Pricing Summary → Apply Payments and choose Total Gross Payment , Minimum Deposit or Other . Use the stored token if that’s the card they want. Otherwise open the CyberSource Hosted Page and enter the cardholder name, full billing address, card type, number, expiration and security code. Make sure the card type in Plex matches the card. Recap the amount, then select Pay and wait. If it worked, confirm the amount applied and what’s still due. Turn masking off, and add the payment remark. If Then The advisor wants to split it across cards Split a payment across cards The advisor wants to pay net of commission Net payment (advisor pays without their commission) It declines Card declined You can’t tell whether it ran Check whether a card actually ran (CyberSource) The right booking was used, the amount shows applied, masking is back on, the advisor knows what’s left, and the remark is in."}, {"id": "pay-split", "kind": "proc", "stage": "pre", "title": "Split a payment across cards", "aliases": ["split payment", "two cards", "multiple cards", "split cards", "other amount"], "updated": null, "rule": "Use Other for each card. The self-service payment link can’t split payments.", "use": "The advisor wants to pay with more than one card.", "body": "<ol type=\"1\">\n<li>Confirm the total and how the advisor wants it split.<\/li>\n<li>Process the first card for its exact amount using <strong>Other<\/strong>.<\/li>\n<li>Check it worked before you run the next card.<\/li>\n<li>Process each remaining card the same way.<\/li>\n<li>Check the payments add up to what the advisor authorized.<\/li>\n<li>Recap any remaining balance.<\/li>\n<\/ol>", "escalate": "Any card declines twice. See <a class=\"xref\" href=\"#pay-decline\">Card declined<\/a>.", "complete": "Each card ran for its exact amount, the total matches, masking is back on, and the remark is in.", "text": "Use Other for each card. The self-service payment link can’t split payments. The advisor wants to pay with more than one card. Confirm the total and how the advisor wants it split. Process the first card for its exact amount using Other . Check it worked before you run the next card. Process each remaining card the same way. Check the payments add up to what the advisor authorized. Recap any remaining balance. Any card declines twice. See Card declined . Each card ran for its exact amount, the total matches, masking is back on, and the remark is in."}, {"id": "pay-net", "kind": "proc", "stage": "pre", "title": "Net payment (advisor pays without their commission)", "aliases": ["net payment", "pay net", "net with tax", "minus commission", "commission deducted"], "updated": null, "rule": "Use the booking’s Net with Tax figure. Never share the hotel’s or supplier’s net rate; that’s Classic-confidential.", "use": "The advisor wants to pay the package minus their commission.", "body": "<ol type=\"1\">\n<li>Find <strong>Net with Tax<\/strong> in the Booking Summary.<\/li>\n<li>Check what’s already been paid.<\/li>\n<li>Amount to collect = Net with Tax − payments already made.<\/li>\n<li>Go to <strong>Apply Payments → Other<\/strong> and enter that amount.<\/li>\n<li>Process it like any other payment and confirm the new balance.<\/li>\n<\/ol>", "escalate": "Net with Tax doesn’t reconcile with the payments already made.", "complete": "The amount collected equals Net with Tax minus prior payments, the balance is confirmed, and the remark is in.", "text": "Use the booking’s Net with Tax figure. Never share the hotel’s or supplier’s net rate; that’s Classic-confidential. The advisor wants to pay the package minus their commission. Find Net with Tax in the Booking Summary. Check what’s already been paid. Amount to collect = Net with Tax − payments already made. Go to Apply Payments → Other and enter that amount. Process it like any other payment and confirm the new balance. Net with Tax doesn’t reconcile with the payments already made. The amount collected equals Net with Tax minus prior payments, the balance is confirmed, and the remark is in."}, {"id": "pay-link", "kind": "proc", "stage": "pre", "title": "Send a secure payment link", "aliases": ["payment link", "secure link", "pay link", "client pay", "self pay", "classic assist", "my bookings"], "updated": null, "rule": "", "use": "The advisor or client wants to enter card details themselves.", "body": "<ol type=\"1\">\n<li>Open the advisor-facing <strong>TA Control<\/strong> view and go to <strong>My Bookings<\/strong>.<\/li>\n<li>Find the booking and select <strong>Payment Link<\/strong>.<\/li>\n<li>Enter the recipient’s email: advisor or client, whichever was asked for.<\/li>\n<li>Remove the CC to yourself unless there’s a reason for a copy.<\/li>\n<li>Send it, and tell the advisor it’s the secure way to enter card details.<\/li>\n<\/ol>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>If<\/th>\n<th>Then<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>They need to split the payment<\/td>\n<td>The link can’t do it. Have the advisor call with the cards ready (<a class=\"xref\" href=\"#pay-split\">Split a payment across cards<\/a>).<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>The advisor wants to send it themselves<\/td>\n<td>Walk them through Classic Assist → My Bookings → Payment Link, or send it for them.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "escalate": "The recipient can’t pay through the link, or a payment shows in CyberSource but not in Plex.", "complete": "The link went to the right person, and the payment is verified when it arrives or someone owns the follow-up.", "text": "The advisor or client wants to enter card details themselves. Open the advisor-facing TA Control view and go to My Bookings . Find the booking and select Payment Link . Enter the recipient’s email: advisor or client, whichever was asked for. Remove the CC to yourself unless there’s a reason for a copy. Send it, and tell the advisor it’s the secure way to enter card details. If Then They need to split the payment The link can’t do it. Have the advisor call with the cards ready ( Split a payment across cards ). The advisor wants to send it themselves Walk them through Classic Assist → My Bookings → Payment Link, or send it for them. The recipient can’t pay through the link, or a payment shows in CyberSource but not in Plex. The link went to the right person, and the payment is verified when it arrives or someone owns the follow-up."}, {"id": "pay-decline", "kind": "proc", "stage": "pre", "title": "Card declined", "aliases": ["declined", "decline", "card declined", "payment failed", "two declines", "card not working"], "updated": null, "rule": "Two declines, then stop and get leadership to look in CyberSource.", "use": "A card payment was declined.", "body": "<ol type=\"1\">\n<li>Don’t assume the card is bad on the first decline.<\/li>\n<li>Recheck card type, number, expiration, security code, billing address and amount.<\/li>\n<li>Fix any mistake and try <strong>once more<\/strong>.<\/li>\n<li>If it fails twice, stop. Don’t keep trying.<\/li>\n<li>Ask a supervisor or lead to check the decline reason in CyberSource before you go further.<\/li>\n<\/ol>", "escalate": "", "complete": "The payment worked after a fix, or a named person owns the decline and the advisor knows the next step.", "text": "Two declines, then stop and get leadership to look in CyberSource. A card payment was declined. Don’t assume the card is bad on the first decline. Recheck card type, number, expiration, security code, billing address and amount. Fix any mistake and try once more . If it fails twice, stop. Don’t keep trying. Ask a supervisor or lead to check the decline reason in CyberSource before you go further. The payment worked after a fix, or a named person owns the decline and the advisor knows the next step."}, {"id": "pay-cybs", "kind": "proc", "stage": "all", "title": "Check whether a card actually ran (CyberSource)", "aliases": ["cybersource", "did it run", "check payment", "transaction search", "account suffix", "payment not showing", "approved not posted"], "updated": null, "rule": "", "use": "Plex doesn’t clearly show whether a payment went through, or the advisor says they tried to pay.", "body": "<ol type=\"1\">\n<li>Sign in to <strong>CyberSource Business Center<\/strong> with your own login and MFA. Never save logins or codes anywhere.<\/li>\n<li>Open <strong>Transactions<\/strong>, then the transaction search.<\/li>\n<li>Get only the <strong>last four digits<\/strong> of the card and enter them under <strong>Account Suffix<\/strong>.<\/li>\n<li>Open the most recent match and make sure it belongs to this booking.<\/li>\n<li><strong>Green<\/strong> means approved. <strong>Blue or red<\/strong> means it didn’t go through; open it to see why (for example, a decline or an address mismatch).<\/li>\n<li><strong>Approved in CyberSource but not on the booking:<\/strong> email Finance to have it moved to the booking (<a class=\"xref\" href=\"#refunds-e\">Payment shows in CyberSource but not in Plex<\/a>).<\/li>\n<li>Note what you found. Never record a full card number.<\/li>\n<\/ol>", "escalate": "", "complete": "You know whether it ran, and anything approved but not posted is with Finance.", "text": "Plex doesn’t clearly show whether a payment went through, or the advisor says they tried to pay. Sign in to CyberSource Business Center with your own login and MFA. Never save logins or codes anywhere. Open Transactions , then the transaction search. Get only the last four digits of the card and enter them under Account Suffix . Open the most recent match and make sure it belongs to this booking. Green means approved. Blue or red means it didn’t go through; open it to see why (for example, a decline or an address mismatch). Approved in CyberSource but not on the booking: email Finance to have it moved to the booking ( Payment shows in CyberSource but not in Plex ). Note what you found. Never record a full card number. You know whether it ran, and anything approved but not posted is with Finance."}, {"id": "pay-vcc", "kind": "proc", "stage": "in", "title": "Hotel or vendor has a VCC problem", "aliases": ["vcc", "virtual card", "vcc expired", "vcc declined", "vcc link", "bcc", "vendor payment", "hotel not paid", "cad vcc", "weekend vcc"], "updated": null, "rule": "The vendor submits the VCC request. You can submit it for them, but always include a vendor contact.", "use": "A hotel or vendor calls about a VCC that’s missing, expired or declined.", "body": "<p><strong>Finance handles:<\/strong> an expired VCC link, a VCC never received, a vendor who can’t find the link, a VCC needed for a CAD booking, and VCCs declined for insufficient funds or late activation.<\/p>\n<ol type=\"1\">\n<li>Confirm the property is paid by VCC, not by invoice.<\/li>\n<li>Pin down the exact problem and the booking or CAD details.<\/li>\n<li>Give the vendor the <strong>VCC request form<\/strong>: https://app.smartsheet.com/b/form/5e7a13c6d51f47329169689a3515335b. Ask them to submit it. If you submit it for them, include a vendor contact Finance can reach.<\/li>\n<li>Need help right away during Finance hours? Call the Finance queue, <strong>(408) 794-3200<\/strong>, Monday–Friday, 8:00 a.m.–5:00 p.m.<\/li>\n<li><strong>Urgent VCC for a CAD booking:<\/strong> use the urgent form, https://app.smartsheet.com/b/form/0e43972dc1ad4261951536f8dc699eb8<\/li>\n<li><strong>After hours or weekends:<\/strong> contact CS leadership. They use the Teams channel <strong>VCC Urgent Requests-Weekend Support<\/strong>.<\/li>\n<li>Note the booking, property, exact issue, the form or ticket, and the vendor contact.<\/li>\n<\/ol>", "escalate": "The traveler is at check-in or checkout, the property threatens to charge the traveler, or it’s after Finance hours.", "complete": "The Finance ticket is in and the vendor and traveler have a clear plan for right now.", "text": "The vendor submits the VCC request. You can submit it for them, but always include a vendor contact. A hotel or vendor calls about a VCC that’s missing, expired or declined. Finance handles: an expired VCC link, a VCC never received, a vendor who can’t find the link, a VCC needed for a CAD booking, and VCCs declined for insufficient funds or late activation. Confirm the property is paid by VCC, not by invoice. Pin down the exact problem and the booking or CAD details. Give the vendor the VCC request form : https://app.smartsheet.com/b/form/5e7a13c6d51f47329169689a3515335b. Ask them to submit it. If you submit it for them, include a vendor contact Finance can reach. Need help right away during Finance hours? Call the Finance queue, (408) 794-3200 , Monday–Friday, 8:00 a.m.–5:00 p.m. Urgent VCC for a CAD booking: use the urgent form, https://app.smartsheet.com/b/form/0e43972dc1ad4261951536f8dc699eb8 After hours or weekends: contact CS leadership. They use the Teams channel VCC Urgent Requests-Weekend Support . Note the booking, property, exact issue, the form or ticket, and the vendor contact. The traveler is at check-in or checkout, the property threatens to charge the traveler, or it’s after Finance hours. The Finance ticket is in and the vendor and traveler have a clear plan for right now."}, {"id": "pay-hotel-direct", "kind": "proc", "stage": "in", "title": "Hotel charged the traveler for a prepaid stay", "aliases": ["hotel charged traveler", "charged card", "prepaid hotel charge", "hold on card", "double charged", "incidental hold"], "updated": null, "rule": "This is urgent. The traveler may be without access to their money while traveling.", "use": "The hotel charged the traveler’s card for a stay Classic already paid, or put a large wrong hold on it.", "body": "<ol type=\"1\">\n<li>Confirm the booking was prepaid. Note the amount charged or held, and whether it’s pending or posted.<\/li>\n<li>Call the property and ask for an immediate reversal or release.<\/li>\n<li>Escalate to Finance and leadership. Don’t just tell the traveler to wait several business days if it’s affecting their trip.<\/li>\n<li><strong>After hours or weekends:<\/strong> contact CS leadership, who use the Teams channel <strong>VCC Urgent Requests-Weekend Support<\/strong>.<\/li>\n<li>Note every amount, who you spoke to, any reversal reference and the expected timing.<\/li>\n<\/ol>", "escalate": "The property won’t reverse it, the traveler can’t continue the trip, or Finance can’t be reached during an emergency.", "complete": "The charge is reversed or released, or an approved interim fix is in place and owned.", "text": "This is urgent. The traveler may be without access to their money while traveling. The hotel charged the traveler’s card for a stay Classic already paid, or put a large wrong hold on it. Confirm the booking was prepaid. Note the amount charged or held, and whether it’s pending or posted. Call the property and ask for an immediate reversal or release. Escalate to Finance and leadership. Don’t just tell the traveler to wait several business days if it’s affecting their trip. After hours or weekends: contact CS leadership, who use the Teams channel VCC Urgent Requests-Weekend Support . Note every amount, who you spoke to, any reversal reference and the expected timing. The property won’t reverse it, the traveler can’t continue the trip, or Finance can’t be reached during an emergency. The charge is reversed or released, or an approved interim fix is in place and owned."}]}, {"id": "recovery", "group": "Money", "title": "Goodwill and Future Travel Credit", "sub": "Service recovery: what to try first, and your limits", "compare": "<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><\/th>\n<th>Pre-Travel<\/th>\n<th>In-Travel<\/th>\n<th>Post-Travel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Goodwill<\/td>\n<td>Not available<\/td>\n<td>Up to $100 per booking if margin stays 5%+<\/td>\n<td>Same, through the specialist<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Future Travel Credit<\/td>\n<td>Not available<\/td>\n<td>Up to $250 per booking<\/td>\n<td>Up to $250 per booking<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>First try<\/td>\n<td>The normal change, refund or protection process<\/td>\n<td>Fix the service, then supplier recovery<\/td>\n<td>The specialist’s investigation<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "items": [{"id": "rec-order", "kind": "shared", "stage": "in post", "title": "Service recovery, in this order", "aliases": ["service recovery", "compensation", "make it right", "order", "is compensation warranted"], "updated": null, "rule": "", "use": "", "body": "<ol type=\"1\">\n<li>Fix the problem while the traveler is still there. Look for a way to make it right that isn’t money.<\/li>\n<li>If the supplier caused it, get the supplier to make it right first.<\/li>\n<li>Decide whether compensation is warranted at all. Not every complaint is. Ask what actually failed, and whether the supplier, Classic, or the traveler or advisor was responsible.<\/li>\n<li>If it is, choose the tool:\n<ul>\n<li><strong>Goodwill<\/strong> (cash): up to <strong>$100<\/strong> per booking.<\/li>\n<li><strong>Future Travel Credit:<\/strong> up to <strong>$250<\/strong> per booking. Often the better fit once the trip is over, or when the supplier stands by its policy and a refund isn’t appropriate.<\/li>\n<\/ul><\/li>\n<li>Size it to what happened and the booking. $250 may be too little on an $80,000 trip; a late transfer doesn’t warrant $500.<\/li>\n<li>Escalate when the right answer is beyond your authority, or you’re unsure.<\/li>\n<\/ol>\n<p>Don’t give the company away, and don’t spend an hour arguing over something you have the authority to fix.<\/p>", "escalate": "", "complete": "", "text": "Fix the problem while the traveler is still there. Look for a way to make it right that isn’t money. If the supplier caused it, get the supplier to make it right first. Decide whether compensation is warranted at all. Not every complaint is. Ask what actually failed, and whether the supplier, Classic, or the traveler or advisor was responsible. If it is, choose the tool: Goodwill (cash): up to $100 per booking. Future Travel Credit: up to $250 per booking. Often the better fit once the trip is over, or when the supplier stands by its policy and a refund isn’t appropriate. Size it to what happened and the booking. $250 may be too little on an $80,000 trip; a late transfer doesn’t warrant $500. Escalate when the right answer is beyond your authority, or you’re unsure. Don’t give the company away, and don’t spend an hour arguing over something you have the authority to fix."}, {"id": "rec-goodwill", "kind": "proc", "stage": "in post", "title": "Give goodwill", "aliases": ["goodwill", "compensation", "credit", "$100", "margin", "5%", "sorry money", "make good"], "updated": null, "rule": "Up to $100 per booking, only if Classic’s net margin stays at 5% or more. Goodwill is for a real service failure, not an automatic answer to unhappiness.", "use": "There was a Classic service failure and a small payment is the right fix.", "body": "<ol type=\"1\">\n<li>Check the booking’s current net margin. If goodwill would take it <strong>below 5%<\/strong>, stop and get leadership approval, whatever the amount.<\/li>\n<li>Check any goodwill or adjustments already on the booking.<\/li>\n<li>Separate what the supplier owes from what Classic would pay.<\/li>\n<li>Choose the smallest amount that fairly addresses the impact.<\/li>\n<li>Apply it as a <strong>booking-level adjustment<\/strong>.<\/li>\n<li>Note the reason and the total goodwill now used on the booking.<\/li>\n<\/ol>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>If<\/th>\n<th>Then<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>The ask is over $100<\/td>\n<td>Don’t split it. Escalate.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>A request that wasn’t guaranteed wasn’t met<\/td>\n<td>Try to fix it first. Goodwill isn’t automatic.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "escalate": "Over $100, margin would drop below 5%, or it’s a high-profile or sensitive case.", "complete": "The adjustment is posted correctly and the caller understands the resolution.", "text": "Up to $100 per booking, only if Classic’s net margin stays at 5% or more. Goodwill is for a real service failure, not an automatic answer to unhappiness. There was a Classic service failure and a small payment is the right fix. Check the booking’s current net margin. If goodwill would take it below 5% , stop and get leadership approval, whatever the amount. Check any goodwill or adjustments already on the booking. Separate what the supplier owes from what Classic would pay. Choose the smallest amount that fairly addresses the impact. Apply it as a booking-level adjustment . Note the reason and the total goodwill now used on the booking. If Then The ask is over $100 Don’t split it. Escalate. A request that wasn’t guaranteed wasn’t met Try to fix it first. Goodwill isn’t automatic. Over $100, margin would drop below 5%, or it’s a high-profile or sensitive case. The adjustment is posted correctly and the caller understands the resolution."}, {"id": "rec-ftc", "kind": "proc", "stage": "in post", "title": "Issue a Future Travel Credit", "aliases": ["ftc", "future travel credit", "ftc certificate", "certificate pdf", "forms and templates", "scanner", "closed pt files", "h drive", "credit for next trip", "$250", "travel credit", "voucher", "24 months", "same agency", "expire", "redeem ftc"], "updated": null, "rule": "Up to $250 total per booking; above that, leadership. FTC is separate from a refund, and never a pre-travel option.", "use": "A service recovery credit has been approved to resolve an in-travel or post-travel concern.", "body": "<ol type=\"1\">\n<li><strong>Confirm the resolution.<\/strong> Review the complaint, the supplier’s response, and any compensation already given (<a class=\"xref\" href=\"#rec-order\">Service recovery, in this order<\/a>).<\/li>\n<li><strong>Check your authority.<\/strong> Look for any FTC already issued on the booking. The total must stay within <strong>$250<\/strong>, or get leadership approval.<\/li>\n<li><strong>Complete the FTC Certificate PDF.<\/strong> Open it from <code>H:\\Call Center\\Customer Service\\Resources\\Forms and Templates<\/code>. Enter the booking, traveler, credit and authorization details.<\/li>\n<li><strong>Check the certificate.<\/strong> Confirm the amount, booking details and terms before you send it.<\/li>\n<li><strong>Email the advisor.<\/strong> Recap the resolution and attach the certificate. Keep it clean: no internal or supplier correspondence. Explain the terms:<\/li>\n<\/ol>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Rule<\/th>\n<th>What it means<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Valid for <strong>24 months<\/strong> from the date issued<\/td>\n<td>Give the advisor the expiry date.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>The new trip needs <strong>two or more components<\/strong><\/td>\n<td>Hotel, transfer or car rental count. <strong>TSP doesn’t<\/strong> count as the second component.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Same agency<\/strong><\/td>\n<td>It must be booked through the agency it was issued to. Any advisor at that agency can use it.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>No leftover balance<\/strong><\/td>\n<td>If the new booking costs less than the credit, the rest is lost.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Any destination<\/strong><\/td>\n<td>It isn’t tied to the original hotel, destination or component.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ol start=\"6\" type=\"1\">\n<li><strong>Save it.<\/strong> Save the completed certificate and supporting emails in <code>H:\\Call Center\\Customer Service\\Scanner (Closed PT files)<\/code>, filed under the booking number.<\/li>\n<li><strong>Record it.<\/strong> Note the amount, reason, any approval, and that it was sent, in Plex (or Groups Manager) and Zendesk.<\/li>\n<li><strong>Close or continue the case.<\/strong> If it’s a Post-Travel specialist file, finish the case-closure process once everything is done.<\/li>\n<\/ol>", "escalate": "The FTC would exceed $250 total per booking, the resolution needs an exception, or eligibility is unclear.", "complete": "The certificate is accurate, sent to the advisor, saved with the case records, and recorded in the right systems.", "text": "Up to $250 total per booking; above that, leadership. FTC is separate from a refund, and never a pre-travel option. A service recovery credit has been approved to resolve an in-travel or post-travel concern. Confirm the resolution. Review the complaint, the supplier’s response, and any compensation already given ( Service recovery, in this order ). Check your authority. Look for any FTC already issued on the booking. The total must stay within $250 , or get leadership approval. Complete the FTC Certificate PDF. Open it from H:\\Call Center\\Customer Service\\Resources\\Forms and Templates . Enter the booking, traveler, credit and authorization details. Check the certificate. Confirm the amount, booking details and terms before you send it. Email the advisor. Recap the resolution and attach the certificate. Keep it clean: no internal or supplier correspondence. Explain the terms: Rule What it means Valid for 24 months from the date issued Give the advisor the expiry date. The new trip needs two or more components Hotel, transfer or car rental count. TSP doesn’t count as the second component. Same agency It must be booked through the agency it was issued to. Any advisor at that agency can use it. No leftover balance If the new booking costs less than the credit, the rest is lost. Any destination It isn’t tied to the original hotel, destination or component. Save it. Save the completed certificate and supporting emails in H:\\Call Center\\Customer Service\\Scanner (Closed PT files) , filed under the booking number. Record it. Note the amount, reason, any approval, and that it was sent, in Plex (or Groups Manager) and Zendesk. Close or continue the case. If it’s a Post-Travel specialist file, finish the case-closure process once everything is done. The FTC would exceed $250 total per booking, the resolution needs an exception, or eligibility is unclear. The certificate is accurate, sent to the advisor, saved with the case records, and recorded in the right systems."}]}, {"id": "commission", "group": "Money", "title": "Commission and agency fees", "sub": "Recalls, protection, extra commission and in-trip fees", "compare": "<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><\/th>\n<th>Pre-Travel<\/th>\n<th>In-Travel<\/th>\n<th>Post-Travel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Commission protection<\/td>\n<td>Not available<\/td>\n<td>Up to $100 total per booking, TSP required<\/td>\n<td>Same, if it was an in-travel change<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Agency fee<\/td>\n<td>Normal process<\/td>\n<td>Only with a paid modification; never on its own<\/td>\n<td>—<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Recall<\/td>\n<td>Normal<\/td>\n<td>Check supplier protection, then TSP courtesy, then recall<\/td>\n<td>Check whether commission was actually paid first<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "items": [{"id": "comm-recall", "kind": "proc", "stage": "in post", "title": "A change lowers the advisor’s commission", "aliases": ["commission recall", "commission payout", "when is commission paid", "7-14", "commission protection", "protect commission", "$100 commission", "tsp courtesy", "commission reduced", "cvcommprotect"], "updated": null, "rule": "Goodwill and commission protection are different. Goodwill fixes a service problem. Commission protection needs TSP and an in-travel change.", "use": "A refund, early departure, reduction or cancellation lowers commission.", "body": "<ol type=\"1\">\n<li>Has the <strong>supplier<\/strong> agreed to protect the commission? If so, keep the approved commission and note the supplier’s approval.<\/li>\n<li>If not, does the <strong>TSP courtesy<\/strong> apply? It needs TSP on the booking and an in-travel change. Up to <strong>$100 total per booking<\/strong>, not per item; check the notes for any already used.<\/li>\n<li>If neither applies, adjust or recall the commission.<\/li>\n<li>Tell the advisor about any recall or reduction.<\/li>\n<li>Note the original and new commission, and any protection used and left.<\/li>\n<\/ol>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>If<\/th>\n<th>Then<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>It’s a full cancellation with TSP<\/td>\n<td>Not the $100 courtesy. Use the formal commission protection claim: cvcommprotect@classicvacations.com.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>The advisor asks you to cut the client’s refund to save commission<\/td>\n<td>Don’t. They’re handled separately.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>The advisor asks when commission will be paid<\/td>\n<td>Commission payouts take <strong>7–14 business days<\/strong>. That’s separate from the client’s refund timing.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "escalate": "The treatment is unclear, a whole-booking adjustment is needed, or the request is over the $100 limit.", "complete": "The booking shows the right commission and the advisor knows.", "text": "Goodwill and commission protection are different. Goodwill fixes a service problem. Commission protection needs TSP and an in-travel change. A refund, early departure, reduction or cancellation lowers commission. Has the supplier agreed to protect the commission? If so, keep the approved commission and note the supplier’s approval. If not, does the TSP courtesy apply? It needs TSP on the booking and an in-travel change. Up to $100 total per booking , not per item; check the notes for any already used. If neither applies, adjust or recall the commission. Tell the advisor about any recall or reduction. Note the original and new commission, and any protection used and left. If Then It’s a full cancellation with TSP Not the $100 courtesy. Use the formal commission protection claim: cvcommprotect@classicvacations.com. The advisor asks you to cut the client’s refund to save commission Don’t. They’re handled separately. The advisor asks when commission will be paid Commission payouts take 7–14 business days . That’s separate from the client’s refund timing. The treatment is unclear, a whole-booking adjustment is needed, or the request is over the $100 limit. The booking shows the right commission and the advisor knows."}, {"id": "comm-extra", "kind": "proc", "stage": "in post", "title": "Request extra commission after an in-trip addition", "aliases": ["additional commission", "extra commission", "commission payout", "extension commission"], "updated": null, "rule": "When you take payment for something added mid-trip, request the commission it earns. It doesn’t happen by itself.", "use": "You added a night, tour or service during the trip and took payment.", "body": "<ol type=\"1\">\n<li>Confirm what was added and that payment was taken.<\/li>\n<li>Work out the extra commission.<\/li>\n<li>Open the commission request workflow and enter the booking number and amount.<\/li>\n<li>Note the request.<\/li>\n<\/ol>", "escalate": "The calculation or payout method is unclear.", "complete": "The commission request is submitted and noted.", "text": "When you take payment for something added mid-trip, request the commission it earns. It doesn’t happen by itself. You added a night, tour or service during the trip and took payment. Confirm what was added and that payment was taken. Work out the extra commission. Open the commission request workflow and enter the booking number and amount. Note the request. The calculation or payout method is unclear. The commission request is submitted and noted."}, {"id": "comm-fee", "kind": "proc", "stage": "in", "title": "Agency or planning fee during the trip", "aliases": ["agency fee", "planning fee", "service fee", "add fee", "fee during travel", "group agency fee"], "updated": null, "rule": "No agency fee on its own during travel. It only goes on with a paid change.", "use": "The advisor asks you to add an agency or planning fee while the client is traveling.", "body": "<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>If<\/th>\n<th>Then<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>There’s a booking change with money due<\/td>\n<td>Make the change, add the fee, take payment for both, then open the agency-fee payout queue.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>There’s no change or nothing to pay<\/td>\n<td>Don’t add the fee on its own.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>It’s a Group booking<\/td>\n<td>Never add an agency fee. Groups handles it.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Planning fees can’t exceed $10,000.<\/p>", "escalate": "The advisor disputes the rule or asks for an exception.", "complete": "Payment and the agency-fee payout are both done or routed.", "text": "No agency fee on its own during travel. It only goes on with a paid change. The advisor asks you to add an agency or planning fee while the client is traveling. If Then There’s a booking change with money due Make the change, add the fee, take payment for both, then open the agency-fee payout queue. There’s no change or nothing to pay Don’t add the fee on its own. It’s a Group booking Never add an agency fee. Groups handles it. Planning fees can’t exceed $10,000. The advisor disputes the rule or asks for an exception. Payment and the agency-fee payout are both done or routed."}]}, {"id": "tsp", "group": "Money", "title": "Trip Protection (TSP)", "sub": "Plans, repricing, adding, claims and what you can say", "compare": "<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><\/th>\n<th>Pre-Travel<\/th>\n<th>In-Travel<\/th>\n<th>Post-Travel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Main job<\/td>\n<td>Right plan, right price after every change<\/td>\n<td>Check TSP before any cancellation or commission decision<\/td>\n<td>Point claims to TripMate<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>What you can say<\/td>\n<td>Plan benefits and maximums<\/td>\n<td>What the plan documents show<\/td>\n<td>Where to file; never the outcome<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "items": [{"id": "tsp-plans", "kind": "shared", "stage": "all", "title": "The plans", "aliases": ["tsp", "plans", "bronze", "silver", "gold", "platinum", "uf287", "cfar", "cancel for any reason", "waiver", "part a", "part b"], "updated": null, "rule": "", "use": "", "body": "<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Plan<\/th>\n<th>Client gets<\/th>\n<th>Advisor gets<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Change &amp; Cancel Waiver only<\/td>\n<td>Two published-air change fees per person; eligible hotel/land penalties up to $10,000<\/td>\n<td>11–15% commission; no insurance or commission protection<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Bronze UF287B (can be added until final payment)<\/td>\n<td>In-travel insurance (interruption, delay, baggage, medical, evacuation, assistance); no pre-travel waiver<\/td>\n<td>15% commission; no commission protection<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Silver UF287L<\/td>\n<td>Waiver up to $15,000 per reservation; in-travel insurance<\/td>\n<td>15%; commission protection up to $250<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Gold UF287G<\/td>\n<td>Waiver up to $25,000; in-travel insurance; published-air cancellation up to 100% for a covered reason<\/td>\n<td>15%; commission protection up to $1,500<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Platinum UF287P<\/td>\n<td>Waiver up to $50,000; in-travel insurance; published-air protection; Cancel For Any Reason up to 75% on non-refundable published air<\/td>\n<td>15%; commission protection up to $2,500<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Part A (Classic):<\/strong> pre-travel penalty coverage, per booking. <strong>Part B (TripMate):<\/strong> in-travel insurance, per person.<\/p>", "escalate": "", "complete": "", "text": "Plan Client gets Advisor gets Change &amp; Cancel Waiver only Two published-air change fees per person; eligible hotel/land penalties up to $10,000 11–15% commission; no insurance or commission protection Bronze UF287B (can be added until final payment) In-travel insurance (interruption, delay, baggage, medical, evacuation, assistance); no pre-travel waiver 15% commission; no commission protection Silver UF287L Waiver up to $15,000 per reservation; in-travel insurance 15%; commission protection up to $250 Gold UF287G Waiver up to $25,000; in-travel insurance; published-air cancellation up to 100% for a covered reason 15%; commission protection up to $1,500 Platinum UF287P Waiver up to $50,000; in-travel insurance; published-air protection; Cancel For Any Reason up to 75% on non-refundable published air 15%; commission protection up to $2,500 Part A (Classic): pre-travel penalty coverage, per booking. Part B (TripMate): in-travel insurance, per person."}, {"id": "tsp-change", "kind": "proc", "stage": "pre", "title": "Check TSP after any booking change", "aliases": ["reprice tsp", "add tsp", "upgrade tsp", "downgrade", "5 days", "deposit", "one and done", "pre-existing", "tsp price"], "updated": null, "rule": "TSP is priced on the total package. Check it before you leave the booking after any price change.", "use": "The booking price changed, or the advisor wants to add or change protection.", "body": "<ol type=\"1\">\n<li>Confirm the new total booking price.<\/li>\n<li>Is the booking before or after deposit?<\/li>\n<li>Apply the rule:<\/li>\n<\/ol>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Situation<\/th>\n<th>TSP<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Before deposit, price goes up <strong>or<\/strong> down<\/td>\n<td>Reprice it<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>After deposit, price goes <strong>up<\/strong><\/td>\n<td>Reprice it<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>After deposit, price goes <strong>down<\/strong><\/td>\n<td>Leave it<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ol start=\"4\" type=\"1\">\n<li>Check the TSP price now matches.<\/li>\n<li>Note what you did, then finish the change recap.<\/li>\n<\/ol>\n<p><strong>Adding or changing a plan:<\/strong><\/p>\n<ul>\n<li>Add within <strong>5 days of deposit<\/strong>. Bronze can be added until final payment, but after 5 days it loses pre-existing-condition coverage.<\/li>\n<li>After deposit, a plan can be <strong>upgraded<\/strong> (when the price goes up or components are added) but <strong>never downgraded or removed<\/strong>.<\/li>\n<li><strong>One and done:<\/strong> pre-travel penalty coverage ends after the first penalty. To keep it, they must buy protection again. In-travel benefits stay active.<\/li>\n<\/ul>", "escalate": "The plan rule is unclear.", "complete": "The protection matches the package value under the rule, and the action is noted.", "text": "TSP is priced on the total package. Check it before you leave the booking after any price change. The booking price changed, or the advisor wants to add or change protection. Confirm the new total booking price. Is the booking before or after deposit? Apply the rule: Situation TSP Before deposit, price goes up or down Reprice it After deposit, price goes up Reprice it After deposit, price goes down Leave it Check the TSP price now matches. Note what you did, then finish the change recap. Adding or changing a plan: Add within 5 days of deposit . Bronze can be added until final payment, but after 5 days it loses pre-existing-condition coverage. After deposit, a plan can be upgraded (when the price goes up or components are added) but never downgraded or removed . One and done: pre-travel penalty coverage ends after the first penalty. To keep it, they must buy protection again. In-travel benefits stay active. The plan rule is unclear. The protection matches the package value under the rule, and the action is noted."}, {"id": "tsp-questions", "kind": "proc", "stage": "all", "title": "Coverage and claim questions", "aliases": ["coverage", "claim", "tripmate", "is it covered", "insurance", "medical", "commission protection claim", "30 days", "not covered", "licensed"], "updated": null, "rule": "Explain the plan. Never promise a claim will be paid.", "use": "The advisor asks what’s covered, how to claim, or whether a situation qualifies.", "body": "<p><strong>You can tell them:<\/strong> which plan is on the booking, what was charged, whether a change needs repricing, and the plan’s benefit amounts and maximums.<\/p>\n<p><strong>Send to TripMate (1-844-207-1929):<\/strong> any specific coverage or claim question. L2 isn’t a licensed insurance agent.<\/p>\n<p><strong>Don’t present these as covered:<\/strong> name changes, no-shows, denied boarding, missing documents, airline schedule changes, price increases from the client’s own changes, and missed flights (a missed <strong>connection<\/strong> can be different).<\/p>\n<p><strong>Cancel For Any Reason (Platinum):<\/strong> 75% back when cancelled more than 48 hours before departure; 100% for covered reasons, under the plan terms. Published air: Gold and Platinum 100% for covered reasons; Platinum 75% for any reason when the CFAR timing is met.<\/p>\n<p><strong>Commission protection claim<\/strong> (full cancellation only) needs all four: paid in full, fully cancelled (not partial), not paid with the advisor’s or agency’s card, and filed within 30 days of cancellation. Send to cvcommprotect@classicvacations.com.<\/p>\n<p><strong>During travel:<\/strong> always check TSP before a cancellation or commission decision, and still ask suppliers for waivers. Lower penalties help the client and the claim. <strong>Groups:<\/strong> Group TSP is more restrictive and mostly insurance (Part B); refer claims to TripMate.<\/p>", "escalate": "", "complete": "The advisor has the plan facts and, for claims, the TripMate contact.", "text": "Explain the plan. Never promise a claim will be paid. The advisor asks what’s covered, how to claim, or whether a situation qualifies. You can tell them: which plan is on the booking, what was charged, whether a change needs repricing, and the plan’s benefit amounts and maximums. Send to TripMate (1-844-207-1929): any specific coverage or claim question. L2 isn’t a licensed insurance agent. Don’t present these as covered: name changes, no-shows, denied boarding, missing documents, airline schedule changes, price increases from the client’s own changes, and missed flights (a missed connection can be different). Cancel For Any Reason (Platinum): 75% back when cancelled more than 48 hours before departure; 100% for covered reasons, under the plan terms. Published air: Gold and Platinum 100% for covered reasons; Platinum 75% for any reason when the
