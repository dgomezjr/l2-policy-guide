<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L2 Operations & Policy Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600;6..72,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --onyx:#25282C; --pearl:#FBF9F9; --swell:#106E81; --swell-dark:#0B4E5C; --latte:#9A8478; --lush:#A6BB9E; --pample:#F3776A; --gold:#C9B178;
  --bg:#F5F3EF; --panel:#FFFFFF; --side:#FBF9F9; --line:#E4E1DA; --hover:#F0ECE4;
  --ink:#25282C; --ink-2:#5B5F63; --ink-3:#7E8287;
  --pre:#106E81; --pre-bg:#EAF4F6; --pre-ink:#0B4E5C;
  --in:#B0912F; --in-bg:#FBF3DD; --in-ink:#6E5714;
  --post:#9A8478; --post-bg:#F3EEEA; --post-ink:#5E4B41;
  --any-bg:#ECEAE6; --any-ink:#4C5055;
  --rule-bg:#EAF4F6; --rule-line:#106E81; --rule-ink:#0B4E5C;
  --warn-bg:#FDEEEC; --warn-line:#F3776A; --warn-ink:#B23E2E;
  --done-bg:#F0F4EE; --done-line:#A6BB9E; --done-ink:#4C6444;
  --mark:#FCE8B5;
  --serif:'Newsreader',Georgia,serif; --sans:'Inter',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1B1D20; --panel:#24272B; --side:#202326; --line:#383C42; --hover:#2E3237;
  --ink:#F1EEEA; --ink-2:#C5C2BD; --ink-3:#9A9893;
  --pre:#5FB3C4; --pre-bg:#1C363C; --pre-ink:#A9DCE6;
  --in:#D9BC5F; --in-bg:#3A321B; --in-ink:#EBD68E;
  --post:#C2AC9F; --post-bg:#3A302A; --post-ink:#E0CFC4;
  --any-bg:#33363B; --any-ink:#D2CFCA;
  --rule-bg:#1C363C; --rule-line:#5FB3C4; --rule-ink:#A9DCE6;
  --warn-bg:#43231F; --warn-line:#F3776A; --warn-ink:#F8B2A9;
  --done-bg:#253020; --done-line:#8FAF82; --done-ink:#C6DDBB;
  --mark:#5A4A1C; --swell:#5FB3C4; --swell-dark:#A9DCE6; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1B1D20; --panel:#24272B; --side:#202326; --line:#383C42; --hover:#2E3237;
  --ink:#F1EEEA; --ink-2:#C5C2BD; --ink-3:#9A9893;
  --pre:#5FB3C4; --pre-bg:#1C363C; --pre-ink:#A9DCE6;
  --in:#D9BC5F; --in-bg:#3A321B; --in-ink:#EBD68E;
  --post:#C2AC9F; --post-bg:#3A302A; --post-ink:#E0CFC4;
  --any-bg:#33363B; --any-ink:#D2CFCA;
  --rule-bg:#1C363C; --rule-line:#5FB3C4; --rule-ink:#A9DCE6;
  --warn-bg:#43231F; --warn-line:#F3776A; --warn-ink:#F8B2A9;
  --done-bg:#253020; --done-line:#8FAF82; --done-ink:#C6DDBB;
  --mark:#5A4A1C; --swell:#5FB3C4; --swell-dark:#A9DCE6; color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
a{color:var(--swell)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--swell);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 14px}
.menu{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex:none}
.brand{font:700 16px/1.1 var(--serif);white-space:nowrap;text-decoration:none;color:var(--ink)}
.search{position:relative;flex:1;min-width:0}
.search input{width:100%;font:inherit;font-size:14.5px;padding:8px 12px 8px 34px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--swell)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;max-height:min(65vh,460px);overflow:auto;display:none;z-index:40;box-shadow:0 6px 20px rgba(37,40,44,.12)}
.results.show{display:block}
.res{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 14px;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.res:hover,.res.sel{background:var(--hover)}
.res .t{font-weight:600;font-size:14.5px}
.res .m{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.res mark{background:var(--mark);color:inherit;border-radius:2px}
.res-empty{padding:14px;color:var(--ink-2);font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;background:var(--bg);flex:none}
.seg button{border:0;background:none;padding:5px 10px;border-radius:7px;font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.seg button i{width:8px;height:8px;border-radius:50%}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.seg button[data-s="pre"][aria-pressed="true"]{background:var(--pre-bg);color:var(--pre-ink);box-shadow:inset 0 0 0 1px var(--pre)}
.seg button[data-s="in"][aria-pressed="true"]{background:var(--in-bg);color:var(--in-ink);box-shadow:inset 0 0 0 1px var(--in)}
.seg button[data-s="post"][aria-pressed="true"]{background:var(--post-bg);color:var(--post-ink);box-shadow:inset 0 0 0 1px var(--post)}
.seg .lbl{font-size:12px;color:var(--ink-3);padding:0 4px 0 6px;align-self:center;white-space:nowrap}

.layout{display:flex}
.side{width:248px;flex:none;background:var(--side);border-right:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);align-self:flex-start;height:calc(100vh - 53px - env(safe-area-inset-top,0px));overflow:auto;padding:16px 10px 30px}
.side.closed{display:none}
.side a{display:block;padding:6px 10px;border-radius:7px;color:var(--ink-2);text-decoration:none;font-size:13.5px;line-height:1.35}
.side a:hover{background:var(--hover);color:var(--ink)}
.side a.on{background:var(--swell);color:#fff;font-weight:600}
.side .home-link{font-weight:700;color:var(--ink);font-size:14px;margin-bottom:6px}
.sgrp{margin:0 0 4px}
.grp-h{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:none;padding:9px 10px;border-radius:8px;font:700 14px/1.3 var(--sans);color:var(--ink);text-align:left}
.grp-h:hover{background:var(--hover)}
.grp-h .chev{flex:none;color:var(--ink-2);transition:transform .15s ease}
.sgrp.closed .grp-h .chev{transform:rotate(-90deg)}
.grp-items{margin:0 0 8px 14px;padding-left:8px;border-left:2px solid var(--line)}
.sgrp.closed .grp-items{display:none}
.side .sub{margin:2px 0 6px 10px;border-left:2px solid var(--line);padding-left:4px}
.side .sub a{display:flex;gap:8px;align-items:baseline;font-size:12.5px;padding:4px 8px}
.side .sub a i{flex:none;width:7px;height:7px;border-radius:50%}
.side .sub a.dim{opacity:.4}
.side .more{margin:14px 10px 0;font-size:12px;color:var(--ink-3);line-height:1.45}

main{flex:1;min-width:0;padding:22px 26px 80px}
.wrap::after{content:"";display:block;height:calc(100vh - 260px)}
.wrap{max-width:820px;margin:0 auto}
h1{font:700 30px/1.15 var(--serif);margin:0 0 2px}
.sub-h{color:var(--ink-2);margin:0 0 16px}
.dot-pre{background:var(--pre)}.dot-in{background:var(--in)}.dot-post{background:var(--post)}.dot-all{background:var(--line)}
.chip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip.pre{background:var(--pre-bg);color:var(--pre-ink)}.chip.in{background:var(--in-bg);color:var(--in-ink)}.chip.post{background:var(--post-bg);color:var(--post-ink)}.chip.all{background:var(--any-bg);color:var(--any-ink)}
.chip.upd{background:var(--done-bg);color:var(--done-ink)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 22px 14px;margin:0 0 16px;box-shadow:0 1px 2px rgba(37,40,44,.05),0 6px 20px rgba(37,40,44,.04)}
.card[hidden]{display:none}
.card{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 70px)}
.card-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.badge{flex:none;font-size:11.5px;font-weight:700;border-radius:6px;padding:3px 8px;margin-top:4px;white-space:nowrap}
.badge.pre{background:var(--pre);color:#fff}.badge.in{background:var(--in);color:#2D2408}.badge.post{background:var(--post);color:#fff}.badge.all{background:var(--any-bg);color:var(--any-ink)}
.card-h h2{font:700 20px/1.25 var(--serif);margin:0;flex:1}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;margin-top:2px}
.tbtn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:3px 8px;font-size:12px;color:var(--ink-2)}
.tbtn:hover{border-color:var(--ink-3);color:var(--ink)}
.use{color:var(--ink-2);font-size:14.5px;margin:0 0 10px}
.callout{border-radius:10px;padding:10px 14px;margin:8px 0 12px;border-left:4px solid var(--rule-line);background:var(--rule-bg);font-size:14.5px}
.callout b{display:block;font-size:11.5px;letter-spacing:.04em;color:var(--rule-ink);margin-bottom:1px}
.callout.warn{border-left-color:var(--warn-line);background:var(--warn-bg)}.callout.warn b{color:var(--warn-ink)}
.callout.done{border-left-color:var(--done-line);background:var(--done-bg)}.callout.done b{color:var(--done-ink)}
.callout.todo{border:1.5px dashed var(--in);border-left:4px solid var(--in);background:var(--in-bg)}.callout.todo b{color:var(--in-ink)}
.body p{margin:0 0 10px}
.body h4{font:700 16px var(--serif);margin:16px 0 6px}
.body ul,.body ol{margin:0 0 12px;padding-left:24px}
.body li{margin:0 0 6px}
.body ol>li.chk{list-style:none;position:relative;margin-left:-24px;padding-left:32px}
.body ol>li.chk>input{position:absolute;left:3px;top:4px;width:17px;height:17px;accent-color:var(--done-line);cursor:pointer}
.body ol>li.chk.done>.lbl{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line)}
.num{font-weight:700;color:var(--ink-3);margin-right:6px;font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto;margin:6px 0 14px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;vertical-align:top;padding:8px 11px;border-bottom:1px solid var(--line)}
th{background:var(--hover);font-weight:700;font-size:12.5px}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:600;color:var(--ink-2)}
.compare-card{padding:14px 16px 6px}
.compare-card h2{font:700 17px var(--serif);margin:0 0 8px}
.compare th.on{background:var(--hl);color:var(--hl-ink)}.compare td.on{background:var(--hl)}
.compare .off{color:var(--ink-3)}
.compare.s-pre{--hl:var(--pre-bg);--hl-ink:var(--pre-ink)}.compare.s-in{--hl:var(--in-bg);--hl-ink:var(--in-ink)}.compare.s-post{--hl:var(--post-bg);--hl-ink:var(--post-ink)}
.note{font-size:13.5px;color:var(--ink-2);background:var(--hover);border-radius:10px;padding:8px 12px;margin:0 0 16px}
.note button{border:0;background:none;color:var(--swell);text-decoration:underline;padding:0;font-size:13.5px}
.reflink{font-weight:600;text-decoration:none;border-bottom:1px solid currentColor}
.autolink{word-break:break-word}
.body code{font:13px/1.4 ui-monospace,Consolas,monospace;background:var(--hover);border:1px solid var(--line);border-radius:5px;padding:1px 5px;word-break:break-all}
.copy{border:0;background:none;padding:0 3px;color:var(--ink-3);vertical-align:-2px}
.copy:hover{color:var(--swell)}
.ok{color:var(--done-ink)!important}

.home h1{font-size:32px}
.sits{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px;margin:0 0 20px}
.grp{font:700 17px var(--serif);display:flex;align-items:center;gap:8px;margin:18px 0 8px}
.grp i{width:9px;height:9px;border-radius:50%}
.sit{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:10px 14px}
.sit:hover{background:var(--hover)}
.sit span{flex:1;font-size:14.5px;line-height:1.35}
.sit em{font-style:normal;font-size:11px;font-weight:700;color:var(--ink-3)}
.intopic{display:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 16px}
.side.closed~main .intopic{display:block}
.intopic b,.foot b{display:block;font-size:12px;color:var(--ink-3);margin-bottom:4px}
.intopic a{display:flex;gap:8px;align-items:baseline;padding:4px 2px;font-size:14px;text-decoration:none;color:var(--ink)}
.intopic a i{flex:none;width:8px;height:8px;border-radius:50%}
.intopic a.dim{display:none}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:14px;margin-top:8px}
.foot b{flex-basis:100%}
.foot a{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;text-decoration:none;color:var(--ink);font-size:14px}
.foot a:hover{background:var(--hover)}
.xref{font-weight:600}

@media (max-width:760px){
  .side{position:fixed;left:0;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:25;box-shadow:0 0 30px rgba(0,0,0,.2)}
  .seg .lbl{display:none}
}
@media (max-width:640px){
  .bar{flex-wrap:wrap}
  .brand{display:none}
  .search{flex-basis:calc(100% - 48px)}
  .seg{width:100%;justify-content:space-between}
  .seg button{flex:1;justify-content:center;padding:6px 4px;font-size:12.5px}
  main{padding:16px 12px 70px}
  .card{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 112px)}
  .card{padding:14px 14px 10px}
  .side{top:calc(env(safe-area-inset-top,0px) + 96px);height:calc(100vh - 96px - env(safe-area-inset-top,0px))}
}
</style>
</head>
<body>
<header class="bar">
  <button class="menu" id="menu" aria-label="Show topics" aria-expanded="true"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M2 4.5h14M2 9h14M2 13.5h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  <a class="brand" href="#home">L2 Guide</a>
  <div class="search" role="search">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5.2" stroke="currentColor" stroke-width="1.5"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>

  </div>
</header>
<div class="layout">
  <nav class="side" id="side" aria-label="Topics"></nav>
  <main><div class="wrap" id="view"></div></main>
</div>
<script>const DATA = {"topics": [{"id": "start", "group": "Start here", "title": "How L2 works", "sub": "Stages, priorities and who owns what", "compare": "<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><\/th>\n<th>Pre-Travel<\/th>\n<th>In-Travel<\/th>\n<th>Post-Travel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>First priority<\/td>\n<td>Deadlines, contract, payment and the advisor’s approval before touching anything<\/td>\n<td>The traveler’s safety and their next service<\/td>\n<td>Who already owns it, and whether it’s a simple answer or a new complaint<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>L2 owns<\/td>\n<td>Normal servicing; Flights, Finance and Groups keep their own controls<\/td>\n<td>The live fix, coordinating vendors, Flights and Finance<\/td>\n<td>Simple verified answers; the Post-Travel specialist owns extended cases<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "items": [{"id": "start-stage", "kind": "shared", "stage": "all", "title": "Which stage is the traveler in?", "aliases": ["stage", "pre-travel", "in-travel", "post-travel", "departure day", "last day", "when does travel start", "first component", "handoff rule"], "updated": null, "rule": "The stage decides refund timing and what you can approve. The handoff rule decides who owns the case. Check both.", "use": "", "body": "<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Stage<\/th>\n<th>When<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Pre-Travel<\/strong><\/td>\n<td>Before the first component begins, <strong>including the day of departure<\/strong> until then.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>In-Travel<\/strong><\/td>\n<td>From the moment the first component begins (the first flight departs, or they check into the first hotel) until the trip ends. <strong>The last day is still In-Travel.<\/strong><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Post-Travel<\/strong><\/td>\n<td>The trip has ended.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Stage and ownership are separate questions.<\/strong> The stage is about where the traveler is. Who owns the case is a different rule: an issue on the <strong>last day or after<\/strong> that will take <strong>more than 24 hours<\/strong> goes to a Post-Travel specialist (<a class=\"xref\" href=\"#post-handoff\">Hand off to Post-Travel<\/a>), even though a last-day traveler is still In-Travel.<\/p>\n<p><strong>Refund timing follows when the change happened, not when they call.<\/strong> A pre-travel cancellation asked about after the trip still gets 14 business days.<\/p>", "escalate": "", "complete": "", "text": "The stage decides refund timing and what you can approve. The handoff rule decides who owns the case. Check both. Stage When Pre-Travel Before the first component begins, including the day of departure until then. In-Travel From the moment the first component begins (the first flight departs, or they check into the first hotel) until the trip ends. The last day is still In-Travel. Post-Travel The trip has ended. Stage and ownership are separate questions. The stage is about where the traveler is. Who owns the case is a different rule: an issue on the last day or after that will take more than 24 hours goes to a Post-Travel specialist ( Hand off to Post-Travel ), even though a last-day traveler is still In-Travel. Refund timing follows when the change happened, not when they call. A pre-travel cancellation asked about after the trip still gets 14 business days."}, {"id": "start-rules", "kind": "shared", "stage": "all", "title": "The ground rules", "aliases": ["ownership", "priority", "dependency", "handoff", "rules", "not sure"], "updated": null, "rule": "", "use": "", "body": "<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>If<\/th>\n<th>Then<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>The traveler is unsafe or stranded<\/td>\n<td>Fix that first and involve leadership. Money questions come later.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Another team owes you one task<\/td>\n<td>It’s a dependency, not a handoff. You still own the case until they accept all of it.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>The trip is over and it’s a simple status question<\/td>\n<td>Answer it. No form needed.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>An instruction here doesn’t work in the system<\/td>\n<td>Stop and ask your lead. Don’t improvise.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>You’d have to guess at a rule, code or exception<\/td>\n<td>Escalate (<a class=\"xref\" href=\"#esc-when\">When to escalate<\/a>).<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "escalate": "", "complete": "", "text": "If Then The traveler is unsafe or stranded Fix that first and involve leadership. Money questions come later. Another team owes you one task It’s a dependency, not a handoff. You still own the case until they accept all of it. The trip is over and it’s a simple status question Answer it. No form needed. An instruction here doesn’t work in the system Stop and ask your lead. Don’t improvise. You’d have to guess at a rule, code or exception Escalate ( When to escalate )."}]}, {"id": "plex", "group": "Booking and Plex", "title": "Plex: review, queues and recaps", "sub": "Read the booking before you touch it, work the queues, recap every change", "compare": "", "items": [{"id": "plex-review", "kind": "shared", "stage": "all", "title": "Before you change anything", "aliases": ["booking review", "mod history", "other history", "pending request", "not reserved", "land amend", "before changing"], "updated": null, "rule": "Plex is the record. Read it before you add to it. Work one booking at a time and finish it before you start the next.", "use": "", "body": "<ol type=\"1\">\n<li>Confirm the booking number and who you’re speaking with.<\/li>\n<li>Read the remarks and recent Other History first, especially entries from the start of travel.<\/li>\n<li>Check payment status and balance.<\/li>\n<li>Check each component’s status: Confirmed, <strong>Pending Request<\/strong>, <strong>Not Reserved<\/strong>, or option.<\/li>\n<li>Check travel dates and how close travel is.<\/li>\n<li>Read the cancellation and change terms before releasing or replacing confirmed space.<\/li>\n<li>If money will change, check commission and prior adjustments. Use Mod History when you need to know what changed and when.<\/li>\n<\/ol>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>If<\/th>\n<th>Then<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Anything is <strong>Pending Request<\/strong> or <strong>Not Reserved<\/strong><\/td>\n<td>Don’t take payment and don’t call it confirmed. Get it confirmed first.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>The supplier or airline changed something outside Plex<\/td>\n<td>Note the live record on the booking. Don’t send an outdated Plex document as proof.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>The traveler is already traveling and a later date changes<\/td>\n<td>Avoid Land Amend; components may already be in penalty. Tell the vendor directly.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "escalate": "", "complete": "", "text": "Plex is the record. Read it before you add to it. Work one booking at a time and finish it before you start the next. Confirm the booking number and who you’re speaking with. Read the remarks and recent Other History first, especially entries from the start of travel. Check payment status and balance. Check each component’s status: Confirmed, Pending Request , Not Reserved , or option. Check travel dates and how close travel is. Read the cancellation and change terms before releasing or replacing confirmed space. If money will change, check commission and prior adjustments. Use Mod History when you need to know what changed and when. If Then Anything is Pending Request or Not Reserved Don’t take payment and don’t call it confirmed. Get it confirmed first. The supplier or airline changed something outside Plex Note the live record on the booking. Don’t send an outdated Plex document as proof. The traveler is already traveling and a later date changes Avoid Land Amend; components may already be in penalty. Tell the vendor directly."}, {"id": "plex-queues", "kind": "proc", "stage": "all", "title": "Work a Plex workflow queue", "aliases": ["queue", "workflow queue", "items on request", "taw within 2 days", "deposit due", "hotel penalties", "close message queue", "communication summary", "res agent reminder"], "updated": null, "rule": "A booking stays in the queue until the issue is fixed and the message is closed. Fix first, close second.", "use": "You’re working the daily Plex queues, or a booking is sitting in one.", "body": "<ol type=\"1\">\n<li>From the Plex Home page, open <strong>Queue<\/strong>.<\/li>\n<li>Select <strong>View<\/strong>, then <strong>Show All Users<\/strong> if you need the full workflow view.<\/li>\n<li>Use <strong>WORKFLOW_QUEUE_NAME<\/strong> to see what’s needed, and open the booking.<\/li>\n<li>For an individual or internal item, go to <strong>Communications → Internal<\/strong>.<\/li>\n<li>Open the <strong>Description<\/strong>, read the message, and do the work it asks for.<\/li>\n<li>Go back to <strong>Communication Summary → Internal<\/strong> and select <strong>OPEN<\/strong> under Status.<\/li>\n<li>To close it, select <strong>Close Message Queue<\/strong>, then <strong>Update<\/strong>. Don’t add to or erase the original comment text.<\/li>\n<\/ol>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Queue<\/th>\n<th>What it means<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Items on Request<\/td>\n<td>Something still needs confirmation. Follow it until the booking updates.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>TAW within 2 days<\/td>\n<td>Air needs payment or ticketing before the PNR cancels. See <a class=\"xref\" href=\"#air-a\">Paid air isn’t ticketed<\/a>.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Deposit Due Reminder<\/td>\n<td>Payment is due or the booking may cancel.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Hotel Penalties<\/td>\n<td>The hotel is in or about to enter penalty. Check payment and protection.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>QA Error<\/td>\n<td>Something on the booking is wrong, such as a date mismatch or duplicate room. Fix it. See <a class=\"xref\" href=\"#qa-paid\">QA a paid booking<\/a>.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Advising<\/td>\n<td>An itinerary gap, missing comment or transfer-on-own note. See <a class=\"xref\" href=\"#qa-paid\">QA a paid booking<\/a>.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Advising Kickback<\/td>\n<td>Vendor or Product feedback. See <a class=\"xref\" href=\"#pending-kickback\">Work an Advising Kickback<\/a>.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Major Schedule Change, RA Confirmation, Failed FF Verification<\/td>\n<td>Follow the instructions from Flights. See <a class=\"xref\" href=\"#air-d\">Airline schedule change<\/a>.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Res Agent Reminder<\/td>\n<td>A reminder an agent set. Follow up on it.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "escalate": "", "complete": "The underlying issue is fixed, the Communication Summary is updated, and the queue message is closed with the original comment untouched.", "text": "A booking stays in the queue until the issue is fixed and the message is closed. Fix first, close second. You’re working the daily Plex queues, or a booking is sitting in one. From the Plex Home page, open Queue . Select View , then Show All Users if you need the full workflow view. Use WORKFLOW_QUEUE_NAME to see what’s needed, and open the booking. For an individual or internal item, go to Communications → Internal . Open the Description , read the message, and do the work it asks for. Go back to Communication Summary → Internal and select OPEN under Status. To close it, select Close Message Queue , then Update . Don’t add to or erase the original comment text. Queue What it means Items on Request Something still needs confirmation. Follow it until the booking updates. TAW within 2 days Air needs payment or ticketing before the PNR cancels. See Paid air isn’t ticketed . Deposit Due Reminder Payment is due or the booking may cancel. Hotel Penalties The hotel is in or about to enter penalty. Check payment and protection. QA Error Something on the booking is wrong, such as a date mismatch or duplicate room. Fix it. See QA a paid booking . Advising An itinerary gap, missing comment or transfer-on-own note. See QA a paid booking . Advising Kickback Vendor or Product feedback. See Work an Advising Kickback . Major Schedule Change, RA Confirmation, Failed FF Verification Follow the instructions from Flights. See Airline schedule change . Res Agent Reminder A reminder an agent set. Follow up on it. The underlying issue is fixed, the Communication Summary is updated, and the queue message is closed with the original comment untouched."}, {"id": "plex-recap", "kind": "shared", "stage": "all", "title": "Recap after every change", "aliases": ["recap", "summary", "after change"], "updated": null, "rule": "Recap every change, every booking, top to bottom, every time. It’s your last check for errors.", "use": "", "body": "<ol type=\"1\">\n<li>Re-read the dates, names, component status and price.<\/li>\n<li>Check anything connected that could have been affected: air, transfers, protection, tours, hotel nights.<\/li>\n<li>If the price changed, state the new total and payment status.<\/li>\n<li>Say what’s still pending, and who’s following up.<\/li>\n<\/ol>", "escalate": "", "complete": "", "text": "Recap every change, every booking, top to bottom, every time. It’s your last check for errors. Re-read the dates, names, component status and price. Check anything connected that could have been affected: air, transfers, protection, tours, hotel nights. If the price changed, state the new total and payment status. Say what’s still pending, and who’s following up."}]}, {"id": "changes", "group": "Booking and Plex", "title": "Booking changes", "sub": "Dates, rooms, adding and removing components", "compare": "<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><\/th>\n<th>Pre-Travel<\/th>\n<th>In-Travel<\/th>\n<th>Post-Travel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Approach<\/td>\n<td>Price it, explain it, get buy-in, then commit<\/td>\n<td>Make sure the traveler has a safe current solution first; tell the vendor directly<\/td>\n<td>Review what was used and approved; new disputes go to the specialist<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Air in the change<\/td>\n<td>Ticketed air goes to Flights<\/td>\n<td>Airline or Flights<\/td>\n<td>Post-Travel specialist<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Done when<\/td>\n<td>Changes confirmed, everything connected updated, full recap sent<\/td>\n<td>Traveler has a confirmed solution and the vendors know<\/td>\n<td>The answer is verified, or the specialist owns it<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "items": [{"id": "changes-check", "kind": "shared", "stage": "all", "title": "Check before any change", "aliases": ["change control", "before change", "universal pre-change check"], "updated": null, "rule": "Understand what could be lost or repriced before you change a live booking. Price first, explain the impact, get buy-in, then commit.", "use": "", "body": "<ul>\n<li>Current confirmation and status<\/li>\n<li>Cancellation and change penalties<\/li>\n<li>Current rate or promotion (a change can lose it)<\/li>\n<li>Whether a replacement is available<\/li>\n<li>Payment status<\/li>\n<li>Ticketed air or anything else that can’t be reversed<\/li>\n<li>Transfers and tours tied to the dates<\/li>\n<li>Trip protection price<\/li>\n<li>Anything still pending with a supplier<\/li>\n<li>How close travel is<\/li>\n<\/ul>", "escalate": "", "complete": "", "text": "Understand what could be lost or repriced before you change a live booking. Price first, explain the impact, get buy-in, then commit. Current confirmation and status Cancellation and change penalties Current rate or promotion (a change can lose it) Whether a replacement is available Payment status Ticketed air or anything else that can’t be reversed Transfers and tours tied to the dates Trip protection price Anything still pending with a supplier How close travel is"}, {"id": "changes-hotel", "kind": "proc", "stage": "pre", "title": "Change hotel dates or room", "aliases": ["change dates", "change room", "room change", "date change", "occupancy", "split stay", "release space", "extend stay"], "updated": null, "rule": "Don’t release confirmed space first.", "use": "The advisor wants different dates, a different room, or a different occupancy.", "body": "<ol type=\"1\">\n<li>Review the current room, rate and cancellation terms.<\/li>\n<li>Check the new option <strong>without releasing<\/strong> the confirmed room, when you can.<\/li>\n<li>Price the new setup.<\/li>\n<li>Explain any price, rate or promotion difference, and the risk of losing the current room.<\/li>\n<li>Get the advisor’s OK.<\/li>\n<li>Make the change.<\/li>\n<li>Update transfers and tours if the dates moved.<\/li>\n<li>Reprice protection if the package value changed.<\/li>\n<li>Recap the whole itinerary and the new total.<\/li>\n<\/ol>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>If<\/th>\n<th>Then<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>The confirmed room would be hard to get back<\/td>\n<td>Don’t release it just to see if something better comes back, unless the advisor knowingly accepts the risk. Ask the hotel, or consider a split stay.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Air dates also change<\/td>\n<td>Change air separately. Ticketed air: <a class=\"xref\" href=\"#air-c\">Change or cancel ticketed air<\/a>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "escalate": "Confirmed space would be lost with no workable replacement, the price or penalty needs an exception, or the supplier’s answer conflicts with the booking.", "complete": "The advisor approved the impact, the change is made, transfers, tours and protection are updated, and the full recap is sent.", "text": "Don’t release confirmed space first. The advisor wants different dates, a different room, or a different occupancy. Review the current room, rate and cancellation terms. Check the new option without releasing the confirmed room, when you can. Price the new setup. Explain any price, rate or promotion difference, and the risk of losing the current room. Get the advisor’s OK. Make the change. Update transfers and tours if the dates moved. Reprice protection if the package value changed. Recap the whole itinerary and the new total. If Then The confirmed room would be hard to get back Don’t release it just to see if something better comes back, unless the advisor knowingly accepts the risk. Ask the hotel, or consider a split stay. Air dates also change Change air separately. Ticketed air: Change or cancel ticketed air . Confirmed space would be lost with no workable replacement, the price or penalty needs an exception, or the supplier’s answer conflicts with the booking. The advisor approved the impact, the change is made, transfers, tours and protection are updated, and the full recap is sent."}, {"id": "changes-add", "kind": "proc", "stage": "pre", "title": "Add something to a live booking", "aliases": ["add component", "add hotel", "add transfer", "add tour", "buy-in", "live booking"], "updated": null, "rule": "", "use": "The advisor wants to add a hotel, transfer, tour or other component.", "body": "<ol type=\"1\">\n<li>Search and price it without committing.<\/li>\n<li>Check it doesn’t clash with the current itinerary.<\/li>\n<li>Read the booking instructions and requirements.<\/li>\n<li>Quote the price and conditions.<\/li>\n<li>Get the advisor’s clear OK.<\/li>\n<li>Add it and check its status.<\/li>\n<li>Note it and recap the new itinerary and total.<\/li>\n<\/ol>", "escalate": "The booking instructions conflict with the request, it can’t be confirmed in time, or the price needs an exception.", "complete": "The advisor gave buy-in, it’s added with the right status, and the new itinerary and total are recapped.", "text": "The advisor wants to add a hotel, transfer, tour or other component. Search and price it without committing. Check it doesn’t clash with the current itinerary. Read the booking instructions and requirements. Quote the price and conditions. Get the advisor’s clear OK. Add it and check its status. Note it and recap the new itinerary and total. The booking instructions conflict with the request, it can’t be confirmed in time, or the price needs an exception. The advisor gave buy-in, it’s added with the right status, and the new itinerary and total are recapped."}, {"id": "changes-remove", "kind": "proc", "stage": "pre", "title": "Remove something from a booking", "aliases": ["remove component", "cancel component", "drop hotel", "remove transfer"], "updated": null, "rule": "", "use": "The advisor wants to take a component off the booking.", "body": "<ol type=\"1\">\n<li>Read the cancellation and penalty terms before removing anything.<\/li>\n<li>Work out the refund or cost.<\/li>\n<li>Explain the impact and get the advisor’s OK.<\/li>\n<li>Cancel only after they approve.<\/li>\n<li>Check the refund or credit, and anything connected to what you removed.<\/li>\n<li>Note it and recap.<\/li>\n<\/ol>\n<p>Refunding money? Use <a class=\"xref\" href=\"#refunds-a\">Cancel or change before travel, with a refund<\/a>.<\/p>", "escalate": "The penalty or refund needs an exception, or the advisor disputes the supplier’s terms.", "complete": "Terms explained, approved, cancelled, refund or balance handled, connected items checked, and recapped.", "text": "The advisor wants to take a component off the booking. Read the cancellation and penalty terms before removing anything. Work out the refund or cost. Explain the impact and get the advisor’s OK. Cancel only after they approve. Check the refund or credit, and anything connected to what you removed. Note it and recap. Refunding money? Use Cancel or change before travel, with a refund . The penalty or refund needs an exception, or the advisor disputes the supplier’s terms. Terms explained, approved, cancelled, refund or balance handled, connected items checked, and recapped."}]}, {"id": "pending", "group": "Booking and Plex", "title": "Pending requests and kickbacks", "sub": "Chasing confirmations, near-travel follow-up and Advising Kickbacks", "compare": "", "items": [{"id": "pending-follow", "kind": "proc", "stage": "pre", "title": "Follow up on a pending request", "aliases": ["pending request", "pending", "not confirmed", "items on request", "follow up supplier", "manifest", "chase confirmation", "within 10 days"], "updated": null, "rule": "Pending isn’t confirmed. Never tell the advisor it is.", "use": "A hotel, tour or other component is still pending, or is in the Items on Request queue.", "body": "<ol type=\"1\">\n<li>Identify the component and its current status.<\/li>\n<li>Read the booking instructions to see how the supplier normally confirms.<\/li>\n<li>Check whether a confirmation already came back in Plex, Zendesk or email.<\/li>\n<li>Check how close travel is.<\/li>\n<li>If normal timing is still reasonable, let the usual process work. Project Expedition usually takes 24–48 hours.<\/li>\n<li>If travel is close or the normal timeframe has passed, contact the supplier or Product Operations.<\/li>\n<li>Note the follow-up and set Zendesk to the right waiting status.<\/li>\n<li>When it’s confirmed, update the booking and tell the advisor if they were waiting.<\/li>\n<\/ol>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>If<\/th>\n<th>Then<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Travel is <strong>within 10 days<\/strong><\/td>\n<td>Contact the vendor directly. Always.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Outside 10 days, but the trip depends on it and you need an answer now<\/td>\n<td>Contacting the vendor directly is recommended.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "escalate": "Travel is close and the supplier hasn’t answered.", "complete": "The right party was contacted, it’s noted, the waiting status and next check are set, and the advisor is updated once it confirms.", "text": "Pending isn’t confirmed. Never tell the advisor it is. A hotel, tour or other component is still pending, or is in the Items on Request queue. Identify the component and its current status. Read the booking instructions to see how the supplier normally confirms. Check whether a confirmation already came back in Plex, Zendesk or email. Check how close travel is. If normal timing is still reasonable, let the usual process work. Project Expedition usually takes 24–48 hours. If travel is close or the normal timeframe has passed, contact the supplier or Product Operations. Note the follow-up and set Zendesk to the right waiting status. When it’s confirmed, update the booking and tell the advisor if they were waiting. If Then Travel is within 10 days Contact the vendor directly. Always. Outside 10 days, but the trip depends on it and you need an answer now Contacting the vendor directly is recommended. Travel is close and the supplier hasn’t answered. The right party was contacted, it’s noted, the waiting status and next check are set, and the advisor is updated once it confirms."}, {"id": "pending-kickback", "kind": "proc", "stage": "pre", "title": "Work an Advising Kickback", "aliases": ["kickback", "advising kickback", "adkx", "rs20", "product kickback", "research history", "kick back", "vendor feedback"], "updated": null, "rule": "Check the Advising Kickback workflow during the day and follow every valid kickback to resolution.", "use": "A Product or vendor kickback lands in the Advising Kickback queue.", "body": "<ol type=\"1\">\n<li>Open the Advising Kickback item and read the Product or vendor message in the booking’s <strong>Communication Summary<\/strong>.<\/li>\n<li>Does it really need Reservations follow-up?\n<ul>\n<li><strong>No:<\/strong> send it back to the Product or destination owner with the booking number and a clear reason.<\/li>\n<li><strong>Yes:<\/strong> use <strong>Research History<\/strong> to find the reservation agent responsible.<\/li>\n<\/ul><\/li>\n<li>Route an <strong>Internal<\/strong> communication to that agent’s Individual Queue using the <strong>Kick Back<\/strong> workflow type. Keep the original detailed message.<\/li>\n<li>Add the agent’s initials to the original communication and update the queue transaction.<\/li>\n<li>Notify the agent and copy their supervisor.<\/li>\n<li>The agent fixes the booking, contacts the vendor, updates history, and closes both internal communications.<\/li>\n<li>Follow the kickback until it’s resolved, then close the original Product or vendor kickback.<\/li>\n<li>Remark <strong>ADKX – Advising Kick-Back – Resolved<\/strong>.<\/li>\n<\/ol>\n<p><strong>Missing from the queue?<\/strong> The <strong>RS20 Executer<\/strong> report is the backup, for example when the booking agent no longer works at Classic. Compare RS20 with the queue. For anything missing, find the open kickback in Communication Summary, contact the agent’s last supervisor to assign it, and note the supervisor in the communication.<\/p>", "escalate": "No one owns the follow-up, or the agent and supervisor don’t respond.", "complete": "The issue is fixed, both internal communications are closed, the original kickback is closed, and ADKX is remarked.", "text": "Check the Advising Kickback workflow during the day and follow every valid kickback to resolution. A Product or vendor kickback lands in the Advising Kickback queue. Open the Advising Kickback item and read the Product or vendor message in the booking’s Communication Summary . Does it really need Reservations follow-up? No: send it back to the Product or destination owner with the booking number and a clear reason. Yes: use Research History to find the reservation agent responsible. Route an Internal communication to that agent’s Individual Queue using the Kick Back workflow type. Keep the original detailed message. Add the agent’s initials to the original communication and update the queue transaction. Notify the agent and copy their supervisor. The agent fixes the booking, contacts the vendor, updates history, and closes both internal communications. Follow the kickback until it’s resolved, then close the original Product or vendor kickback. Remark ADKX – Advising Kick-Back – Resolved . Missing from the queue? The RS20 Executer report is the backup, for example when the booking agent no longer works at Classic. Compare RS20 with the queue. For anything missing, find the open kickback in Communication Summary, contact the agent’s last supervisor to assign it, and note the supervisor in the communication. No one owns the follow-up, or the agent and supervisor don’t respond. The issue is fixed, both internal communications are closed, the original kickback is closed, and ADKX is remarked."}]}, {"id": "cad", "group": "Booking and Plex", "title": "CAD and manual components", "sub": "Building manual components and extending stays during the trip", "compare": "", "items": [{"id": "cad-build", "kind": "proc", "stage": "pre", "title": "Build a CAD or manual hotel component", "aliases": ["cad", "manual", "competitive", "manual hotel", "build component", "pending request", "cad booking"], "updated": null, "rule": "No hotel confirmation number means Pending Request, not Confirmed.", "use": "A component can’t be booked through the normal live path and has to be built manually.", "body": "<ol type=\"1\">\n<li>Build it with the right dates, rate, room, occupancy and supplier details.<\/li>\n<li>Recheck the rate and dates you typed before committing.<\/li>\n<li>Set it to <strong>Pending Request<\/strong> until the hotel confirms.<\/li>\n<li>Send the request through the normal supplier path.<\/li>\n<li>Follow up based on how close travel is (<a class=\"xref\" href=\"#pending-follow\">Follow up on a pending request<\/a>). Don’t present it as confirmed.<\/li>\n<\/ol>", "escalate": "Travel is close and there’s still no hotel confirmation.", "complete": "Built with verified details, set to Pending until confirmed, request sent, and the follow-up has an owner.", "text": "No hotel confirmation number means Pending Request, not Confirmed. A component can’t be booked through the normal live path and has to be built manually. Build it with the right dates, rate, room, occupancy and supplier details. Recheck the rate and dates you typed before committing. Set it to Pending Request until the hotel confirms. Send the request through the normal supplier path. Follow up based on how close travel is ( Follow up on a pending request ). Don’t present it as confirmed. Travel is close and there’s still no hotel confirmation. Built with verified details, set to Pending until confirmed, request sent, and the follow-up has an owner."}, {"id": "cad-extend", "kind": "proc", "stage": "in", "title": "Extend a stay or add a component during the trip", "aliases": ["extend stay", "extension", "extra night", "add night", "stay longer", "in-travel cad", "urgent cad vcc"], "updated": null, "rule": "Extending a stay isn’t a new quote. Work from the existing booking, and don’t call it secured until the supplier confirms and it’s paid.", "use": "The traveler wants to stay longer, or needs something added mid-trip that has to be secured manually.", "body": "<ol type=\"1\">\n<li>Review the current component and the traveler’s dates.<\/li>\n<li>Identify the supplier, and whether a VCC is needed to secure it.<\/li>\n<li>Contact the supplier or CAD source for availability and price.<\/li>\n<li>Build or add it with the right dates and customer comments.<\/li>\n<li>Take payment as required (<a class=\"xref\" href=\"#pay-take\">Take a payment<\/a>).<\/li>\n<li>If a VCC is needed to secure it, request an urgent CAD VCC: https://app.smartsheet.com/b/form/0e43972dc1ad4261951536f8dc699eb8<\/li>\n<li>Send the confirmation and update anything connected (transfers, flights).<\/li>\n<li>Request the extra commission it earns (<a class=\"xref\" href=\"#comm-extra\">Request extra commission after an in-trip addition<\/a>).<\/li>\n<\/ol>\n<p><strong>Group bookings:<\/strong> use the group’s contracted Sell rate. See <a class=\"xref\" href=\"#grp-pricing\">Price an extra night or change for a group room<\/a>.<\/p>", "escalate": "The supplier can’t confirm, the traveler has nowhere to stay, or the cost is beyond your authority.", "complete": "The new or extended component is confirmed, paid or secured, and the traveler and advisor know.", "text": "Extending a stay isn’t a new quote. Work from the existing booking, and don’t call it secured until the supplier confirms and it’s paid. The traveler wants to stay longer, or needs something added mid-trip that has to be secured manually. Review the current component and the traveler’s dates. Identify the supplier, and whether a VCC is needed to secure it. Contact the supplier or CAD source for availability and price. Build or add it with the right dates and customer comments. Take payment as required ( Take a payment ). If a VCC is needed to secure it, request an urgent CAD VCC: https://app.smartsheet.com/b/form/0e43972dc1ad4261951536f8dc699eb8 Send the confirmation and update anything connected (transfers, flights). Request the extra commission it earns ( Request extra commission after an in-trip addition ). Group bookings: use the group’s contracted Sell rate. See Price an extra night or change for a group room . The supplier can’t confirm, the traveler has nowhere to stay, or the cost is beyond your authority. The new or extended component is confirmed, paid or secured, and the traveler and advisor know."}]}, {"id": "online", "group": "Booking and Plex", "title": "Online bookings (OBE) and web support", "sub": "Unpaid options, paid online bookings and advisor login issues", "compare": "", "items": [{"id": "obe-option", "kind": "proc", "stage": "pre", "title": "Unpaid online option (SSUP)", "aliases": ["ssup", "unpaid option", "online option", "saturday check", "obe option", "bx option"], "updated": null, "rule": "Unpaid option: light review and SSUP. Paid online booking: full QA.", "use": "An unpaid online option is in your queue for the Saturday supervisor check.", "body": "<ol type=\"1\">\n<li>Open the online booking. Confirm there’s no payment and it’s still an option.<\/li>\n<li>Do a light review: travelers, hotel dates and status, air, transfers, tours, protection choice, and comments.<\/li>\n<li>Check the itinerary makes sense and nothing operational is obviously missing.<\/li>\n<li>Look for transfer information, or a clear transport-on-own or declined-transfer comment.<\/li>\n<li>If nothing needs fixing, go to <strong>Add Remarks<\/strong> and enter <strong>SSUP<\/strong>.<\/li>\n<li>Leave it as an unpaid option. It isn’t a completed paid QA.<\/li>\n<\/ol>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>If<\/th>\n<th>Then<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>There’s a payment, or it’s invoiced<\/td>\n<td>Stop. It needs full QA: <a class=\"xref\" href=\"#obe-paid\">Paid online (OBE) booking<\/a>.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>You find an error or something missing<\/td>\n<td>Fix it or escalate it. Don’t just SSUP and move on.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>The advisor pays later<\/td>\n<td>It now needs full paid-booking QA.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "escalate": "The option shows fraud red flags. See <a class=\"xref\" href=\"#fraud-flags\">Something looks like fraud<\/a>.", "complete": "The light review is clean, a transport note is there where needed, SSUP is entered, and it’s still unpaid.", "text": "Unpaid option: light review and SSUP. Paid online booking: full QA. An unpaid online option is in your queue for the Saturday supervisor check. Open the online booking. Confirm there’s no payment and it’s still an option. Do a light review: travelers, hotel dates and status, air, transfers, tours, protection choice, and comments. Check the itinerary makes sense and nothing operational is obviously missing. Look for transfer information, or a clear transport-on-own or declined-transfer comment. If nothing needs fixing, go to Add Remarks and enter SSUP . Leave it as an unpaid option. It isn’t a completed paid QA. If Then There’s a payment, or it’s invoiced Stop. It needs full QA: Paid online (OBE) booking . You find an error or something missing Fix it or escalate it. Don’t just SSUP and move on. The advisor pays later It now needs full paid-booking QA. The option shows fraud red flags. See Something looks like fraud . The light review is clean, a transport note is there where needed, SSUP is entered, and it’s still unpaid."}, {"id": "obe-paid", "kind": "proc", "stage": "pre", "title": "Paid online (OBE) booking", "aliases": ["obe", "online booking", "bx", "paid online", "obe qa", "taw 12:00", "view gds", "wp", "wppjcb", "zone details", "no seats assigned"], "updated": null, "rule": "", "use": "A paid or invoiced online booking needs QA.", "body": "<ol type=\"1\">\n<li>Confirm it’s paid or invoiced.<\/li>\n<li>Do the full QA (<a class=\"xref\" href=\"#qa-paid\">QA a paid booking<\/a>), plus these online-specific checks:<\/li>\n<\/ol>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Check<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Names<\/td>\n<td>Check spelling.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Air status<\/td>\n<td>Must be Confirmed. If <strong>Not Reserved<\/strong>, contact Flights to rebook. QA isn’t done.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Ticketing deadline<\/td>\n<td>If TAW shows <strong>12:00 AM<\/strong>, check the real deadline in <strong>View GDS<\/strong> (published fare: WP; negotiated: WPPJCB) and put it in customer comments.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Seats<\/td>\n<td>None assigned? Add the customer comment “no seats assigned.”<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Rental car<\/td>\n<td>Would an extra day avoid late fees? If it prices the same, book it; if not, add the advisor-call remark. Rebook any car showing Not Reserved.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Transfers<\/td>\n<td>Use <strong>Zone Details<\/strong> to check the hotel zone. Transfer dates must match hotel check-in and check-out.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Hotel occupancy<\/td>\n<td>Every traveler is assigned to a room.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Hotel promotion<\/td>\n<td>Promotion and dates are eligible. If included transfers need flight details, leave the advisor instruction.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Add Services<\/td>\n<td>Check for complimentary amenities.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Festive or seasonal<\/td>\n<td>Check seasonal hotel rules and the due and final-payment dates.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Tours<\/td>\n<td>All required details are there. If not, contact the advisor and update the booking.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ol start=\"3\" type=\"1\">\n<li>Check air ticketing (<a class=\"xref\" href=\"#air-a\">Paid air isn’t ticketed<\/a>).<\/li>\n<li>Fix and note any online-booking errors you own.<\/li>\n<li>Complete the QA remark and disposition.<\/li>\n<\/ol>", "escalate": "Air is paid but not ticketed, or an error is outside what L2 owns.", "complete": "Everything is reviewed, errors are fixed or owned, ticketing is understood, and the QA remark and disposition are done.", "text": "A paid or invoiced online booking needs QA. Confirm it’s paid or invoiced. Do the full QA ( QA a paid booking ), plus these online-specific checks: Check What to do Names Check spelling. Air status Must be Confirmed. If Not Reserved , contact Flights to rebook. QA isn’t done. Ticketing deadline If TAW shows 12:00 AM , check the real deadline in View GDS (published fare: WP; negotiated: WPPJCB) and put it in customer comments. Seats None assigned? Add the customer comment “no seats assigned.” Rental car Would an extra day avoid late fees? If it prices the same, book it; if not, add the advisor-call remark. Rebook any car showing Not Reserved. Transfers Use Zone Details to check the hotel zone. Transfer dates must match hotel check-in and check-out. Hotel occupancy Every traveler is assigned to a room. Hotel promotion Promotion and dates are eligible. If included transfers need flight details, leave the advisor instruction. Add Services Check for complimentary amenities. Festive or seasonal Check seasonal hotel rules and the due and final-payment dates. Tours All required details are there. If not, contact the advisor and update the booking. Check air ticketing ( Paid air isn’t ticketed ). Fix and note any online-booking errors you own. Complete the QA remark and disposition. Air is paid but not ticketed, or an error is outside what L2 owns. Everything is reviewed, errors are fixed or owned, ticketing is understood, and the QA remark and disposition are done."}, {"id": "obe-web", "kind": "proc", "stage": "all", "title": "Advisor login and website issues", "aliases": ["login", "password", "reset password", "registration", "classic assist login", "web support", "rweb", "website error", "private label", "proposal", "duplicate account", "websupport"], "updated": null, "rule": "", "use": "An advisor can’t log in, has an account problem, or hits a website error.", "body": "<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Issue<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Login, registration or password<\/td>\n<td>Verify the advisor and agency first. Don’t create a duplicate account as a shortcut.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Wrong or duplicate user ID or email<\/td>\n<td>Find the registered account first. Identity changes may need Sales Support or the Web team.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Proposals, Private Label or other web tools<\/td>\n<td>Route to Web Support (websupport@classicvacations.com) with the verified advisor and the exact request.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Website error or booking limitation<\/td>\n<td>Note exactly what the advisor sees. Escalate anything you can reproduce.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Online payment doesn’t look right<\/td>\n<td>Check the actual payments in Plex. The online summary isn’t proof.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Remark <strong>RWEB<\/strong> once the web support work is done.<\/p>", "escalate": "", "complete": "The advisor can get in or the issue is with the right team, and RWEB is remarked.", "text": "An advisor can’t log in, has an account problem, or hits a website error. Issue What to do Login, registration or password Verify the advisor and agency first. Don’t create a duplicate account as a shortcut. Wrong or duplicate user ID or email Find the registered account first. Identity changes may need Sales Support or the Web team. Proposals, Private Label or other web tools Route to Web Support (websupport@classicvacations.com) with the verified advisor and the exact request. Website error or booking limitation Note exactly what the advisor sees. Escalate anything you can reproduce. Online payment doesn’t look right Check the actual payments in Plex. The online summary isn’t proof. Remark RWEB once the web support work is done. The advisor can get in or the issue is with the right team, and RWEB is remarked."}]}, {"id": "qa", "group": "Booking and Plex", "title": "Booking QA", "sub": "When QA triggers, what to check, Error vs Advising", "compare": "", "items": [{"id": "qa-when", "kind": "shared", "stage": "all", "title": "When QA is required", "aliases": ["qa trigger", "10 day qa", "10-day", "30 day", "qa queue", "when qa"], "updated": null, "rule": "", "use": "", "body": "<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Trigger<\/th>\n<th>What happens<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Call center booking gets its first payment or deposit<\/td>\n<td>Plex creates a QA item in the destination QA queue.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Online (OBE) booking is paid<\/td>\n<td>QA is required. Unpaid options follow SSUP (<a class=\"xref\" href=\"#obe-option\">Unpaid online option (SSUP)<\/a>).<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>A booking changes <strong>within 10 days<\/strong> of departure<\/td>\n<td>Plex creates a new <strong>10-Day QA<\/strong> item. Review it again.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Travel is within <strong>30 days<\/strong><\/td>\n<td>Not a trigger. It should already be QA’d, unless a new 10-Day item appeared.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "escalate": "", "complete": "", "text": "Trigger What happens Call center booking gets its first payment or deposit Plex creates a QA item in the destination QA queue. Online (OBE) booking is paid QA is required. Unpaid options follow SSUP ( Unpaid online option (SSUP) ). A booking changes within 10 days of departure Plex creates a new 10-Day QA item. Review it again. Travel is within 30 days Not a trigger. It should already be QA’d, unless a new 10-Day item appeared."}, {"id": "qa-paid", "kind": "proc", "stage": "pre", "title": "QA a paid booking", "aliases": ["qa", "quality assurance", "qa error", "advising", "qa checklist", "review booking", "qa paid booking"], "updated": null, "rule": "QA checks the whole trip, not one component. Every piece has to make sense together.", "use": "A paid booking is in the QA or 10-Day QA queue.", "body": "<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Area<\/th>\n<th>Check<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Start<\/strong><\/td>\n<td>Paid or invoiced status. Read the booking top to bottom before editing. Traveler count and ages, dates, destinations, the order of components, comments and advisor intent, how close travel is.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Hotel<\/strong><\/td>\n<td>Right property and zone; check-in, check-out and nights; room category and number of rooms; occupancy matches the party; rate and promotion; bedding and requests captured; status (confirmed, pending or not reserved); confirmation number entered; any CAD component has the right rate and dates and is Pending until confirmed.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Air<\/strong><\/td>\n<td>Right travelers; cities and dates match; flight times work with hotel nights and transfers; <strong>paid air is actually ticketed<\/strong> (<a class=\"xref\" href=\"#air-a\">Paid air isn’t ticketed<\/a>); record locator present; seat and frequent-flyer requests routed.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Transfers<\/strong><\/td>\n<td>Direction; dates match flights and hotels; right airport, port or station and hotel zone; vehicle fits the party; flight details linked; mobile number present; pickup instructions; no duplicate transfer or car overlap; transport-on-own comment if declined.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Tours<\/strong><\/td>\n<td>Date fits the itinerary; party size; required time captured; instructions read; status as expected; waivers forwarded.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Car<\/strong><\/td>\n<td>Locations and dates match; vehicle type fits; advisor told about pickup requirements (often a credit card, not debit).<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Rail and ferry<\/strong><\/td>\n<td>Right station or port; transfers tied to it; a public ferry isn’t presented as included.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Protection<\/strong><\/td>\n<td>Plan present where it applies; repriced after big changes (<a class=\"xref\" href=\"#tsp-change\">Check TSP after any booking change<\/a>).<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>What you found<\/th>\n<th>Path<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Something on the booking is actually wrong (mismatched dates, duplicate room or name)<\/td>\n<td><strong>QA Error.<\/strong> Fix it.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>A gap or missing information the advisor needs to fix (itinerary gap, transfer-on-own note)<\/td>\n<td><strong>Advising.<\/strong> Reach out to the advisor.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>You can’t tell what caused it or who owns it<\/td>\n<td>Stop and escalate. Don’t guess.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The dropdown names in live Plex may differ slightly. Pick the one that matches the meaning above.<\/p>", "escalate": "You find a risk to a traveler who’s about to travel, or you can’t tell who owns the problem.", "complete": "Every component is reviewed, dates and sequence make sense, payment and ticketing are understood, anything pending has an owner, fixes are done or escalated, the remark and disposition are entered, and the booking can travel as documented.", "text": "QA checks the whole trip, not one component. Every piece has to make sense together. A paid booking is in the QA or 10-Day QA queue. Area Check Start Paid or invoiced status. Read the booking top to bottom before editing. Traveler count and ages, dates, destinations, the order of components, comments and advisor intent, how close travel is. Hotel Right property and zone; check-in, check-out and nights; room category and number of rooms; occupancy matches the party; rate and promotion; bedding and requests captured; status (confirmed, pending or not reserved); confirmation number entered; any CAD component has the right rate and dates and is Pending until confirmed. Air Right travelers; cities and dates match; flight times work with hotel nights and transfers; paid air is actually ticketed ( Paid air isn’t ticketed ); record locator present; seat and frequent-flyer requests routed. Transfers Direction; dates match flights and hotels; right airport, port or station and hotel zone; vehicle fits the party; flight details linked; mobile number present; pickup instructions; no duplicate transfer or car overlap; transport-on-own comment if declined. Tours Date fits the itinerary; party size; required time captured; instructions read; status as expected; waivers forwarded. Car Locations and dates match; vehicle type fits; advisor told about pickup requirements (often a credit card, not debit). Rail and ferry Right station or port; transfers tied to it; a public ferry isn’t presented as included. Protection Plan present where it applies; repriced after big changes ( Check TSP after any booking change ). What you found Path Something on the booking is actually wrong (mismatched dates, duplicate room or name) QA Error. Fix it. A gap or missing information the advisor needs to fix (itinerary gap, transfer-on-own note) Advising. Reach out to the advisor. You can’t tell what caused it or who owns it Stop and escalate. Don’t guess. The dropdown names in live Plex may differ slightly. Pick the one that matches the meaning above. You find a risk to a traveler who’s about to travel, or you can’t tell who owns the problem. Every component is reviewed, dates and sequence make sense, payment and ticketing are understood, anything pending has an owner, fixes are done or escalated, the remark and disposition are entered, and the booking can travel as documented."}]}, {"id": "air", "group": "Products", "title": "Air", "sub": "Ticketing, changes, disruptions and unused segments", "compare": "<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><\/th>\n<th>Pre-Travel<\/th>\n<th>In-Travel<\/th>\n<th>Post-Travel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>How air changes<\/td>\n<td>Unticketed: Plex <strong>Change<\/strong>. Ticketed: <strong>Flights<\/strong> only<\/td>\n<td>Airline or airport counter first if the airline caused it; Flights for exchanges<\/td>\n<td>Airline refund request through the Post-Travel specialist<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Check first<\/td>\n<td>Ticket numbers, PNR, fare rules, TAW<\/td>\n<td>The live airline record (it may be newer than Plex)<\/td>\n<td>Which segments were flown and which weren’t<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Client refund timing<\/td>\n<td>14 business days<\/td>\n<td>7–10 business days<\/td>\n<td>Follows when the original change happened; unused tickets aren’t guaranteed<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Done when<\/td>\n<td>Ticketing or the change is verified, not just requested<\/td>\n<td>Traveler has a confirmed flight and all affected land is fixed<\/td>\n<td>Airline decision recorded, or the specialist has accepted it<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "items": [{"id": "air-a", "kind": "proc", "stage": "pre", "title": "Paid air isn’t ticketed", "aliases": ["no tickets", "not ticketed", "missing tickets", "lmtr", "hold ticket", "ticketing request", "splm", "sjcticketrequest", "tickets not issued", "paid but not ticketed", "taw"], "updated": null, "rule": "Paid isn’t ticketed. Don’t tell the advisor tickets are issued until you see ticket numbers.", "use": "The booking is paid but the air shows no ticket numbers, or it’s on hold.", "body": "<ol type=\"1\">\n<li>Open the air component and look for ticket numbers. Confirm the payment posted to this booking. Don’t run the card again.<\/li>\n<li>Check passenger details. Birthdates and middle names must be there when the airline requires them.<\/li>\n<li>If <strong>HOLD TICKET<\/strong> is checked and the booking needs ticketing, uncheck it. If someone set it on purpose, find out why before you remove it.<\/li>\n<li>Email the ticketing request (LMTR) to <strong>CV Ticketing Request<\/strong>, sjcticketrequest@classicvacations.com.\n<ul>\n<li><strong>Subject:<\/strong> booking number + PNR + lead passenger last name<\/li>\n<li><strong>Body:<\/strong> airline, “please ticket,” and passenger names and dates of birth<\/li>\n<\/ul><\/li>\n<li>Remark the booking <strong>SPLM – Sent LMTR<\/strong>.<\/li>\n<li>Send the statement to the advisor and say ticketing is still pending.<\/li>\n<li>In Zendesk, add an internal note with the PNR and request time. Set <strong>Waiting on Internal CV Response<\/strong> with a check-back time.<\/li>\n<li>Recheck until ticket numbers appear, then finish air QA.<\/li>\n<\/ol>", "escalate": "Air is paid and ticketing is still unresolved.", "complete": "Ticket numbers are verified, SPLM is remarked, and the advisor knows tickets are issued.", "text": "Paid isn’t ticketed. Don’t tell the advisor tickets are issued until you see ticket numbers. The booking is paid but the air shows no ticket numbers, or it’s on hold. Open the air component and look for ticket numbers. Confirm the payment posted to this booking. Don’t run the card again. Check passenger details. Birthdates and middle names must be there when the airline requires them. If HOLD TICKET is checked and the booking needs ticketing, uncheck it. If someone set it on purpose, find out why before you remove it. Email the ticketing request (LMTR) to CV Ticketing Request , sjcticketrequest@classicvacations.com. Subject: booking number + PNR + lead passenger last name Body: airline, “please ticket,” and passenger names and dates of birth Remark the booking SPLM – Sent LMTR . Send the statement to the advisor and say ticketing is still pending. In Zendesk, add an internal note with the PNR and request time. Set Waiting on Internal CV Response with a check-back time. Recheck until ticket numbers appear, then finish air QA. Air is paid and ticketing is still unresolved. Ticket numbers are verified, SPLM is remarked, and the advisor knows tickets are issued."}, {"id": "air-b", "kind": "proc", "stage": "pre", "title": "Change or cancel air that isn’t ticketed", "aliases": ["change flight", "rebook", "unticketed", "not reserved", "new pnr", "change dates", "plex change", "cancel flight"], "updated": null, "rule": "Unticketed air is changed in Plex. The change cancels the old PNR and creates a new one.", "use": "The advisor wants different flights, dates, cities or cabin, and there are no ticket numbers yet.", "body": "<ol type=\"1\">\n<li>Confirm there are no ticket numbers. If there are, use <a class=\"xref\" href=\"#air-c\">Change or cancel ticketed air<\/a>.<\/li>\n<li>Get the new dates, cities, airline and cabin from the advisor.<\/li>\n<li>Price it and get the advisor’s OK before you commit.<\/li>\n<li>Open the air component, select <strong>Change<\/strong>, update the search and rebook.<\/li>\n<li>Check the new air shows <strong>Confirmed<\/strong>. If it shows <strong>Not Reserved<\/strong>, use Change again. Don’t treat it as booked.<\/li>\n<li>Change land separately. Moving hotel dates doesn’t move the air, and moving the air doesn’t move the hotel.<\/li>\n<li>Check transfers, tours, car and protection. Send an LMTR if the new air needs ticketing.<\/li>\n<li>Remark the booking, add a Zendesk note, and send the advisor a full recap with the new total.<\/li>\n<\/ol>", "escalate": "You can’t get the new air to Confirmed.", "complete": "The new PNR is Confirmed, land matches the new flights, and the recap is sent.", "text": "Unticketed air is changed in Plex. The change cancels the old PNR and creates a new one. The advisor wants different flights, dates, cities or cabin, and there are no ticket numbers yet. Confirm there are no ticket numbers. If there are, use Change or cancel ticketed air . Get the new dates, cities, airline and cabin from the advisor. Price it and get the advisor’s OK before you commit. Open the air component, select Change , update the search and rebook. Check the new air shows Confirmed . If it shows Not Reserved , use Change again. Don’t treat it as booked. Change land separately. Moving hotel dates doesn’t move the air, and moving the air doesn’t move the hotel. Check transfers, tours, car and protection. Send an LMTR if the new air needs ticketing. Remark the booking, add a Zendesk note, and send the advisor a full recap with the new total. You can’t get the new air to Confirmed. The new PNR is Confirmed, land matches the new flights, and the recap is sent."}, {"id": "air-c", "kind": "proc", "stage": "pre", "title": "Change or cancel ticketed air", "aliases": ["ticketed change", "ticket exchange", "sabre", "refundable ticket", "cancel ticket", "exchange", "after hours", "sjcticketrequest"], "updated": "Updated Oct 28", "rule": "Never change ticketed air in Plex. Flights makes the change.", "use": "The advisor wants to change or cancel air that already has ticket numbers.", "body": "<ol type=\"1\">\n<li>Note the ticket number, PNR and fare rules, and whether the change is the traveler’s choice or the airline’s.<\/li>\n<li>Get what the advisor wants: flights, dates, times, cabin, and the most they’ll pay.<\/li>\n<li>Call Flights for the change or cancellation and the price.<\/li>\n<li>Email the ticket exchange to <strong>CV Ticketing<\/strong>, sjcticketrequest@classicvacations.com, with the booking number, PNR, old and new itinerary, and the budget limit.<\/li>\n<li>Flights makes the change in Sabre and imports it into Plex. Don’t attempt it yourself.<\/li>\n<li>When Flights confirms, check the new ticket number and the airline record.<\/li>\n<li>Fix any hotel, transfer, tour or car the change affects.<\/li>\n<li>Remark the booking, add a Zendesk note, and recap to the advisor.<\/li>\n<\/ol>\n<p><strong>“Refundable” doesn’t mean free.<\/strong> Check the fare rules for fees. Ticketed cancellations and refunds always go through Flights.<\/p>\n<p><strong>After hours:<\/strong> ask whether it can wait until Reservations reopens. If it can, have the advisor call back then. If it can’t, use the on-call order in <a class=\"xref\" href=\"#air-e\">Flight cancelled, delayed or connection missed while traveling<\/a>.<\/p>", "escalate": "Flights can’t make the change the advisor needs, or the cost needs approval beyond what the advisor authorized.", "complete": "Flights confirmed the new ticket, Plex and the airline record match, land is fixed, and the advisor has the recap.", "text": "Never change ticketed air in Plex. Flights makes the change. The advisor wants to change or cancel air that already has ticket numbers. Note the ticket number, PNR and fare rules, and whether the change is the traveler’s choice or the airline’s. Get what the advisor wants: flights, dates, times, cabin, and the most they’ll pay. Call Flights for the change or cancellation and the price. Email the ticket exchange to CV Ticketing , sjcticketrequest@classicvacations.com, with the booking number, PNR, old and new itinerary, and the budget limit. Flights makes the change in Sabre and imports it into Plex. Don’t attempt it yourself. When Flights confirms, check the new ticket number and the airline record. Fix any hotel, transfer, tour or car the change affects. Remark the booking, add a Zendesk note, and recap to the advisor. “Refundable” doesn’t mean free. Check the fare rules for fees. Ticketed cancellations and refunds always go through Flights. After hours: ask whether it can wait until Reservations reopens. If it can, have the advisor call back then. If it can’t, use the on-call order in Flight cancelled, delayed or connection missed while traveling . Flights can’t make the change the advisor needs, or the cost needs approval beyond what the advisor authorized. Flights confirmed the new ticket, Plex and the airline record match, land is fixed, and the advisor has the recap."}, {"id": "air-d", "kind": "proc", "stage": "pre", "title": "Airline schedule change", "aliases": ["schedule change", "time change", "flight time changed", "major change", "minor change", "4 hours", "misconnect", "ascc", "decline schedule change", "full refund", "flight moved", "airline changed"], "updated": "Updated Oct 28", "rule": "Call Flights first. Never accept or reject a change for the client, and never promise a full refund until Flights confirms the ticket qualifies.", "use": "The airline changed a flight before departure, Flights emailed you a change, or the advisor is calling about a schedule change notice.", "body": "<h4 id=\"step-1-is-it-a-major-change\">Step 1: Is it a major change?<\/h4>\n<p>It’s <strong>major<\/strong> if any of these are true:<\/p>\n<ul>\n<li>The flight moved <strong>more than 4 hours<\/strong> earlier or later<\/li>\n<li>A connection was <strong>added<\/strong><\/li>\n<li>A connection now <strong>misconnects<\/strong><\/li>\n<li>It moved to a <strong>different day<\/strong> or now needs an overnight<\/li>\n<li>The flight or route was <strong>cancelled<\/strong><\/li>\n<\/ul>\n<p>Anything else is <strong>min
