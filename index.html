 CFAR timing is met. Commission protection claim (full cancellation only) needs all four: paid in full, fully cancelled (not partial), not paid with the advisor’s or agency’s card, and filed within 30 days of cancellation. Send to cvcommprotect@classicvacations.com. During travel: always check TSP before a cancellation or commission decision, and still ask suppliers for waivers. Lower penalties help the client and the claim. Groups: Group TSP is more restrictive and mostly insurance (Part B); refer claims to TripMate. The advisor has the plan facts and, for claims, the TripMate contact."}]}, {"id": "fraud", "group": "Money", "title": "Fraud and hacked accounts", "sub": "Red flags, what to do, and who decides", "compare": "", "items": [{"id": "fraud-flags", "kind": "proc", "stage": "all", "title": "Something looks like fraud", "aliases": ["fraud", "suspicious", "scam", "stolen card", "last minute booking", "card name mismatch", "red flags", "gibberish names", "iata verify"], "updated": null, "rule": "If it looks like fraud, don’t take payment and don’t confirm the booking. Leadership decides, not you.", "use": "A booking, caller or payment doesn’t add up.", "body": "<p><strong>Red flags:<\/strong><\/p>\n<ul>\n<li>Very last-minute travel, often within a few days<\/li>\n<li>A short stay that doesn’t make sense for the distance traveled<\/li>\n<li>A non-refundable rate requested right away<\/li>\n<li>Unusual online booking or account behavior<\/li>\n<li>The booked-by email doesn’t match the advisor or agency<\/li>\n<li>A phone number or area code unrelated to the advisor, with no good reason<\/li>\n<li>The advisor has never worked with this client before<\/li>\n<li>Traveler names that look like gibberish<\/li>\n<li>A card name that matches no traveler and isn’t an agency card<\/li>\n<li>Several cards or repeated payment attempts<\/li>\n<\/ul>\n<p><strong>What to do:<\/strong><\/p>\n<ol type=\"1\">\n<li>Don’t take payment or confirm the booking. You can keep building the quote to buy time.<\/li>\n<li>Gather the quote details, advisor name, agency and IATA, contact details, dates, destination, rate type, traveler names, and the name on the card.<\/li>\n<li>Tell the advisor you need a moment to verify the account details, and pause the call.<\/li>\n<li>Call your supervisor or lead and explain the red flags.<\/li>\n<li>Leadership may verify the advisor with Sales, a BDM or Finance before payment.<\/li>\n<li>If leadership approves, follow their payment condition. For a suspicious last-minute booking, that’s an agency card or a card in a traveler’s name.<\/li>\n<li>If that payment or verification can’t be provided, don’t force it through.<\/li>\n<\/ol>", "escalate": "", "complete": "Nothing was charged or confirmed until leadership verified it, and their decision is noted.", "text": "If it looks like fraud, don’t take payment and don’t confirm the booking. Leadership decides, not you. A booking, caller or payment doesn’t add up. Red flags: Very last-minute travel, often within a few days A short stay that doesn’t make sense for the distance traveled A non-refundable rate requested right away Unusual online booking or account behavior The booked-by email doesn’t match the advisor or agency A phone number or area code unrelated to the advisor, with no good reason The advisor has never worked with this client before Traveler names that look like gibberish A card name that matches no traveler and isn’t an agency card Several cards or repeated payment attempts What to do: Don’t take payment or confirm the booking. You can keep building the quote to buy time. Gather the quote details, advisor name, agency and IATA, contact details, dates, destination, rate type, traveler names, and the name on the card. Tell the advisor you need a moment to verify the account details, and pause the call. Call your supervisor or lead and explain the red flags. Leadership may verify the advisor with Sales, a BDM or Finance before payment. If leadership approves, follow their payment condition. For a suspicious last-minute booking, that’s an agency card or a card in a traveler’s name. If that payment or verification can’t be provided, don’t force it through. Nothing was charged or confirmed until leadership verified it, and their decision is noted."}, {"id": "fraud-hacked", "kind": "proc", "stage": "all", "title": "Advisor says their account was hacked", "aliases": ["hacked", "account compromised", "email changed", "account takeover", "someone booked on my account"], "updated": null, "rule": "", "use": "An advisor reports their Classic account or email was compromised.", "body": "<ol type=\"1\">\n<li>Be understanding. Gather the old email, new email, IATA, full name, and any active booking numbers.<\/li>\n<li>Escalate to L2 leadership. They’ll investigate with Sales and Finance as needed.<\/li>\n<li>Don’t change any account details based only on what the caller tells you.<\/li>\n<\/ol>", "escalate": "", "complete": "The details are gathered, leadership has it, and nothing was changed on the caller’s word alone.", "text": "An advisor reports their Classic account or email was compromised. Be understanding. Gather the old email, new email, IATA, full name, and any active booking numbers. Escalate to L2 leadership. They’ll investigate with Sales and Finance as needed. Don’t change any account details based only on what the caller tells you. The details are gathered, leadership has it, and nothing was changed on the caller’s word alone."}]}, {"id": "communication", "group": "Working the case", "title": "Talking with advisors and travelers", "sub": "The call standard, de-escalation and what to say", "compare": "<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><\/th>\n<th>Pre-Travel<\/th>\n<th>In-Travel<\/th>\n<th>Post-Travel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Lead with<\/td>\n<td>Terms, options and the exact cost before any change<\/td>\n<td>Their stress, where they are, what they need now, when you’ll update them<\/td>\n<td>Facts, what happens next, and who owns it<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Don’t promise<\/td>\n<td>Waivers, upgrades, or anything unconfirmed<\/td>\n<td>Goodwill or FTC beyond your limits<\/td>\n<td>An outcome the specialist hasn’t reached<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "items": [{"id": "comm-standard", "kind": "shared", "stage": "all", "title": "On every call", "aliases": ["call standard", "interaction", "hold", "recap", "listen", "acknowledge"], "updated": null, "rule": "Empathy isn’t a promise of compensation. Acknowledge it, say what you can do now, and stay in control of the next step.", "use": "", "body": "<ol type=\"1\">\n<li>Listen for what they actually need. Don’t make them repeat what’s already in the booking or ticket.<\/li>\n<li>Acknowledge the impact without blaming anyone before you’ve looked into it.<\/li>\n<li>Summarize the issue back to them.<\/li>\n<li>Say what you’re checking before you put them on hold: “I’m going to contact the hotel and confirm the options.”<\/li>\n<li>Explain the cost, timing and any risk before they commit to a change.<\/li>\n<li>Don’t promise anything the supplier hasn’t confirmed.<\/li>\n<li>Give a realistic follow-up time.<\/li>\n<li>Close with a recap: what was done and what happens next.<\/li>\n<\/ol>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>If<\/th>\n<th>Then<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>A quick question turns into a booking change<\/td>\n<td>Treat it as a change: explain the cost and terms and get their OK.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>It turns into a big redesign<\/td>\n<td>Route to the right sales or destination specialist, unless it’s an OBE booking L2 services.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>The advisor is upset or it’ll run long<\/td>\n<td>Tell your lead early so they can help.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>You suspect fraud<\/td>\n<td>Don’t take payment or confirm. See <a class=\"xref\" href=\"#fraud-flags\">Something looks like fraud<\/a>.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>They want a supervisor<\/td>\n<td>Summarize what you’ve done and the decision needed (<a class=\"xref\" href=\"#esc-leader\">Bring in leadership<\/a>).<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "escalate": "", "complete": "", "text": "Empathy isn’t a promise of compensation. Acknowledge it, say what you can do now, and stay in control of the next step. Listen for what they actually need. Don’t make them repeat what’s already in the booking or ticket. Acknowledge the impact without blaming anyone before you’ve looked into it. Summarize the issue back to them. Say what you’re checking before you put them on hold: “I’m going to contact the hotel and confirm the options.” Explain the cost, timing and any risk before they commit to a change. Don’t promise anything the supplier hasn’t confirmed. Give a realistic follow-up time. Close with a recap: what was done and what happens next. If Then A quick question turns into a booking change Treat it as a change: explain the cost and terms and get their OK. It turns into a big redesign Route to the right sales or destination specialist, unless it’s an OBE booking L2 services. The advisor is upset or it’ll run long Tell your lead early so they can help. You suspect fraud Don’t take payment or confirm. See Something looks like fraud . They want a supervisor Summarize what you’ve done and the decision needed ( Bring in leadership )."}, {"id": "comm-deesc", "kind": "shared", "stage": "all", "title": "When a caller is upset", "aliases": ["de-escalation", "angry", "upset", "abusive", "yelling", "supervisor", "callback"], "updated": null, "rule": "", "use": "", "body": "<p><strong>Do:<\/strong> stay calm, keep it short, acknowledge the frustration, separate the emotion from the problem, and offer the next concrete step.<\/p>\n<p><strong>Don’t:<\/strong> argue, match their tone, blame another team, or use “that’s the policy” as the whole answer.<\/p>\n<p><strong>If they stay abusive<\/strong> after a reasonable effort: contact leadership and tell the caller a supervisor will be involved. Note the behavior factually.<\/p>\n<p><strong>Leadership callback:<\/strong> urgent or in-travel, immediately if a leader is available, otherwise within 1 hour. Non-urgent and post-travel, within 24 hours.<\/p>", "escalate": "", "complete": "", "text": "Do: stay calm, keep it short, acknowledge the frustration, separate the emotion from the problem, and offer the next concrete step. Don’t: argue, match their tone, blame another team, or use “that’s the policy” as the whole answer. If they stay abusive after a reasonable effort: contact leadership and tell the caller a supervisor will be involved. Note the behavior factually. Leadership callback: urgent or in-travel, immediately if a leader is available, otherwise within 1 hour. Non-urgent and post-travel, within 24 hours."}, {"id": "comm-say", "kind": "shared", "stage": "all", "title": "What to say", "aliases": ["what to say", "script", "wording", "message", "refund pending wording", "supplier pending"], "updated": null, "rule": "", "use": "", "body": "<p>These are patterns to adapt, not scripts.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Situation<\/th>\n<th>Say something like<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Waiting on a supplier<\/td>\n<td>“We’ve contacted the hotel to confirm [item]. We don’t have their answer yet, so I don’t want to overstate it. We’ll follow up as soon as we hear back.”<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Refund submitted<\/td>\n<td>“The refund for [amount] has been submitted. It takes <strong>14 business days<\/strong> for changes made before travel, or <strong>7–10 business days<\/strong> for changes during travel. [Commission impact, if any.]”<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Cancellation under review<\/td>\n<td>“Before we cancel, we’re confirming the penalty and refund so you know the exact cost.”<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Waiting on another team<\/td>\n<td>“I’ve sent this to [team] for [action]. The case stays open while we wait, and we’ll take it from there.”<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Nothing approved yet<\/td>\n<td>“I can confirm [fact]. I can’t confirm [waiver/refund/change] until [supplier/team] approves it.”<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "escalate": "", "complete": "", "text": "These are patterns to adapt, not scripts. Situation Say something like Waiting on a supplier “We’ve contacted the hotel to confirm [item]. We don’t have their answer yet, so I don’t want to overstate it. We’ll follow up as soon as we hear back.” Refund submitted “The refund for [amount] has been submitted. It takes 14 business days for changes made before travel, or 7–10 business days for changes during travel. [Commission impact, if any.]” Cancellation under review “Before we cancel, we’re confirming the penalty and refund so you know the exact cost.” Waiting on another team “I’ve sent this to [team] for [action]. The case stays open while we wait, and we’ll take it from there.” Nothing approved yet “I can confirm [fact]. I can’t confirm [waiver/refund/change] until [supplier/team] approves it.”"}]}, {"id": "zendesk", "group": "Working the case", "title": "Zendesk", "sub": "Working a ticket, statuses, notes, handoffs and closing", "compare": "", "items": [{"id": "zd-work", "kind": "proc", "stage": "all", "title": "Work a ticket", "aliases": ["zendesk", "ticket", "views", "reopened", "user type", "category", "output", "disposition", "fields"], "updated": null, "rule": "A ticket isn’t done because a reply, form or request was sent. It’s done when the work is.", "use": "You pick up a new, open or reopened ticket.", "body": "<ol type=\"1\">\n<li>Work from <strong>Views<\/strong>, not Home. Start with <strong>Reopened<\/strong> and urgent in-travel tickets, then open work, then waiting tickets that are due. Check the <strong>Updated<\/strong> time; waiting tickets don’t always come back on their own.<\/li>\n<li>Read the <strong>whole<\/strong> thread: internal notes, side conversations, attachments and anything already promised.<\/li>\n<li>Search for related tickets by booking number and requester. If someone already owns it, add to that ticket. Don’t start a second investigation.<\/li>\n<li>Find the booking in Plex or Groups Manager. If you can’t be sure which booking it is, ask for the booking number before you change anything.<\/li>\n<li>Work out what they need and whether anything is urgent: a traveler problem, a ticketing or supplier deadline, money at risk.<\/li>\n<li>Open the topic in this guide for that situation and do the work.<\/li>\n<li>Add an <strong>internal note<\/strong> (<a class=\"xref\" href=\"#zd-notes\">Internal note or public reply<\/a>).<\/li>\n<li>Send a <strong>public reply<\/strong> if needed. Check the recipient, attachments and that any timing you promise is true.<\/li>\n<li>Fill in <strong>user type, primary product, category, subcategory, output and booking number<\/strong>. Category is what they asked; output is what Classic did.<\/li>\n<li>Set the status that matches the real next step (<a class=\"xref\" href=\"#zd-status\">Which status?<\/a>) and submit.<\/li>\n<\/ol>", "escalate": "", "complete": "The work is done or truly pending with an owner, the fields and status are right, and the advisor knows the result or the next update time.", "text": "A ticket isn’t done because a reply, form or request was sent. It’s done when the work is. You pick up a new, open or reopened ticket. Work from Views , not Home. Start with Reopened and urgent in-travel tickets, then open work, then waiting tickets that are due. Check the Updated time; waiting tickets don’t always come back on their own. Read the whole thread: internal notes, side conversations, attachments and anything already promised. Search for related tickets by booking number and requester. If someone already owns it, add to that ticket. Don’t start a second investigation. Find the booking in Plex or Groups Manager. If you can’t be sure which booking it is, ask for the booking number before you change anything. Work out what they need and whether anything is urgent: a traveler problem, a ticketing or supplier deadline, money at risk. Open the topic in this guide for that situation and do the work. Add an internal note ( Internal note or public reply ). Send a public reply if needed. Check the recipient, attachments and that any timing you promise is true. Fill in user type, primary product, category, subcategory, output and booking number . Category is what they asked; output is what Classic did. Set the status that matches the real next step ( Which status? ) and submit. The work is done or truly pending with an owner, the fields and status are right, and the advisor knows the result or the next update time."}, {"id": "zd-status", "kind": "shared", "stage": "all", "title": "Which status?", "aliases": ["status", "waiting on ta", "waiting on vendor", "waiting on internal", "researching", "escalated", "solved", "new", "open"], "updated": null, "rule": "", "use": "", "body": "<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Situation<\/th>\n<th>Status<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Not picked up yet<\/td>\n<td><strong>New<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>You’re working on it now<\/td>\n<td><strong>Open<\/strong><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>A solved ticket got a reply<\/td>\n<td><strong>Reopened<\/strong>: read the old solution and treat it as active<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Waiting on the advisor<\/td>\n<td><strong>Waiting on TA Response<\/strong>: tell them exactly what you need<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Waiting on a hotel, airline, transfer company or other supplier<\/td>\n<td><strong>Waiting on Vendor Response<\/strong>: note the ask and your next follow-up date<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Waiting on Finance, Flights, Groups, Product or another Classic team<\/td>\n<td><strong>Waiting on Internal CV Response<\/strong>: you still own it unless they accept the whole case<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Researching, no one else involved<\/td>\n<td><strong>Researching<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>A supervisor or specialist has to decide<\/td>\n<td><strong>Escalated<\/strong>: state the decision, facts, deadline and your recommendation<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Completely done, nothing left to follow<\/td>\n<td><strong>Solved<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Replies to <strong>Solved<\/strong> tickets reopen them. Replies to many <strong>waiting<\/strong> statuses don’t bring the ticket back to your view, so check waiting Views and Updated times yourself.<\/p>", "escalate": "", "complete": "", "text": "Situation Status Not picked up yet New You’re working on it now Open A solved ticket got a reply Reopened : read the old solution and treat it as active Waiting on the advisor Waiting on TA Response : tell them exactly what you need Waiting on a hotel, airline, transfer company or other supplier Waiting on Vendor Response : note the ask and your next follow-up date Waiting on Finance, Flights, Groups, Product or another Classic team Waiting on Internal CV Response : you still own it unless they accept the whole case Researching, no one else involved Researching A supervisor or specialist has to decide Escalated : state the decision, facts, deadline and your recommendation Completely done, nothing left to follow Solved Replies to Solved tickets reopen them. Replies to many waiting statuses don’t bring the ticket back to your view, so check waiting Views and Updated times yourself."}, {"id": "zd-notes", "kind": "proc", "stage": "all", "title": "Internal note or public reply", "aliases": ["internal note", "public reply", "note", "signature", "yellow", "what to write", "chronology"], "updated": null, "rule": "Could another specialist pick this up without asking you anything? If not, add what’s missing.", "use": "You’re recording work or replying on a ticket.", "body": "<ol type=\"1\">\n<li>Choose <strong>Internal Note<\/strong> (yellow) for internal facts, supplier and Finance details, approvals and handoff information. Check the mode before you type.<\/li>\n<li>Write it as a short chronology: <strong>issue → what you did → who you contacted and what they said → booking or money outcome → what’s pending → who owns it → next follow-up time.<\/strong><\/li>\n<li>Separate what the client says from what the supplier confirmed. No emotional wording, no unnecessary personal data, no full card numbers.<\/li>\n<li>If goodwill, FTC or TSP commission courtesy is involved, note the <strong>total already used<\/strong> on the booking.<\/li>\n<li>Switch to <strong>Public Reply<\/strong> only for what the advisor or traveler should see. Check To and CC, forwarded history and attachments.<\/li>\n<li>Sign with your first and last name.<\/li>\n<li>After submitting, check it went out as public or internal as you intended.<\/li>\n<\/ol>", "escalate": "", "complete": "The note tells the whole story and the reply went to the right people.", "text": "Could another specialist pick this up without asking you anything? If not, add what’s missing. You’re recording work or replying on a ticket. Choose Internal Note (yellow) for internal facts, supplier and Finance details, approvals and handoff information. Check the mode before you type. Write it as a short chronology: issue → what you did → who you contacted and what they said → booking or money outcome → what’s pending → who owns it → next follow-up time. Separate what the client says from what the supplier confirmed. No emotional wording, no unnecessary personal data, no full card numbers. If goodwill, FTC or TSP commission courtesy is involved, note the total already used on the booking. Switch to Public Reply only for what the advisor or traveler should see. Check To and CC, forwarded history and attachments. Sign with your first and last name. After submitting, check it went out as public or internal as you intended. The note tells the whole story and the reply went to the right people."}, {"id": "zd-side", "kind": "proc", "stage": "all", "title": "Hand off or ask another team (side conversation)", "aliases": ["side conversation", "handoff", "transfer ticket", "forward", "ask finance", "ask flights", "reassign"], "updated": null, "rule": "Sending isn’t handing off. It’s handed off when they accept it.", "use": "Flights, Finance, a supplier, Groups or a specialist needs to act, and you want it tied to the ticket.", "body": "<ol type=\"1\">\n<li>Read existing side conversations first. Don’t send the same request twice.<\/li>\n<li>Choose <strong>Forward<\/strong> if they need the whole thread, <strong>+<\/strong> for a clean new request, or <strong>Insert ticket comments<\/strong> to add earlier messages.<\/li>\n<li>Include the booking or Group ID, travel dates, deadline, any approved amounts, and what you’ve already checked.<\/li>\n<li>Ask a clear question or for a specific deliverable, not just “please assist.” Say when you need it.<\/li>\n<li>Send it. Side conversation replies go only to those recipients; they don’t update the advisor.<\/li>\n<li>Add an internal note: who, what you asked, what’s blocking, and who follows up when.<\/li>\n<li>Set the main ticket to the right waiting status and put the follow-up time on your list.<\/li>\n<li>When they reply, check the result in the system before telling the advisor.<\/li>\n<li><strong>Transferring the whole case?<\/strong> Confirm they’ve accepted it and have the history, tell the advisor who owns it now, and reassign with the right status.<\/li>\n<\/ol>", "escalate": "", "complete": "They have a clear request and have accepted any handoff, and a waiting case still has your eye on it.", "text": "Sending isn’t handing off. It’s handed off when they accept it. Flights, Finance, a supplier, Groups or a specialist needs to act, and you want it tied to the ticket. Read existing side conversations first. Don’t send the same request twice. Choose Forward if they need the whole thread, + for a clean new request, or Insert ticket comments to add earlier messages. Include the booking or Group ID, travel dates, deadline, any approved amounts, and what you’ve already checked. Ask a clear question or for a specific deliverable, not just “please assist.” Say when you need it. Send it. Side conversation replies go only to those recipients; they don’t update the advisor. Add an internal note: who, what you asked, what’s blocking, and who follows up when. Set the main ticket to the right waiting status and put the follow-up time on your list. When they reply, check the result in the system before telling the advisor. Transferring the whole case? Confirm they’ve accepted it and have the history, tell the advisor who owns it now, and reassign with the right status. They have a clear request and have accepted any handoff, and a waiting case still has your eye on it."}, {"id": "zd-close", "kind": "proc", "stage": "all", "title": "Close a ticket (and chats that go quiet)", "aliases": ["close ticket", "solve", "solved", "chat inactive", "idle chat", "2 minutes", "end chat"], "updated": null, "rule": "", "use": "The work looks finished, or a chat has gone quiet.", "body": "<p><strong>Before you solve:<\/strong><\/p>\n<ol type=\"1\">\n<li>Their request is done, or the whole remainder was handed off and accepted.<\/li>\n<li>The result is visible in the system: tickets issued, booking adjusted, vendor confirmed, refund request in the queue.<\/li>\n<li>Your message is accurate about <strong>submitted<\/strong>, <strong>approved<\/strong>, <strong>processed<\/strong> and <strong>money received<\/strong>.<\/li>\n<li>Every field is filled in, with a clear internal note and a final reply.<\/li>\n<li>No vendor, Finance, Flights or specialist task is left without an owner.<\/li>\n<\/ol>\n<p><strong>Chat goes quiet:<\/strong><\/p>\n<ol type=\"1\">\n<li>After <strong>2 minutes<\/strong> with no reply, ask if they’re still there.<\/li>\n<li>Wait <strong>2 more minutes<\/strong>.<\/li>\n<li>Tell them they can reconnect if they still need help, then end the chat.<\/li>\n<li>Note any unfinished booking work on the ticket. Ending the chat doesn’t end the work.<\/li>\n<\/ol>", "escalate": "", "complete": "Solved only when nothing is left without an owner.", "text": "The work looks finished, or a chat has gone quiet. Before you solve: Their request is done, or the whole remainder was handed off and accepted. The result is visible in the system: tickets issued, booking adjusted, vendor confirmed, refund request in the queue. Your message is accurate about submitted , approved , processed and money received . Every field is filled in, with a clear internal note and a final reply. No vendor, Finance, Flights or specialist task is left without an owner. Chat goes quiet: After 2 minutes with no reply, ask if they’re still there. Wait 2 more minutes . Tell them they can reconnect if they still need help, then end the chat. Note any unfinished booking work on the ticket. Ending the chat doesn’t end the work. Solved only when nothing is left without an owner."}]}, {"id": "escalation", "group": "Working the case", "title": "Escalation", "sub": "When to escalate, what to send, suppliers and leadership", "compare": "", "items": [{"id": "esc-when", "kind": "shared", "stage": "all", "title": "When to escalate", "aliases": ["escalate", "escalation", "when to escalate", "supervisor", "manager", "escalation packet"], "updated": null, "rule": "Escalate to get a decision, not to hand off the work. Try to resolve it first unless someone is at risk.", "use": "", "body": "<ul>\n<li>Money or a manual price or refund decision is beyond your authority<\/li>\n<li>What’s being asked conflicts with policy<\/li>\n<li>You can’t work out who owns it after checking<\/li>\n<li>The supplier’s answer conflicts with the booking<\/li>\n<li>Travel is close or under way and normal timing won’t work<\/li>\n<li>Air is paid and ticketing is still unresolved<\/li>\n<li>You suspect fraud or a compromised account<\/li>\n<li>A system problem stops you finishing<\/li>\n<li>The advisor needs a supervisor<\/li>\n<li>You’d have to guess at a policy, code or exception<\/li>\n<\/ul>\n<p><strong>Send the facts needed to decide, not “I need help with booking 123”:<\/strong> booking number, advisor and agency, traveler, travel dates and how close, what was asked, what the booking shows, what you checked, what you did, the supplier’s or team’s response, the money or availability impact, any authority already used, and the exact decision you need, with your recommendation.<\/p>", "escalate": "", "complete": "", "text": "Escalate to get a decision, not to hand off the work. Try to resolve it first unless someone is at risk. Money or a manual price or refund decision is beyond your authority What’s being asked conflicts with policy You can’t work out who owns it after checking The supplier’s answer conflicts with the booking Travel is close or under way and normal timing won’t work Air is paid and ticketing is still unresolved You suspect fraud or a compromised account A system problem stops you finishing The advisor needs a supervisor You’d have to guess at a policy, code or exception Send the facts needed to decide, not “I need help with booking 123”: booking number, advisor and agency, traveler, travel dates and how close, what was asked, what the booking shows, what you checked, what you did, the supplier’s or team’s response, the money or availability impact, any authority already used, and the exact decision you need, with your recommendation."}, {"id": "esc-supplier", "kind": "proc", "stage": "all", "title": "Supplier won’t resolve it", "aliases": ["preferred supplier", "product development", "pd escalation", "72 hours", "supplier unresponsive", "eps", "expedia", "tbo", "a2a"], "updated": null, "rule": "You work the supplier first. Product Development is for Preferred suppliers only, after the threshold.", "use": "A supplier won’t respond or won’t offer an acceptable fix.", "body": "<ol type=\"1\">\n<li>Work the supplier directly first.<\/li>\n<li>Is it a <strong>Preferred<\/strong> supplier? Then escalate to <strong>Product Development<\/strong> if:\n<ul>\n<li>the supplier hasn’t responded within <strong>72 hours<\/strong> of the complaint, or<\/li>\n<li>their solution doesn’t meet Classic’s standard.<\/li>\n<\/ul><\/li>\n<li>Send PD the booking number, facts, every contact with times, the traveler impact and the outcome you recommend.<\/li>\n<li>Keep the advisor updated until PD has clearly taken ownership.<\/li>\n<\/ol>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>If<\/th>\n<th>Then<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>It’s <strong>EPS<\/strong> (Expedia)<\/td>\n<td>Not PD. Call <strong>800-509-7498<\/strong> or email A2A@chat.expediapartnersolutions.com.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>It’s <strong>TBO<\/strong><\/td>\n<td>Not PD. Email ops.northamerica@tbo.com.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>The traveler is in trouble right now<\/td>\n<td>Don’t wait 72 hours. Involve CS leadership immediately and keep working the supplier.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "escalate": "The threshold is met, or the traveler needs leadership now.", "complete": "PD or the source has accepted it, and you’ve kept the advisor informed until then.", "text": "You work the supplier first. Product Development is for Preferred suppliers only, after the threshold. A supplier won’t respond or won’t offer an acceptable fix. Work the supplier directly first. Is it a Preferred supplier? Then escalate to Product Development if: the supplier hasn’t responded within 72 hours of the complaint, or their solution doesn’t meet Classic’s standard. Send PD the booking number, facts, every contact with times, the traveler impact and the outcome you recommend. Keep the advisor updated until PD has clearly taken ownership. If Then It’s EPS (Expedia) Not PD. Call 800-509-7498 or email A2A@chat.expediapartnersolutions.com. It’s TBO Not PD. Email ops.northamerica@tbo.com. The traveler is in trouble right now Don’t wait 72 hours. Involve CS leadership immediately and keep working the supplier. The threshold is met, or the traveler needs leadership now. PD or the source has accepted it, and you’ve kept the advisor informed until then."}, {"id": "esc-leader", "kind": "proc", "stage": "all", "title": "Bring in leadership", "aliases": ["supervisor", "manager", "leadership", "callback", "1 hour", "24 hours", "after hours escalation"], "updated": null, "rule": "", "use": "A caller asks for a supervisor, or a decision is beyond you.", "body": "<ol type=\"1\">\n<li>Try the normal resolution first, unless someone is at risk.<\/li>\n<li>Send the escalation details (<a class=\"xref\" href=\"#esc-when\">When to escalate<\/a>) with your recommended solution, not just “the customer wants a manager.”<\/li>\n<li>Don’t promise an outcome leadership hasn’t approved.<\/li>\n<li>If the usual owner is offline and it’s time-sensitive, don’t wait. Go to CS leadership; they’ll find the after-hours path.<\/li>\n<\/ol>\n<p><strong>Callback times:<\/strong> urgent or in-travel, immediately if a leader is available, otherwise within <strong>1 hour<\/strong>. Non-urgent and post-travel, within <strong>24 hours<\/strong>.<\/p>", "escalate": "", "complete": "The leader has everything needed to decide without starting over.", "text": "A caller asks for a supervisor, or a decision is beyond you. Try the normal resolution first, unless someone is at risk. Send the escalation details ( When to escalate ) with your recommended solution, not just “the customer wants a manager.” Don’t promise an outcome leadership hasn’t approved. If the usual owner is offline and it’s time-sensitive, don’t wait. Go to CS leadership; they’ll find the after-hours path. Callback times: urgent or in-travel, immediately if a leader is available, otherwise within 1 hour . Non-urgent and post-travel, within 24 hours . The leader has everything needed to decide without starting over."}]}, {"id": "post", "group": "Working the case", "title": "Post-Travel handoff", "sub": "When to use the Post Travel Concern form, and who owns the case", "compare": "", "items": [{"id": "post-handoff", "kind": "proc", "stage": "post", "title": "Hand off to Post-Travel", "aliases": ["post travel", "post travel concern", "form", "after the trip", "complaint after travel", "24 hours", "smartsheet form"], "updated": null, "rule": "Last day or after, and more than 24 hours to fix: it moves to a Post-Travel specialist through the Post Travel Concern form.", "use": "The trip is over (or on its last day) and the advisor raises a complaint that needs investigation.", "body": "<p><strong>The case goes to a Post-Travel specialist when both are true:<\/strong> it’s the last day of the trip or the trip is over, <strong>and<\/strong> the issue will take more than 24 hours to resolve. This is an ownership rule. A traveler on their last day is still In-Travel for refund timing and approvals.<\/p>\n<ol type=\"1\">\n<li>Tell the advisor or client the <strong>Post Travel Concern<\/strong> form is required: https://app.smartsheet.com/b/form/219a2f5e09bf46cd811b53a5bc5ad7b1. They complete it themselves.<\/li>\n<li>Make sure your notes summarize everything already done, every supplier contact, and what’s still being asked.<\/li>\n<li>Set expectations: if it’s escalated, leadership calls back within 24 hours.<\/li>\n<\/ol>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>If<\/th>\n<th>Then<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>It’s just a status question<\/td>\n<td>Answer it. No form.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>It began during travel and you can still finish it within 24 hours<\/td>\n<td>Finish it yourself.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>The traveler still needs help today<\/td>\n<td>Solve that first. The form is for what’s left.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "escalate": "A safety, legal or high-risk allegation, or the caller asks for leadership.", "complete": "The form is submitted or advised, your notes are complete, and nothing urgent is left.", "text": "Last day or after, and more than 24 hours to fix: it moves to a Post-Travel specialist through the Post Travel Concern form. The trip is over (or on its last day) and the advisor raises a complaint that needs investigation. The case goes to a Post-Travel specialist when both are true: it’s the last day of the trip or the trip is over, and the issue will take more than 24 hours to resolve. This is an ownership rule. A traveler on their last day is still In-Travel for refund timing and approvals. Tell the advisor or client the Post Travel Concern form is required: https://app.smartsheet.com/b/form/219a2f5e09bf46cd811b53a5bc5ad7b1. They complete it themselves. Make sure your notes summarize everything already done, every supplier contact, and what’s still being asked. Set expectations: if it’s escalated, leadership calls back within 24 hours. If Then It’s just a status question Answer it. No form. It began during travel and you can still finish it within 24 hours Finish it yourself. The traveler still needs help today Solve that first. The form is for what’s left. A safety, legal or high-risk allegation, or the caller asks for leadership. The form is submitted or advised, your notes are complete, and nothing urgent is left."}, {"id": "post-owner", "kind": "proc", "stage": "post", "title": "There’s already a Post-Travel case", "aliases": ["assigned specialist", "existing case", "post travel owner", "follow up post travel"], "updated": null, "rule": "Once a specialist has it, they own it until it’s finished or leadership reassigns it.", "use": "A call, email or ticket relates to a case a Post-Travel specialist already has.", "body": "<ol type=\"1\">\n<li>Check Plex and Zendesk for an existing Post-Travel file.<\/li>\n<li>Find the assigned specialist.<\/li>\n<li>Add the new information to their case.<\/li>\n<li>Send the follow-up to that specialist. Don’t start a parallel investigation.<\/li>\n<\/ol>\n<p>New files are assigned by CS leadership.<\/p>", "escalate": "", "complete": "The new information is with the assigned specialist.", "text": "Once a specialist has it, they own it until it’s finished or leadership reassigns it. A call, email or ticket relates to a case a Post-Travel specialist already has. Check Plex and Zendesk for an existing Post-Travel file. Find the assigned specialist. Add the new information to their case. Send the follow-up to that specialist. Don’t start a parallel investigation. New files are assigned by CS leadership. The new information is with the assigned specialist."}]}, {"id": "remarks", "group": "Working the case", "title": "Plex remarks and notes", "sub": "Every remark code, and what a good note includes", "compare": "", "items": [{"id": "rem-codes", "kind": "shared", "stage": "all", "title": "Remark codes", "aliases": ["remark", "remark code", "adkx", "afyi", "afyk", "ascc", "cell", "coef", "ffml", "fnlp", "optx", "resa", "rsmc", "rsss", "rweb", "splm", "ssup", "tour", "trsf", "beyond"], "updated": null, "rule": "Use the code that matches the work you actually finished. For ADKX, FNLP, SSUP and CELL, enter it only once the task is really done.", "use": "", "body": "<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Code<\/th>\n<th>Use it when<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>ADKX<\/strong><\/td>\n<td>An Advising Kickback is fully resolved and the follow-up is done<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>AFYI<\/strong><\/td>\n<td>An informational note outside travel (pre- or post-travel), not part of an active Post-Travel file<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>AFYK<\/strong><\/td>\n<td>Any in-travel L2 work, by phone, email, chat or SMS<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>ASCC<\/strong><\/td>\n<td>You’ve called the customer about a schedule change<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Beyond<\/strong><\/td>\n<td>Beyond booking notes or work<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>CELL<\/strong><\/td>\n<td>You got the traveler’s mobile number for transfers<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>COEF<\/strong><\/td>\n<td>Concierge email follow-up<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>FFML<\/strong><\/td>\n<td>Friends and Family work<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>FNLP<\/strong><\/td>\n<td>You told the advisor final payment is overdue and to call or pay online<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>OPTX<\/strong><\/td>\n<td>An option was cancelled<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>RESA<\/strong><\/td>\n<td>Reservations Assist work<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>RSMC<\/strong><\/td>\n<td>Minor reservation changes<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>RSSS<\/strong><\/td>\n<td>Reservations Support work<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>RWEB<\/strong><\/td>\n<td>Web Support work is done<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>SPLM<\/strong><\/td>\n<td>You sent an LMTR (ticketing request)<\/t  the booking history showed<\/li>\n<li>Who you contacted and what they said<\/li>\n<li>What was promised, and what was explicitly not promised<\/li>\n<li>The money: refund, penalty, goodwill, FTC, commission, payment or VCC<\/li>\n<li>What the advisor or traveler decided or approved<\/li>\n<li>The next step, who owns it, and when<\/li>\n<\/ul>\n<p>Keep it short and factual. Separate what was confirmed from what someone claims. Plex notes are seen by other teams, including Sales.<\/p>", "escalate": "", "complete": "", "text": "A code isn’t a note. Another specialist should be able to pick up the booking without asking you anything. Why they contacted us The traveler impact What the booking history showed Who you contacted and what they said What was promised, and what was explicitly not promised The money: refund, penalty, goodwill, FTC, commission, payment or VCC What the advisor or traveler decided or approved The next step, who owns it, and when Keep it short and factual. Separate what was confirmed from what someone claims. Plex notes are seen by other teams, including Sales."}]}, {"id": "contacts", "group": "Reference", "title": "Contacts and routing", "sub": "Every team, inbox, form and phone number in one place", "compare": "", "items": [{"id": "dir-all", "kind": "shared", "stage": "all", "title": "Who to contact", "aliases": ["contact", "email", "phone", "directory", "routing", "who do i contact", "inbox", "smartsheet", "form"], "updated": null, "rule": "", "use": "", "body": "<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Purpose<\/th>\n<th>Route / contact<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Add/remove Trip Protection prior to deposit (TA emails directly)<\/td>\n<td>Changes – changes@classicvacations.com<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Rates appear incorrect (too high/too low)<\/td>\n<td>CV-ResPD Issues – SJC-ResPDIssues@classicvacations.com<\/t dvisor’s explicit approval to commit a live booking change/component after price/impact is explained.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>CAD<\/td>\n<td>Manual/competitive booking process used when a component is built or secured outside normal live inventory. Unconfirmed CAD items default to Pending Request.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>EPS<\/td>\n<td>Expedia affiliate supplier source. Escalate through EPS channels, not Preferred PD.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>FNLP<\/td>\n<td>L2 remark/task code used when final payment is overdue and the TA has been advised to pay by phone or online.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>FTC<\/td>\n<td>Future Travel Credit used as service recovery.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Groups Manager<\/td>\n<td>System/resource used to review Group booking/rooming information.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Legacy CS<\/td>\n<td>Former Customer Service function, now included in L2.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Legacy RSS<\/td>\n<td>Former Reservations Support function, now included in L2.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Line-Item Adjustment<\/td>\n<td>Financial change tied to a specific component.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>LMTR<\/td>\n<td>Last-minute ticketing request used after payment/passenger-data checks for paid but not-yet-issued air.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Manifest<\/td>\n<td>Supplier communication/confirmation process.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Mod History<\/td>\n<td>Booking modification history used to investigate prior changes.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Net with Tax<\/td>\n<td>Booking-summary amount used for advisor net payment (package less advisor commission).<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>OBE<\/td>\n<td>Online booking environment/online booking.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Plex<\/td>\n<td>Primary reservation platform used for booking servicing and history.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Preferred<\/td>\n<td>Classic Preferred supplier/product eligible for PD escalation under <a href=\"#esc-supplier\">Escalations<\/a>.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>QA<\/td>\n<td>Quality assurance review of a paid/invoiced reservation.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>QA Advising<\/td>\n<td>Workflow/QA path for itinerary gaps, missing comments/information, or advisor quick-fix items.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>QA Error<\/td>\n<td>Workflow/QA path for an actual booking error that requires correction, such as date mismatch or duplicate room/name assignment.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Record Locator<\/td>\n<td>Airline confirmation used to view current flight record.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>RWEB<\/td>\n<td>L2 remark/task code: Websupport worked.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Side conversation<\/td>\n<td>Zendesk communication thread used to contact a third party/internal party while preserving the primary ticket.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>SSUP<\/td>\n<td>L2 remark/process used for reviewed unpaid online options.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>TripMate<\/td>\n<td>Insurance/claims administrator for the insurance portion of TSP.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>TSP<\/td>\n<td>Travel Smart Plan / trip protection product on the booking.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>VCC<\/td>\n<td>Virtual credit card used to pay/secure applicable supplier bookings. Sometimes called “BCC.”<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "escalate": "", "complete": "", "text": "Term Meaning ADKX L2 remark/task code: Advising Kick-Back - Resolved. Booking-Level Adjustment Whole-booking commission or L2/TA goodwill/error-related financial handling. Buy-in Advisor’s explicit approval to commit a live booking change/component after price/impact is explained. CAD Manual/competitive booking process used when a component is built or secured outside normal live inventory. Unconfirmed CAD items default to Pending Request. EPS Expedia affiliate supplier source. Escalate through EPS channels, not Preferred PD. FNLP L2 remark/task code used when final payment is overdue and the TA has been advised to pay by phone or online. FTC Future Travel Credit used as service recovery. Groups Manager System/resource used to review Group booking/rooming information. Legacy CS Former Customer Service function, now included in L2. Legacy RSS Former Reservations Support function, now included in L2. Line-Item Adjustment Financial change tied to a specific component. LMTR Last-minute ticketing request used after payment/passenger-data checks for paid but not-yet-issued air. Manifest Supplier communication/confirmation process. Mod History Booking modification history used to investigate prior changes. Net with Tax Booking-summary amount used for advisor net payment (package less advisor commission). OBE Online booking environment/online booking. Plex Primary reservation platform used for booking servicing and history. Preferred Classic Preferred supplier/product eligible for PD escalation under Escalations . QA Quality assurance review of a paid/invoiced reservation. QA Advising Workflow/QA path for itinerary gaps, missing comments/information, or advisor quick-fix items. QA Error Workflow/QA path for an actual booking error that requires correction, such as date mismatch or duplicate room/name assignment. Record Locator Airline confirmation used to view current flight record. RWEB L2 remark/task code: Websupport worked. Side conversation Zendesk communication thread used to contact a third party/internal party while preserving the primary ticket. SSUP L2 remark/process used for reviewed unpaid online options. TripMate Insurance/claims administrator for the insurance portion of TSP. TSP Travel Smart Plan / trip protection product on the booking. VCC Virtual credit card used to pay/secure applicable supplier bookings. Sometimes called “BCC.”"}]}]};</script>
<script>
(function(){
const S={all:'All stages',pre:'Pre-Travel',in:'In-Travel',post:'Post-Travel'};
const T={},ITEM={},OWNER={},REF={};
DATA.topics.forEach(t=>{T[t.id]=t;t.items.forEach(i=>{ITEM[i.id]=i;OWNER[i.id]=t.id;REF[i.ref]=i.id;});});
const view=document.getElementById('view'),side=document.getElementById('side');
const ls={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
let stage=ls.get('l2.stage','all'); if(!S[stage]) stage='all';
let current=null; const checks={};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vis=i=>stage==='all'||i.stage==='all'||i.stage.split(' ').includes(stage);
const stageName=s=>{if(s==='all')return 'Any stage';const p=s.split(' ');return p.map(x=>S[x]).join(' and ');};
const first=s=>s.split(' ')[0];

const SITS=[
 ['pre','Paid, but the air isn’t ticketed','air-a'],
 ['pre','Change or cancel a flight','air-b'],
 ['pre','The airline changed a flight time','air-d'],
 ['pre','Change hotel dates or room','changes-hotel'],
 ['pre','Cancel a booking before travel','refunds-a'],
 ['pre','Take a payment','pay-take'],
 ['pre','A card was declined','pay-decline'],
 ['pre','Something looks like fraud','fraud-flags'],
 ['pre','A component is still pending','pending-follow'],
 ['pre','QA a paid booking','qa-paid'],
 ['in','Flight cancelled or connection missed','air-e'],
 ['in','Traveler wants to leave or change hotels','hotel-move'],
 ['in','Hotel problem or complaint','hotel-complaint'],
 ['in','Missed pickup or transfer problem','ground-missed'],
 ['in','Hotel has a VCC problem','pay-vcc'],
 ['in','Hotel charged the traveler’s card','pay-hotel-direct'],
 ['in','Hotel approved refunding unused nights','refunds-b'],
 ['in','Extend a stay','cad-extend'],
 ['in','Group traveler has a problem','grp-issue'],
 ['post','Complaint after the trip','post-handoff'],
 ['post','Traveler didn’t use a flight','air-f'],
 ['post','Refund question after the trip','refunds-g'],
 ['all','“The refund hasn’t arrived”','refunds-x'],
 ['all','Move money to another booking','refunds-d'],
 ['all','Goodwill or a travel credit','rec-goodwill'],
 ['all','Is this covered by TSP?','tsp-questions'],
 ['all','Caller is upset or wants a supervisor','comm-deesc'],
 ['all','Which Zendesk status?','zd-status'],
 ['all','Which remark code?','rem-codes'],
 ['all','Who do I contact?','dir-all'],
];

const closedGroups=new Set();
function renderSide(){
  let h='<a href="#home" class="home-link'+(current?'':' on')+'">What’s happening?</a>';
  const groups=[];DATA.topics.forEach(t=>{let g=groups.find(x=>x.name===t.group);if(!g){g={name:t.group,topics:[]};groups.push(g);}g.topics.push(t);});
  groups.forEach(g=>{
    const hasCur=g.topics.some(t=>t.id===current); const closed=closedGroups.has(g.name)&&!hasCur;
    h+='<div class="sgrp'+(closed?' closed':'')+'"><button type="button" class="grp-h" data-g="'+esc(g.name)+'" aria-expanded="'+(!closed)+'"><span>'+esc(g.name)+'</span><svg class="chev" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="grp-items">';
    g.topics.forEach(t=>{
      h+='<a href="#'+t.id+'" class="topic'+(current===t.id?' on':'')+'">'+esc(t.title)+'</a>';
      if(current===t.id&&t.items.length>1){h+='<div class="sub">';t.items.forEach(i=>{h+='<a href="#'+i.id+'" class="'+(vis(i)?'':'dim')+'"><i class="dot-'+first(i.stage)+'"></i><span>'+esc(i.title)+'</span></a>';});h+='</div>';}
    });
    h+='</div></div>';
  });
  side.innerHTML=h;
  side.querySelectorAll('.grp-h').forEach(b=>b.addEventListener('click',()=>{const g=b.dataset.g;closedGroups.has(g)?closedGroups.delete(g):closedGroups.add(g);const w=b.parentElement;const c=w.classList.toggle('closed');b.setAttribute('aria-expanded',String(!c));}));
  const on=side.querySelector('a.topic.on'); if(on&&current) on.scrollIntoView({block:'nearest'});
}

function renderHome(){
  current=null;
  let h='<div class="home"><h1>What’s happening?</h1><p class="sub-h">Pick the situation. It opens the steps, already set to the right stage. Not here? Search above, or browse the topics.</p>';
  ['pre','in','post','all'].forEach(s=>{const rows=SITS.filter(r=>r[0]===s);
    h+='<div class="grp"><i class="dot-'+s+'"></i>'+stageName(s)+'</div><div class="sits">';
    rows.forEach(r=>{h+='<button class="sit" data-go="'+r[2]+'" data-s="'+r[0]+'"><span>'+esc(r[1])+'</span></button>';});
    h+='</div>';});
  h+='</div>';
  view.innerHTML=h;
  view.querySelectorAll('.sit').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.s!=='all')setStage(b.dataset.s);go(b.dataset.go);}));
  renderSide(); syncSeg(); scrollTo(0,0);
}

function card(i){
  let h='<section class="card '+first(i.stage)+'" id="'+i.id+'"><div class="card-h"><span class="badge '+first(i.stage)+'">'+stageName(i.stage)+'</span><h2>'+esc(i.title)+'</h2><div class="tools">';
  if(i.updated) h+='<span class="chip upd">'+esc(i.updated)+'</span>';
  if(i.kind==='proc') h+='<button class="tbtn clear" hidden>Clear checks</button>';
  h+='</div></div>';
  if(i.use) h+='<p class="use">'+i.use+'</p>';
  if(i.rule) h+='<div class="callout"><b>RULE</b>'+i.rule+'</div>';
  h+='<div class="body">'+i.body+'</div>';
  if(i.escalate) h+='<div class="callout warn"><b>ESCALATE WHEN</b>'+i.escalate+'</div>';
  if(i.complete) h+='<div class="callout done"><b>COMPLETE WHEN</b>'+i.complete+'</div>';
  return h+'</section>';
}
function addChecks(sec){
  const id=sec.id; checks[id]=checks[id]||new Set(); let n=0;
  sec.querySelectorAll('.body > ol').forEach(ol=>{const st=parseInt(ol.getAttribute('start')||'1',10);
    [...ol.children].forEach((li,k)=>{const key=n++;const lbl=document.createElement('span');lbl.className='lbl';while(li.firstChild)lbl.appendChild(li.firstChild);
      const num=document.createElement('span');num.className='num';num.textContent=(st+k)+'.';lbl.insertBefore(num,lbl.firstChild);
      const cb=document.createElement('input');cb.type='checkbox';cb.setAttribute('aria-label','Step '+(st+k)+' done');
      li.classList.add('chk');li.appendChild(cb);li.appendChild(lbl);
      if(checks[id].has(key)){cb.checked=true;li.classList.add('done');}
      cb.addEventListener('change',()=>{li.classList.toggle('done',cb.checked);cb.checked?checks[id].add(key):checks[id].delete(key);sec.querySelector('.clear').hidden=!checks[id].size;});});});
  const c=sec.querySelector('.clear'); if(c){c.hidden=!checks[id].size;c.addEventListener('click',()=>{checks[id].clear();sec.querySelectorAll('li.chk').forEach(li=>{li.classList.remove('done');li.querySelector('input').checked=false;});c.hidden=true;});}
}
function renderTopic(tid,focus){
  const t=T[tid]; current=tid;
  let h='<h1>'+esc(t.title)+'</h1><p class="sub-h">'+esc(t.sub)+'</p>';
  h+='<nav class="intopic" aria-label="In this topic"><b>In this topic</b>'+t.items.map(i=>'<a href="#'+i.id+'" data-id="'+i.id+'"><i class="dot-'+first(i.stage)+'"></i>'+esc(i.title)+'</a>').join('')+'</nav>';
  if(t.compare) h+='<section class="card compare-card"><h2>What changes by stage</h2>'+t.compare.replace('<table>','<table class="compare">')+'</section>';
  h+='<div id="note"></div>';
  t.items.forEach(i=>{h+=card(i);});
  const k=DATA.topics.findIndex(x=>x.id===tid),pv=DATA.topics[k-1],nx=DATA.topics[k+1];
  h+='<nav class="foot" aria-label="More topics"><b>Keep going</b>'+(pv?'<a href="#'+pv.id+'">← '+esc(pv.title)+'</a>':'')+(nx?'<a href="#'+nx.id+'">'+esc(nx.title)+' →</a>':'')+'<a href="#home">What’s happening?</a></nav>';
  view.innerHTML=h;
  view.querySelectorAll('table:not(.compare)').forEach(tb=>{if(!tb.parentElement.classList.contains('table-wrap')){const w=document.createElement('div');w.className='table-wrap';tb.parentNode.insertBefore(w,tb);w.appendChild(tb);}});
  const ct=view.querySelector('table.compare');if(ct){const w=document.createElement('div');w.className='table-wrap';ct.parentNode.insertBefore(w,ct);w.appendChild(ct);}
  view.querySelectorAll('.card[id]').forEach(sec=>{if(ITEM[sec.id].kind==='proc')addChecks(sec);});
  view.querySelectorAll('.body code').forEach(c=>{if(!/^[A-Z]:\\/.test(c.textContent))return;const b=document.createElement('button');b.className='copy';b.type='button';b.innerHTML=ICON;b.title='Copy folder path';b.setAttribute('aria-label','Copy folder path');b.addEventListener('click',()=>copy(c.textContent,b,false));c.after(b);});
  linkify(view); apply(); renderSide();
  if(focus){if(!vis(ITEM[focus]))setStage('all');const el=document.getElementById(focus);requestAnimationFrame(()=>{el.scrollIntoView({block:'start'});});}
  else scrollTo(0,0);
  if(innerWidth<=760) closeSide();
}
function syncSeg(){document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.s===stage)));}
function apply(){
  syncSeg(); if(!current) return;
  let hid=0; view.querySelectorAll('.card[id]').forEach(c=>{const ok=vis(ITEM[c.id]);c.hidden=!ok;if(!ok)hid++;});
  view.querySelectorAll('.intopic a').forEach(a=>a.classList.toggle('dim',!vis(ITEM[a.dataset.id])));
  const tb=view.querySelector('table.compare');
  if(tb){tb.classList.remove('s-pre','s-in','s-post');if(stage!=='all')tb.classList.add('s-'+stage);const k={pre:1,in:2,post:3}[stage];
    tb.querySelectorAll('tr').forEach(tr=>[...tr.children].forEach((c,x)=>{c.classList.toggle('on',!!k&&x===k);c.classList.toggle('off',!!k&&x>0&&x!==k);}));}
  const n=document.getElementById('note');
  const total=view.querySelectorAll('.card[id]').length;
  n.innerHTML=!hid?'':(hid===total?'<div class="note">Nothing in this topic is specific to '+S[stage]+'. <button id="sa">Show all stages</button></div>':'<div class="note">'+hid+' for other stages hidden. <button id="sa">Show all</button></div>');
  const b=document.getElementById('sa'); b&&b.addEventListener('click',()=>{setStage('all');apply();renderSide();});
}
function setStage(s){stage=s;ls.set('l2.stage',s);}
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{setStage(b.dataset.s);apply();renderSide();}));

function copy(txt,btn,label){const done=()=>{btn.classList.add('ok');const o=btn.textContent;if(label)btn.textContent='Copied '+txt;setTimeout(()=>{btn.classList.remove('ok');if(label)btn.textContent=o;},1400);};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,done);else done();}
const ICON='<svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="5" y="5" width="8.5" height="9" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M3.5 11V3.5a1.5 1.5 0 011.5-1.5h5.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
function linkify(root){const RE=/(https?:\/\/[^\s<>()"]+)|([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,})/g;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){if(!/@|https?:\/\//.test(n.nodeValue))return 2;return n.parentElement.closest('a,button')?2:1;}});
  const ns=[];let n;while((n=w.nextNode()))ns.push(n);
  ns.forEach(node=>{const s=node.nodeValue;let m,last=0,hit=false;const f=document.createDocumentFragment();RE.lastIndex=0;
    while((m=RE.exec(s))){hit=true;let v=m[0],tr='';if(m[1]){const x=v.match(/[).,;:!?]+$/);if(x){tr=x[0];v=v.slice(0,-tr.length);}}
      if(m.index>last)f.appendChild(document.createTextNode(s.slice(last,m.index)));
      const a=document.createElement('a');a.className='autolink';a.textContent=v;a.href=m[1]?v:'mailto:'+v;if(m[1]){a.target='_blank';a.rel='noopener';}f.appendChild(a);
      const b=document.createElement('button');b.className='copy';b.type='button';b.innerHTML=ICON;b.title='Copy';b.setAttribute('aria-label','Copy '+v);b.addEventListener('click',()=>copy(v,b,false));f.appendChild(b);
      if(tr)f.appendChild(document.createTextNode(tr));last=m.index+m[0].length;}
    if(!hit)return;if(last<s.length)f.appendChild(document.createTextNode(s.slice(last)));node.parentNode.replaceChild(f,node);});}

/* search */
const IDX=[];DATA.topics.forEach(t=>t.items.forEach(i=>IDX.push({id:i.id,topic:t.title,title:i.title,stage:i.stage,al:(i.aliases||[]).join(' | ').toLowerCase(),orig:i.text,text:i.text.toLowerCase()})));
function lev1(a,b){if(Math.abs(a.length-b.length)>1)return false;let i=0,j=0,e=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue;}if(++e>1)return false;if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++;}}return e+(a.length-i)+(b.length-j)<=1;}
const STOP=new Set(['the','a','an','to','of','is','in','on','for','and','my','i','it','was','has','hasnt','hasn’t','how','do','what','when','with']);
function score(e,terms,raw){let sc=0;const tl=e.title.toLowerCase();
  if(raw.length>3&&e.al.includes(raw))sc+=30;
  terms.forEach(w=>{let hit=false;if(tl.includes(w)){sc+=10;hit=true;}if(e.al.includes(w)){sc+=8;hit=true;}if(e.text.includes(w)){sc+=2;hit=true;}
    if(!hit&&w.length>=5){if((tl+' '+e.al).split(/[^a-z0-9’'$%-]+/).some(x=>x.length>=4&&lev1(w,x))){sc+=5;hit=true;}}if(!hit)sc-=6;});
  if(stage!=='all'&&(e.stage.split(' ').includes(stage)||e.stage==='all'))sc+=3;return sc;}
const q=document.getElementById('q'),R=document.getElementById('results');let res=[],sel=-1;
function snip(e,terms){const k=terms.map(w=>e.text.indexOf(w)).filter(x=>x>=0)[0];if(k===undefined)return '';const s=Math.max(0,k-45);let o=esc((s?'…':'')+e.orig.slice(s,k+85)+'…');
  terms.forEach(w=>{if(w.length>2)o=o.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');});return o;}
function search(){const raw=q.value.trim().toLowerCase();if(!raw){R.classList.remove('show');return;}
  const terms=raw.split(/\s+/).filter(w=>w.length>1&&!STOP.has(w));
  res=IDX.map(e=>({e,s:score(e,terms,raw)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,7);sel=-1;
  if(!res.length){R.innerHTML='<div class="res-empty">No match for “'+esc(q.value)+'”. Try how the advisor said it, or a code like LMTR.</div>';R.classList.add('show');return;}
  R.innerHTML=res.map((x,k)=>'<button class="res" data-k="'+k+'"><div class="t">'+esc(x.e.title)+'</div><div class="m"><span class="chip '+first(x.e.stage)+'">'+stageName(x.e.stage)+'</span> '+esc(x.e.topic)+(snip(x.e,terms)?'<br>'+snip(x.e,terms):'')+'</div></button>').join('');
  R.classList.add('show');R.querySelectorAll('.res').forEach(b=>b.addEventListener('click',()=>pick(+b.dataset.k)));}
function pick(k){const x=res[k];if(!x)return;R.classList.remove('show');q.value='';q.blur();go(x.e.id);}
q.addEventListener('input',search);
q.addEventListener('keydown',e=>{const it=R.querySelectorAll('.res');if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(it.length-1,sel+1);}else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(0,sel-1);}else if(e.key==='Enter'){e.preventDefault();pick(sel<0?0:sel);return;}else if(e.key==='Escape'){R.classList.remove('show');q.blur();return;}else return;it.forEach((b,k)=>b.classList.toggle('sel',k===sel));it[sel]&&it[sel].scrollIntoView({block:'nearest'});});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))R.classList.remove('show');});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==q&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();q.focus();}});

/* sidebar toggle */
const menu=document.getElementById('menu');
function closeSide(){side.classList.add('closed');menu.setAttribute('aria-expanded','false');}
function openSide(){side.classList.remove('closed');menu.setAttribute('aria-expanded','true');}
menu.addEventListener('click',()=>side.classList.contains('closed')?openSide():closeSide());
if(innerWidth<=760) closeSide();
let wasNarrow=innerWidth<=760;addEventListener('resize',()=>{const n=innerWidth<=760;if(n!==wasNarrow){n?closeSide():openSide();wasNarrow=n;}});

/* routing (works inside the SharePoint iframe) */
/* In-page navigation never relies on the browser following a link, because the host
   page (artifact viewer, SharePoint embed) can set its own base address. */
function show(h){if(!h||h==='home')return renderHome(); if(T[h])return renderTopic(h,null); if(ITEM[h])return renderTopic(OWNER[h],h); renderHome();}
function go(id){show(id);try{history.pushState({id},'',location.href.split('#')[0]+'#'+id);}catch(e){}}
addEventListener('popstate',e=>show((e.state&&e.state.id)||decodeURIComponent(location.hash.slice(1))));
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#"]'); if(!a) return;
  e.preventDefault(); const id=decodeURIComponent(a.getAttribute('href').slice(1));
  if(innerWidth<=760&&a.closest('#side')) closeSide();
  go(id||'home');
});
addEventListener('hashchange',()=>show(decodeURIComponent(location.hash.slice(1))));
show(decodeURIComponent(location.hash.slice(1)));
})();
</script>
