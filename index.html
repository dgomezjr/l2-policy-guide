or<\/strong>. Airlines set their own rules, so when it’s close, Flights decides.<\/p>\n<h4 id=\"step-2-should-you-look-for-better-flights\">Step 2: Should you look for better flights?<\/h4>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>How much did it move?<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Under 30 minutes<\/td>\n<td>Usually just acknowledge it. Check it doesn’t break a connection or transfer.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>30–59 minutes<\/td>\n<td>Check connections, late arrivals and transfer times. If it causes a real problem, call Flights for options.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>60 minutes or more<\/td>\n<td>Call Flights for alternatives, even if it’s minor.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"step-3-what-to-do\">Step 3: What to do<\/h4>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>If<\/th>\n<th>Then<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Flights emails you a <strong>major<\/strong> change<\/td>\n<td>Check the option Flights sent is reasonable <strong>before<\/strong> you contact the client. If it isn’t, ask Flights for more options first.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>The advisor calls about a change notice<\/td>\n<td>Call Flights to find out what changed and what the options are.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>The change is <strong>minor<\/strong><\/td>\n<td>Plex usually accepts it automatically and the advisor gets a notice. When the advisor calls, still get their <strong>verbal OK<\/strong>, tell Flights by phone, and remark it. No ticket exchange.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>The client doesn’t like the option<\/td>\n<td>Find out what they need, then ask Flights for more options.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>The client accepts a <strong>major<\/strong> change<\/td>\n<td>Confirm the acceptance with Flights <strong>by phone<\/strong>. Then email <strong>SJC Last Minute Ticket Request<\/strong>, sjcticketrequest@classicvacations.com, asking Flights to exchange the tickets, with the new itinerary.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>The client wants to reject a <strong>major<\/strong> change<\/td>\n<td>Call Flights to confirm the ticket qualifies for cancellation and a full refund under the airline’s rules. <strong>Only then<\/strong> tell the client. If it qualifies, the flight is cancelled and refunded, and any new flights are booked at today’s fares on any airline.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>The client rejects a <strong>minor<\/strong> change<\/td>\n<td>Ask Flights about other options. A full refund isn’t available for minor changes.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"then-every-time\">Then, every time<\/h4>\n<ol type=\"1\">\n<li>Fix anything the new times affect: transfer pickups, a late hotel arrival, tours.<\/li>\n<li>After you’ve spoken to the client, remark <strong>ASCC<\/strong>.<\/li>\n<li>Note what changed, what the client chose and what Flights confirmed, and recap to the advisor.<\/li>\n<\/ol>", "escalate": "Flights has no reasonable option and the change breaks the trip, such as a missed hotel night or tour.", "complete": "The client accepted (and Flights exchanged the tickets if it was major) or declined (and the flight is cancelled with the refund under way), land is adjusted, ASCC is remarked, and the advisor has the recap.", "text": "Call Flights first. Never accept or reject a change for the client, and never promise a full refund until Flights confirms the ticket qualifies. The airline changed a flight before departure, Flights emailed you a change, or the advisor is calling about a schedule change notice. Step 1: Is it a major change? It’s major if any of these are true: The flight moved more than 4 hours earlier or later A connection was added A connection now misconnects It moved to a different day or now needs an overnight The flight or route was cancelled Anything else is minor . Airlines set their own rules, so when it’s close, Flights decides. Step 2: Should you look for better flights? How much did it move? What to do Under 30 minutes Usually just acknowledge it. Check it doesn’t break a connection or transfer. 30–59 minutes Check connections, late arrivals and transfer times. If it causes a real problem, call Flights for options. 60 minutes or more Call Flights for alternatives, even if it’s minor. Step 3: What to do If Then Flights emails you a major change Check the option Flights sent is reasonable before you contact the client. If it isn’t, ask Flights for more options first. The advisor calls about a change notice Call Flights to find out what changed and what the options are. The change is minor Plex usually accepts it automatically and the advisor gets a notice. When the advisor calls, still get their verbal OK , tell Flights by phone, and remark it. No ticket exchange. The client doesn’t like the option Find out what they need, then ask Flights for more options. The client accepts a major change Confirm the acceptance with Flights by phone . Then email SJC Last Minute Ticket Request , sjcticketrequest@classicvacations.com, asking Flights to exchange the tickets, with the new itinerary. The client wants to reject a major change Call Flights to confirm the ticket qualifies for cancellation and a full refund under the airline’s rules. Only then tell the client. If it qualifies, the flight is cancelled and refunded, and any new flights are booked at today’s fares on any airline. The client rejects a minor change Ask Flights about other options. A full refund isn’t available for minor changes. Then, every time Fix anything the new times affect: transfer pickups, a late hotel arrival, tours. After you’ve spoken to the client, remark ASCC . Note what changed, what the client chose and what Flights confirmed, and recap to the advisor. Flights has no reasonable option and the change breaks the trip, such as a missed hotel night or tour. The client accepted (and Flights exchanged the tickets if it was major) or declined (and the flight is cancelled with the refund under way), land is adjusted, ASCC is remarked, and the advisor has the recap."}, {"id": "air-req", "kind": "proc", "stage": "pre", "title": "Seats, frequent flyer, KTN, meals and name changes", "aliases": ["seat", "frequent flyer", "ktn", "known traveler", "tsa precheck", "global entry", "nexus", "sentri", "meal", "name change", "spcreq", "flight special request", "birthdate", "misspelled name"], "updated": null, "rule": "A request isn’t done when it’s emailed. It’s done when the airline or Flights confirms it.", "use": "The advisor wants a seat, frequent-flyer number, known traveler number, birthdate or meal added, or a name corrected.", "body": "<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>If<\/th>\n<th>Then<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>It can be done on the airline’s website (seats and frequent-flyer numbers usually can)<\/td>\n<td>Have the advisor or traveler do it there.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Frequent flyer, TSA PreCheck, Global Entry, NEXUS, SENTRI, KTN, birthdate or meal, and it isn’t urgent<\/td>\n<td>Email <strong>SJC-FlightSpecialRequest<\/strong>, spcreq@classicvacations.com.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>It’s a <strong>name change<\/strong><\/td>\n<td><strong>Call Flights.<\/strong> Name changes are never emailed.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Note what was requested, and close it only when the airline or Flights confirms.<\/p>", "escalate": "", "complete": "The airline or Flights confirmed it and the advisor knows.", "text": "A request isn’t done when it’s emailed. It’s done when the airline or Flights confirms it. The advisor wants a seat, frequent-flyer number, known traveler number, birthdate or meal added, or a name corrected. If Then It can be done on the airline’s website (seats and frequent-flyer numbers usually can) Have the advisor or traveler do it there. Frequent flyer, TSA PreCheck, Global Entry, NEXUS, SENTRI, KTN, birthdate or meal, and it isn’t urgent Email SJC-FlightSpecialRequest , spcreq@classicvacations.com. It’s a name change Call Flights. Name changes are never emailed. Note what was requested, and close it only when the airline or Flights confirms. The airline or Flights confirmed it and the advisor knows."}, {"id": "air-e", "kind": "proc", "stage": "in", "title": "Flight cancelled, delayed or connection missed while traveling", "aliases": ["cancelled flight", "canceled flight", "missed connection", "delay", "delayed", "stranded", "after hours", "on-call", "on call", "patrick", "vu", "kris", "flights closed", "weekend", "airport", "reprotection", "re-protection", "involuntary", "afyk", "holiday"], "updated": "Updated Oct 28", "rule": "Keep the traveler moving first. The live airline record is the truth, even when Plex disagrees.", "use": "The traveler is already on the trip and a flight is cancelled, delayed or missed, or they need to change a flight.", "body": "<h4 id=\"stabilize-the-traveler\">Stabilize the traveler<\/h4>\n<ol type=\"1\">\n<li>Find out where the traveler is, a good phone number, whether they’re safe, and when their next flight or service is.<\/li>\n<li>Open the live airline record with the PNR. Don’t rely on Plex.<\/li>\n<li>Decide: did the airline cause this (cancellation, delay, weather, missed connection), or does the traveler want a change?<\/li>\n<li>Check whether the airline already rebooked them, and whether that flight works.<\/li>\n<\/ol>\n<h4 id=\"get-the-air-fixed\">Get the air fixed<\/h4>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>If<\/th>\n<th>Then<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>The airline caused it<\/td>\n<td>Start with the <strong>airline or airport counter<\/strong>. They can rebook in ways we can’t.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Voluntary change or new ticket, Flights queue <strong>open<\/strong><\/td>\n<td>Call <strong>Flights<\/strong>. For published fares, the airline can be faster.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Queue <strong>closed<\/strong>, <strong>published<\/strong> fare<\/td>\n<td>Contact the <strong>airline<\/strong>. If the agent can’t help, ask for a supervisor.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Queue <strong>closed<\/strong>, <strong>negotiated or bulk<\/strong> fare<\/td>\n<td>Call the <strong>Flights on-call<\/strong> contacts below.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>The only option is another airline<\/td>\n<td>It’s a <strong>new ticket purchase<\/strong>. Get the advisor’s approval of the cost first.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ol start=\"5\" type=\"1\">\n<li>Before you call, have ready: PNR, the request, preferred flights, ticketed or not, fare type, whether they’re checked in, and the most they’ll pay. If they’re checked in, they may need to check out before an exchange. Only tell them to once the airline or Flights says so.<\/li>\n<\/ol>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Flights queue<\/th>\n<th>Hours (Pacific)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Monday–Friday<\/td>\n<td>6:00 a.m.–6:00 p.m.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Saturday<\/td>\n<td>6:00 a.m.–2:30 p.m.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Sunday<\/td>\n<td>Closed<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>When the queue is closed, call in this order.<\/strong> Phone numbers, emails and the holiday roster are on the <a href=\"https://classicvac.sharepoint.com/sites/Flights/\">Flights SharePoint site<\/a>.<\/p>\n<ul>\n<li><strong>Weekdays, outside queue hours:<\/strong> Patrick, then Vu, then Kris.<\/li>\n<li><strong>Weekends, 6:00 a.m.–6:00 p.m.:<\/strong> Patrick, then Vu, then Kris.<\/li>\n<li><strong>Weekends, 6:00 p.m.–6:00 a.m.:<\/strong> Vu, then Patrick, then Kris.<\/li>\n<li><strong>Holidays:<\/strong> coverage may vary. Check the holiday schedule on the Flights site.<\/li>\n<li><strong>No one answers:<\/strong> email all three with the PNR, booking number, the request, where the traveler is, and any limits (budget, preferred times).<\/li>\n<\/ul>\n<h4 id=\"protect-the-rest-of-the-trip\">Protect the rest of the trip<\/h4>\n<ol start=\"6\" type=\"1\">\n<li>Contact every affected vendor with the new flight: hotel (late arrival or no-show), transfers, tours, car.<\/li>\n<li><strong>Groups:<\/strong> a missed first night may still be charged under the group contract. Ask for a waiver, but don’t promise one.<\/li>\n<li>If the new flight doesn’t show in Plex, note the live airline itinerary on the booking and tell the advisor to use the airline record.<\/li>\n<li>Remark <strong>AFYK<\/strong>. In Zendesk, note the airline record, each vendor you contacted, any cost still pending, and the next update time.<\/li>\n<\/ol>", "escalate": "The traveler is stranded or unsafe, or a cost Classic would pay is beyond your authority. Call leadership now and keep working the recovery.", "complete": "The traveler has a confirmed flight (or an owned backup plan), every affected hotel, transfer, tour and car is fixed, and the advisor knows the next update time.", "text": "Keep the traveler moving first. The live airline record is the truth, even when Plex disagrees. The traveler is already on the trip and a flight is cancelled, delayed or missed, or they need to change a flight. Stabilize the traveler Find out where the traveler is, a good phone number, whether they’re safe, and when their next flight or service is. Open the live airline record with the PNR. Don’t rely on Plex. Decide: did the airline cause this (cancellation, delay, weather, missed connection), or does the traveler want a change? Check whether the airline already rebooked them, and whether that flight works. Get the air fixed If Then The airline caused it Start with the airline or airport counter . They can rebook in ways we can’t. Voluntary change or new ticket, Flights queue open Call Flights . For published fares, the airline can be faster. Queue closed , published fare Contact the airline . If the agent can’t help, ask for a supervisor. Queue closed , negotiated or bulk fare Call the Flights on-call contacts below. The only option is another airline It’s a new ticket purchase . Get the advisor’s approval of the cost first. Before you call, have ready: PNR, the request, preferred flights, ticketed or not, fare type, whether they’re checked in, and the most they’ll pay. If they’re checked in, they may need to check out before an exchange. Only tell them to once the airline or Flights says so. Flights queue Hours (Pacific) Monday–Friday 6:00 a.m.–6:00 p.m. Saturday 6:00 a.m.–2:30 p.m. Sunday Closed When the queue is closed, call in this order. Phone numbers, emails and the holiday roster are on the Flights SharePoint site . Weekdays, outside queue hours: Patrick, then Vu, then Kris. Weekends, 6:00 a.m.–6:00 p.m.: Patrick, then Vu, then Kris. Weekends, 6:00 p.m.–6:00 a.m.: Vu, then Patrick, then Kris. Holidays: coverage may vary. Check the holiday schedule on the Flights site. No one answers: email all three with the PNR, booking number, the request, where the traveler is, and any limits (budget, preferred times). Protect the rest of the trip Contact every affected vendor with the new flight: hotel (late arrival or no-show), transfers, tours, car. Groups: a missed first night may still be charged under the group contract. Ask for a waiver, but don’t promise one. If the new flight doesn’t show in Plex, note the live airline itinerary on the booking and tell the advisor to use the airline record. Remark AFYK . In Zendesk, note the airline record, each vendor you contacted, any cost still pending, and the next update time. The traveler is stranded or unsafe, or a cost Classic would pay is beyond your authority. Call leadership now and keep working the recovery. The traveler has a confirmed flight (or an owned backup plan), every affected hotel, transfer, tour and car is fixed, and the advisor knows the next update time."}, {"id": "air-f", "kind": "proc", "stage": "post", "title": "Unused flight after the trip", "aliases": ["unused segment", "unused ticket", "did not fly", "didn’t fly", "no show flight", "airline refund", "unused flight", "tripmate", "post travel concern"], "updated": null, "rule": "Never promise money back for an unused flight. The airline decides first.", "use": "The trip is over and the traveler didn’t use one or more flights.", "body": "<ol type=\"1\">\n<li>Confirm the trip is finished.<\/li>\n<li>Note the ticket numbers, PNR, which segments weren’t used, and why.<\/li>\n<li>Check Plex and Zendesk for an existing Post-Travel case. If there is one, send new information to that specialist.<\/li>\n<li>If the advisor only wants ticket details or a refund status, answer from what’s verified.<\/li>\n<li>If it needs an airline refund investigation, give the advisor the <strong>Post Travel Concern<\/strong> form: https://app.smartsheet.com/b/form/219a2f5e09bf46cd811b53a5bc5ad7b1<\/li>\n<li>The specialist asks the airline for a refund first.<\/li>\n<li>If the airline says no and the traveler has protection, refer the claim to <strong>TripMate<\/strong>, 1-844-207-1929. Don’t promise the result.<\/li>\n<li>Note the airline decision, any claim referral, and who owns it now.<\/li>\n<\/ol>", "escalate": "", "complete": "The airline decision is recorded, or a specialist has accepted the investigation and the advisor knows who’s handling it.", "text": "Never promise money back for an unused flight. The airline decides first. The trip is over and the traveler didn’t use one or more flights. Confirm the trip is finished. Note the ticket numbers, PNR, which segments weren’t used, and why. Check Plex and Zendesk for an existing Post-Travel case. If there is one, send new information to that specialist. If the advisor only wants ticket details or a refund status, answer from what’s verified. If it needs an airline refund investigation, give the advisor the Post Travel Concern form: https://app.smartsheet.com/b/form/219a2f5e09bf46cd811b53a5bc5ad7b1 The specialist asks the airline for a refund first. If the airline says no and the traveler has protection, refer the claim to TripMate , 1-844-207-1929. Don’t promise the result. Note the airline decision, any claim referral, and who owns it now. The airline decision is recorded, or a specialist has accepted the investigation and the advisor knows who’s handling it."}]}, {"id": "hotels", "group": "Products", "title": "Hotels", "sub": "Confirmations, moves, complaints, amenities and charges", "compare": "<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><\/th>\n<th>Pre-Travel<\/th>\n<th>In-Travel<\/th>\n<th>Post-Travel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>First move<\/td>\n<td>Check the confirmation and protect confirmed space<\/td>\n<td>Make sure the traveler has a safe room tonight<\/td>\n<td>Check what the hotel promised and what happened<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>What you can promise<\/td>\n<td>Only what the supplier confirmed<\/td>\n<td>Supplier-approved fixes or refunds; goodwill within your limit<\/td>\n<td>Nothing new; the specialist handles extended complaints<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Who to involve<\/td>\n<td>The hotel or supplier<\/td>\n<td>The property and reservation source; Finance for VCC<\/td>\n<td>Post-Travel specialist<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "items": [{"id": "hotel-conf", "kind": "proc", "stage": "pre", "title": "Add or confirm a hotel confirmation number", "aliases": ["confirmation number", "hotel confirmation", "reconfirm", "direct connect", "allotment", "green availability"], "updated": null, "rule": "", "use": "The advisor needs a hotel confirmation number, or one has come back from the supplier.", "body": "<ol type=\"1\">\n<li>Open the booking and the hotel component.<\/li>\n<li>Check whether a confirmation number is already stored.<\/li>\n<li>When the hotel or supplier returns one, enter it in the hotel confirmation field.<\/li>\n<li>Note the update.<\/li>\n<li>If the advisor asked, send them the confirmed status and number.<\/li>\n<\/ol>\n<p>Green, direct-connect availability is already confirmed inventory. A manual or contract request isn’t confirmed until the supplier says so. Never change a pending request to confirmed without that.<\/p>", "escalate": "Travel is close and the supplier hasn’t confirmed through the normal path. See <a class=\"xref\" href=\"#pending-follow\">Follow up on a pending request<\/a>.", "complete": "The number is on the hotel component, noted, and the advisor has it if they asked.", "text": "The advisor needs a hotel confirmation number, or one has come back from the supplier. Open the booking and the hotel component. Check whether a confirmation number is already stored. When the hotel or supplier returns one, enter it in the hotel confirmation field. Note the update. If the advisor asked, send them the confirmed status and number. Green, direct-connect availability is already confirmed inventory. A manual or contract request isn’t confirmed until the supplier says so. Never change a pending request to confirmed without that. Travel is close and the supplier hasn’t confirmed through the normal path. See Follow up on a pending request . The number is on the hotel component, noted, and the advisor has it if they asked."}, {"id": "hotel-move", "kind": "proc", "stage": "in", "title": "Traveler wants to leave or change hotels", "aliases": ["leave hotel", "change hotel", "move hotel", "relocate", "early departure", "hotel unhappy", "switch hotel", "checkout early"], "updated": null, "rule": "Don’t cancel the original hotel or promise a refund until you know the penalty, the hotel’s position, TSP, the replacement and the cost to the traveler.", "use": "The traveler wants to leave early, move, or shorten the stay.", "body": "<ol type=\"1\">\n<li>Read the confirmation, room type, requests, penalty terms, TSP and recent notes.<\/li>\n<li>Find out why: a service failure, a safety or health issue, or a preference. Ask what the hotel has already offered.<\/li>\n<li>Contact the hotel. Try to fix it in-house first.<\/li>\n<li>Ask the hotel for its exact position on unused nights and any waiver or refund.<\/li>\n<li>If they need to move, secure the new hotel <strong>before<\/strong> you release the original, when possible.<\/li>\n<li>Explain any penalty or new cost and get approval.<\/li>\n<li>Update transfers, tours, car or air if the move changes the logistics.<\/li>\n<li>Process any approved adjustment or refund (<a class=\"xref\" href=\"#refunds-b\">Supplier approves a refund during the trip<\/a>), and the commission impact.<\/li>\n<\/ol>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>If<\/th>\n<th>Then<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>There’s a safety or health concern<\/td>\n<td>Move the traveler to safety first and involve leadership.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>The hotel can fix it while they’re there<\/td>\n<td>Give the hotel the chance.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>No TSP and the hotel won’t waive<\/td>\n<td>The traveler may owe for both hotels. Say so before they move.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>TSP is on the booking<\/td>\n<td>Check the plan. Still ask the hotel for a waiver. Don’t promise insurance money.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "escalate": "The traveler’s safety is at risk, the replacement cost is beyond your authority, a Preferred hotel refuses a reasonable fix, or it’s a high-value case that needs a manager.", "complete": "The traveler has a safe, confirmed room, the original hotel is settled, connected services are updated, money is handled, and everyone is told.", "text": "Don’t cancel the original hotel or promise a refund until you know the penalty, the hotel’s position, TSP, the replacement and the cost to the traveler. The traveler wants to leave early, move, or shorten the stay. Read the confirmation, room type, requests, penalty terms, TSP and recent notes. Find out why: a service failure, a safety or health issue, or a preference. Ask what the hotel has already offered. Contact the hotel. Try to fix it in-house first. Ask the hotel for its exact position on unused nights and any waiver or refund. If they need to move, secure the new hotel before you release the original, when possible. Explain any penalty or new cost and get approval. Update transfers, tours, car or air if the move changes the logistics. Process any approved adjustment or refund ( Supplier approves a refund during the trip ), and the commission impact. If Then There’s a safety or health concern Move the traveler to safety first and involve leadership. The hotel can fix it while they’re there Give the hotel the chance. No TSP and the hotel won’t waive The traveler may owe for both hotels. Say so before they move. TSP is on the booking Check the plan. Still ask the hotel for a waiver. Don’t promise insurance money. The traveler’s safety is at risk, the replacement cost is beyond your authority, a Preferred hotel refuses a reasonable fix, or it’s a high-value case that needs a manager. The traveler has a safe, confirmed room, the original hotel is settled, connected services are updated, money is handled, and everyone is told."}, {"id": "hotel-complaint", "kind": "proc", "stage": "in post", "title": "Hotel problem or complaint", "aliases": ["hotel complaint", "dirty room", "construction", "renovation", "noise", "service failure", "room condition", "hotel problem"], "updated": null, "rule": "Fix the problem first. Compensation comes second. Work the hotel while the traveler is still there.", "use": "Room condition, cleanliness, construction, a broken amenity, service, or any other hotel issue.", "body": "<ol type=\"1\">\n<li>Read the notes. Separate facts from assumptions, and check what was promised at booking.<\/li>\n<li>Contact hotel management, not just the front desk, if it needs escalating.<\/li>\n<li>Ask what they can do now: a room move, maintenance, housekeeping, restoring an amenity, a credit, a meal.<\/li>\n<li>If what they offer isn’t enough, work out the next-best option and whether leadership or Product needs to be involved.<\/li>\n<li>Note the facts, what the hotel confirmed, what was done, any compensation offered, and the traveler’s response.<\/li>\n<\/ol>\n<p>After travel and it’ll take more than 24 hours? Use <a class=\"xref\" href=\"#post-handoff\">Hand off to Post-Travel<\/a>.<\/p>", "escalate": "A Preferred hotel doesn’t respond within 72 hours or offers less than Classic’s standard, or the traveler needs leadership sooner.", "complete": "The traveler has a workable fix and any compensation or adjustment is noted.", "text": "Fix the problem first. Compensation comes second. Work the hotel while the traveler is still there. Room condition, cleanliness, construction, a broken amenity, service, or any other hotel issue. Read the notes. Separate facts from assumptions, and check what was promised at booking. Contact hotel management, not just the front desk, if it needs escalating. Ask what they can do now: a room move, maintenance, housekeeping, restoring an amenity, a credit, a meal. If what they offer isn’t enough, work out the next-best option and whether leadership or Product needs to be involved. Note the facts, what the hotel confirmed, what was done, any compensation offered, and the traveler’s response. After travel and it’ll take more than 24 hours? Use Hand off to Post-Travel . A Preferred hotel doesn’t respond within 72 hours or offers less than Classic’s standard, or the traveler needs leadership sooner. The traveler has a workable fix and any compensation or adjustment is noted."}, {"id": "hotel-amenity", "kind": "proc", "stage": "in post", "title": "Consortia or Preferred amenity not received", "aliases": ["amenity", "consortium", "virtuoso", "preferred amenity", "missing amenity", "benefit not received", "resort credit", "breakfast not included"], "updated": null, "rule": "Being in a consortium doesn’t prove this booking qualifies. Check before you treat it as a hotel failure, and don’t promise compensation because someone believes it should have been included.", "use": "The advisor or traveler says a consortium or Preferred amenity wasn’t provided.", "body": "<ol type=\"1\">\n<li>Confirm the agency’s consortium details.<\/li>\n<li>Confirm the hotel takes part in that program.<\/li>\n<li>Confirm the booked rate and room category qualify.<\/li>\n<li>Check the booking documents for the specific amenity.<\/li>\n<li>If eligibility or delivery is still unclear, contact the hotel.<\/li>\n<\/ol>", "escalate": "The booking qualifies and the hotel refuses, or a Preferred hotel doesn’t respond within 72 hours. See <a class=\"xref\" href=\"#esc-supplier\">Supplier won’t resolve it<\/a>.", "complete": "Eligibility is checked, the hotel has confirmed what it will provide, the traveler or advisor knows, and it’s noted.", "text": "Being in a consortium doesn’t prove this booking qualifies. Check before you treat it as a hotel failure, and don’t promise compensation because someone believes it should have been included. The advisor or traveler says a consortium or Preferred amenity wasn’t provided. Confirm the agency’s consortium details. Confirm the hotel takes part in that program. Confirm the booked rate and room category qualify. Check the booking documents for the specific amenity. If eligibility or delivery is still unclear, contact the hotel. The booking qualifies and the hotel refuses, or a Preferred hotel doesn’t respond within 72 hours. See Supplier won’t resolve it . Eligibility is checked, the hotel has confirmed what it will provide, the traveler or advisor knows, and it’s noted."}, {"id": "hotel-extraperson", "kind": "proc", "stage": "in post", "title": "Hotel charged an extra-person fee", "aliases": ["extra person", "extra-person", "additional person", "occupancy charge", "third person", "child charge", "hotel charged more"], "updated": null, "rule": "An extra-person charge isn’t automatically an error. Some rates are priced for two people and the hotel collects the rest directly.", "use": "The traveler questions an extra-person charge from the hotel.", "body": "<ol type=\"1\">\n<li>Check the booking instructions and room occupancy.<\/li>\n<li>Confirm what was included in the Classic price.<\/li>\n<li>Check whether the rate requires extra-person fees to be paid at the hotel.<\/li>\n<li>If the hotel’s charge doesn’t match the booking terms, contact the hotel.<\/li>\n<\/ol>", "escalate": "The charge doesn’t match the booked terms and the hotel won’t reverse it.", "complete": "The charge is checked against the terms; if it’s wrong, the reversal or Finance follow-up has an owner; the traveler or advisor knows; it’s noted.", "text": "An extra-person charge isn’t automatically an error. Some rates are priced for two people and the hotel collects the rest directly. The traveler questions an extra-person charge from the hotel. Check the booking instructions and room occupancy. Confirm what was included in the Classic price. Check whether the rate requires extra-person fees to be paid at the hotel. If the hotel’s charge doesn’t match the booking terms, contact the hotel. The charge doesn’t match the booked terms and the hotel won’t reverse it. The charge is checked against the terms; if it’s wrong, the reversal or Finance follow-up has an owner; the traveler or advisor knows; it’s noted."}, {"id": "hotel-direct-charge", "kind": "shared", "stage": "in", "title": "Hotel charged the traveler for a prepaid stay", "aliases": ["hotel charged traveler", "charged card", "double charged hotel", "prepaid hotel charge"], "updated": null, "rule": "", "use": "", "body": "<p>It’s urgent: the traveler’s card is involved. Follow <a class=\"xref\" href=\"#pay-hotel-direct\">Hotel charged the traveler for a prepaid stay<\/a>.<\/p>", "escalate": "", "complete": "", "text": "It’s urgent: the traveler’s card is involved. Follow Hotel charged the traveler for a prepaid stay ."}]}, {"id": "ground", "group": "Products", "title": "Transfers, rail and ferries", "sub": "Pickups, stations, ferries and missed transfers", "compare": "<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><\/th>\n<th>Pre-Travel<\/th>\n<th>In-Travel<\/th>\n<th>Post-Travel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>First move<\/td>\n<td>Confirm every pickup detail and station<\/td>\n<td>Find the traveler and the driver; get them moving<\/td>\n<td>Check what was actually provided and any no-show charge<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>What you can promise<\/td>\n<td>What the supplier confirms<\/td>\n<td>Alternate transport you’re authorized to arrange<\/td>\n<td>Nothing until the supplier or Finance approves<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "items": [{"id": "ground-review", "kind": "proc", "stage": "pre", "title": "Review a transfer", "aliases": ["transfer", "pickup", "airport transfer", "rail", "train station", "ferry", "public ferry", "cell", "trsf", "mobile number", "meet and greet", "transfer on own"], "updated": null, "rule": "", "use": "You’re checking or setting up a transfer before travel.", "body": "<ol type=\"1\">\n<li>Direction: arrival, between hotels, or departure.<\/li>\n<li>Service date.<\/li>\n<li>Airport, port or rail station, and the hotel or zone.<\/li>\n<li>Number of travelers, and whether the vehicle fits them and their bags.<\/li>\n<li>The flight, train or ship details the operator needs.<\/li>\n<li>The traveler’s mobile number, where required. Remark <strong>CELL<\/strong> once you have it.<\/li>\n<li>Pickup time and meeting instructions.<\/li>\n<li>No missing or duplicate ground components.<\/li>\n<li>If the traveler is arranging their own transport, note it where QA looks for it.<\/li>\n<\/ol>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>If<\/th>\n<th>Then<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Hotel or flight dates changed<\/td>\n<td>Change the arrival <strong>and<\/strong> departure transfers to match.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>It’s a rail transfer<\/td>\n<td>Ask which station. Many cities have more than one.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>It’s a public ferry Classic doesn’t sell<\/td>\n<td>Don’t present it as part of the private transfer. Book transfers to and from the ferry point and set expectations.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>There are no rail or ferry remark codes. Remark <strong>TRSF<\/strong> for transfer work and describe the details clearly.<\/p>", "escalate": "Details the operator needs (flight details, mobile number) can’t be obtained before the service date.", "complete": "Every detail is verified, or transport-on-own is noted, with no missing or duplicate ground components.", "text": "You’re checking or setting up a transfer before travel. Direction: arrival, between hotels, or departure. Service date. Airport, port or rail station, and the hotel or zone. Number of travelers, and whether the vehicle fits them and their bags. The flight, train or ship details the operator needs. The traveler’s mobile number, where required. Remark CELL once you have it. Pickup time and meeting instructions. No missing or duplicate ground components. If the traveler is arranging their own transport, note it where QA looks for it. If Then Hotel or flight dates changed Change the arrival and departure transfers to match. It’s a rail transfer Ask which station. Many cities have more than one. It’s a public ferry Classic doesn’t sell Don’t present it as part of the private transfer. Book transfers to and from the ferry point and set expectations. There are no rail or ferry remark codes. Remark TRSF for transfer work and describe the details clearly. Details the operator needs (flight details, mobile number) can’t be obtained before the service date. Every detail is verified, or transport-on-own is noted, with no missing or duplicate ground components."}, {"id": "ground-missed", "kind": "proc", "stage": "in", "title": "Missed pickup or transfer problem", "aliases": ["missed pickup", "no driver", "driver no show", "transfer late", "stranded at airport", "taxi", "transfer failed"], "updated": null, "rule": "Get the traveler moving first. Investigate before you refund or escalate.", "use": "The driver didn’t show, the pickup was missed or late, or the time was wrong.", "body": "<ol type=\"1\">\n<li>Check the transfer confirmation, flight details, emergency contact instructions and notes.<\/li>\n<li>Is the traveler still waiting, already in a taxi, or did they miss the service?<\/li>\n<li>Call the transfer vendor or its emergency line.<\/li>\n<li>Check the driver was dispatched, the meeting point, how long they waited, any flight delay, and any attempts to reach the traveler.<\/li>\n<li>Arrange alternate transport now if it’s needed and you’re authorized.<\/li>\n<li>Once the traveler is moving, work out who pays: supplier refund or penalty.<\/li>\n<li>Update any later pickups if the flight or hotel changed.<\/li>\n<\/ol>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>If<\/th>\n<th>Then<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>The flight changed<\/td>\n<td>Reconfirm the transfer against the new flight. Don’t assume the vendor knows.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>The traveler took a taxi<\/td>\n<td>Ask them to keep receipts. Don’t promise reimbursement until it’s approved.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>No driver details were sent<\/td>\n<td>That’s normal in some destinations. It isn’t proof of a failure by itself.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "escalate": "The traveler is stranded, the vendor can’t be reached, the replacement costs real money, or the same supplier keeps failing.", "complete": "The traveler has transport, later pickups are right, and the refund or supplier issue is resolved or owned.", "text": "Get the traveler moving first. Investigate before you refund or escalate. The driver didn’t show, the pickup was missed or late, or the time was wrong. Check the transfer confirmation, flight details, emergency contact instructions and notes. Is the traveler still waiting, already in a taxi, or did they miss the service? Call the transfer vendor or its emergency line. Check the driver was dispatched, the meeting point, how long they waited, any flight delay, and any attempts to reach the traveler. Arrange alternate transport now if it’s needed and you’re authorized. Once the traveler is moving, work out who pays: supplier refund or penalty. Update any later pickups if the flight or hotel changed. If Then The flight changed Reconfirm the transfer against the new flight. Don’t assume the vendor knows. The traveler took a taxi Ask them to keep receipts. Don’t promise reimbursement until it’s approved. No driver details were sent That’s normal in some destinations. It isn’t proof of a failure by itself. The traveler is stranded, the vendor can’t be reached, the replacement costs real money, or the same supplier keeps failing. The traveler has transport, later pickups are right, and the refund or supplier issue is resolved or owned."}, {"id": "ground-flightchange", "kind": "proc", "stage": "in", "title": "Flight changed, transfer needs updating", "aliases": ["transfer flight change", "new flight transfer", "update pickup", "change pickup time"], "updated": null, "rule": "A flight change always means checking the transfer. It doesn’t update itself.", "use": "An arrival or departure flight changed and a transfer is booked.", "body": "<ol type=\"1\">\n<li>Get the new flight number, date and time.<\/li>\n<li>Send the new flight to the transfer vendor.<\/li>\n<li>Confirm the new pickup time and meeting instructions.<\/li>\n<li>Update the booking notes and tell the traveler and advisor.<\/li>\n<\/ol>", "escalate": "The vendor can’t accommodate the new time and the traveler is already traveling.", "complete": "The new transfer is confirmed and the traveler and advisor have the details.", "text": "A flight change always means checking the transfer. It doesn’t update itself. An arrival or departure flight changed and a transfer is booked. Get the new flight number, date and time. Send the new flight to the transfer vendor. Confirm the new pickup time and meeting instructions. Update the booking notes and tell the traveler and advisor. The vendor can’t accommodate the new time and the traveler is already traveling. The new transfer is confirmed and the traveler and advisor have the details."}]}, {"id": "tours", "group": "Products", "title": "Tours, activities and rental cars", "sub": "Adding tours, timing, waivers, car rules and in-trip changes", "compare": "<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><\/th>\n<th>Pre-Travel<\/th>\n<th>In-Travel<\/th>\n<th>Post-Travel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>First move<\/td>\n<td>Read the booking instructions and quote before committing<\/td>\n<td>Check what’s affected by any other change and what the vendor will do<\/td>\n<td>Check the vendor’s no-show or cancellation outcome<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>What you can promise<\/td>\n<td>What the vendor confirms<\/td>\n<td>A vendor waiver or change once approved<\/td>\n<td>Nothing until the supplier approves<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "items": [{"id": "tours-add", "kind": "proc", "stage": "pre", "title": "Add a contracted tour or activity", "aliases": ["add tour", "tour", "activity", "excursion", "w3", "project expedition", "tour time", "tour remark"], "updated": null, "rule": "Read the instructions, quote before committing, get buy-in, then add it.", "use": "The advisor wants a tour or activity added.", "body": "<ol type=\"1\">\n<li>Search the right destination, date and party size.<\/li>\n<li>Review the vendor, total price, commission, duration, departure time and inclusions.<\/li>\n<li>Read all booking instructions, especially those marked in red.<\/li>\n<li>Select or request the right time if the tour needs one.<\/li>\n<li>On a live booking, quote the price and conditions before the step that commits it.<\/li>\n<li>Get the advisor’s OK and add it.<\/li>\n<li>Check the time and status on the booking.<\/li>\n<li>Note it and recap. Remark <strong>TOUR<\/strong>.<\/li>\n<\/ol>\n<p><strong>Who to use:<\/strong> W3 is the preferred tour operator in Italy and Europe; use private service where it fits. Use Project Expedition when W3 can’t provide it. Project Expedition requests can take about 24–48 hours, and waivers go to the advisor (<a class=\"xref\" href=\"#req-waiver\">Project Expedition waiver<\/a>).<\/p>", "escalate": "The required time can’t be confirmed or the booking instructions can’t be met.", "complete": "The advisor approved, it’s added with the right time and status, and it’s noted and recapped.", "text": "Read the instructions, quote before committing, get buy-in, then add it. The advisor wants a tour or activity added. Search the right destination, date and party size. Review the vendor, total price, commission, duration, departure time and inclusions. Read all booking instructions, especially those marked in red. Select or request the right time if the tour needs one. On a live booking, quote the price and conditions before the step that commits it. Get the advisor’s OK and add it. Check the time and status on the booking. Note it and recap. Remark TOUR . Who to use: W3 is the preferred tour operator in Italy and Europe; use private service where it fits. Use Project Expedition when W3 can’t provide it. Project Expedition requests can take about 24–48 hours, and waivers go to the advisor ( Project Expedition waiver ). The required time can’t be confirmed or the booking instructions can’t be met. The advisor approved, it’s added with the right time and status, and it’s noted and recapped."}, {"id": "tours-car", "kind": "shared", "stage": "pre", "title": "Rental cars", "aliases": ["rental car", "car rental", "debit card", "credit card at pickup", "car insurance", "gps", "car fees"], "updated": null, "rule": "", "use": "", "body": "<ul>\n<li>Check dates, pickup and drop-off locations, and vehicle type.<\/li>\n<li>Check the supplier’s payment and pickup rules. Don’t assume debit cards work; a credit card may be required at pickup.<\/li>\n<li>Insurance, GPS and some local fees may be paid directly at pickup. Use the booking documents to set expectations.<\/li>\n<li>Saying a destination needs a car is itinerary advice, not a rental policy.<\/li>\n<\/ul>", "escalate": "", "complete": "", "text": "Check dates, pickup and drop-off locations, and vehicle type. Check the supplier’s payment and pickup rules. Don’t assume debit cards work; a credit card may be required at pickup. Insurance, GPS and some local fees may be paid directly at pickup. Use the booking documents to set expectations. Saying a destination needs a car is itinerary advice, not a rental policy."}, {"id": "tours-intrip", "kind": "proc", "stage": "in", "title": "Tour or car affected during the trip", "aliases": ["missed tour", "tour cancelled", "car early return", "unused days", "ripple effect", "add tour during trip"], "updated": null, "rule": "Any change to air, hotel or dates means checking every other component. One correct change can still leave a broken trip.", "use": "A tour or rental car is affected by another change, missed, or added while the traveler is traveling.", "body": "<ol type=\"1\">\n<li>Check the cancellation deadline, pickup point, date and time.<\/li>\n<li>Check whether a hotel move or flight change affects it.<\/li>\n<li><strong>Tour missed because something else failed:<\/strong> note what caused what, and ask the vendor for a waiver before promising any refund.<\/li>\n<li><strong>Car returned early:<\/strong> ask the supplier to approve a refund for unused days. An early return doesn’t refund automatically.<\/li>\n<li><strong>Adding something mid-trip:<\/strong> take payment as required, and request the commission payout it creates.<\/li>\n<\/ol>", "escalate": "The vendor won’t waive or refund and the traveler’s loss was caused by another Classic component.", "complete": "Every affected tour or car is updated or settled, and the advisor knows.", "text": "Any change to air, hotel or dates means checking every other component. One correct change can still leave a broken trip. A tour or rental car is affected by another change, missed, or added while the traveler is traveling. Check the cancellation deadline, pickup point, date and time. Check whether a hotel move or flight change affects it. Tour missed because something else failed: note what caused what, and ask the vendor for a waiver before promising any refund. Car returned early: ask the supplier to approve a refund for unused days. An early return doesn’t refund automatically. Adding something mid-trip: take payment as required, and request the commission payout it creates. The vendor won’t waive or refund and the traveler’s loss was caused by another Classic component. Every affected tour or car is updated or settled, and the advisor knows."}]}, {"id": "requests", "group": "Products", "title": "Special requests", "sub": "Bedding, celebrations, connecting rooms, supplier notes and waivers", "compare": "<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><\/th>\n<th>Pre-Travel<\/th>\n<th>In-Travel<\/th>\n<th>Post-Travel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>What to do<\/td>\n<td>Put the exact request on the right component and send it to the supplier<\/td>\n<td>Ask the property what it can fix now<\/td>\n<td>Check what was requested versus confirmed<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>What you can promise<\/td>\n<td>Only what the supplier confirms<\/td>\n<td>A fix the property agrees to; goodwill only within your limit<\/td>\n<td>Nothing new; the specialist handles extended complaints<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "items": [{"id": "req-add", "kind": "proc", "stage": "pre", "title": "Add a special request", "aliases": ["special request", "bedding", "king bed", "connecting room", "adjoining", "honeymoon", "anniversary", "birthday", "celebration", "room location", "high floor", "supplier comment"], "updated": null, "rule": "A request isn’t a guarantee. Never call it confirmed unless the supplier confirms it.", "use": "The advisor wants a preference or note passed to a hotel, tour or other supplier.", "body": "<p><strong>Special requests include:<\/strong> bedding, honeymoon or celebration, connecting or adjoining rooms, room location, arrival details, and tour times or other details a vendor asks for.<\/p>\n<ol type=\"1\">\n<li>Confirm exactly what the advisor wants.<\/li>\n<li>Decide whether it’s a supplier-facing request, a customer-facing note, or both.<\/li>\n<li>Enter it in the comment area of the right component.<\/li>\n<li>If the supplier needs to confirm it, contact them through the usual follow-up path.<\/li>\n<li>After any big change to the booking, check the requests are still right and still on the right component.<\/li>\n<li>Tell the advisor whether it’s <strong>requested<\/strong> or <strong>confirmed<\/strong>.<\/li>\n<\/ol>", "escalate": "The advisor needs it guaranteed and the supplier won’t confirm before travel.", "complete": "It’s on the right component and with the supplier if needed, the advisor knows requested versus confirmed, and follow-up is noted.", "text": "A request isn’t a guarantee. Never call it confirmed unless the supplier confirms it. The advisor wants a preference or note passed to a hotel, tour or other supplier. Special requests include: bedding, honeymoon or celebration, connecting or adjoining rooms, room location, arrival details, and tour times or other details a vendor asks for. Confirm exactly what the advisor wants. Decide whether it’s a supplier-facing request, a customer-facing note, or both. Enter it in the comment area of the right component. If the supplier needs to confirm it, contact them through the usual follow-up path. After any big change to the booking, check the requests are still right and still on the right component. Tell the advisor whether it’s requested or confirmed . The advisor needs it guaranteed and the supplier won’t confirm before travel. It’s on the right component and with the supplier if needed, the advisor knows requested versus confirmed, and follow-up is noted."}, {"id": "req-waiver", "kind": "proc", "stage": "pre", "title": "Project Expedition waiver", "aliases": ["waiver", "project expedition", "tour waiver", "signed waiver", "liability waiver"], "updated": null, "rule": "", "use": "A tour vendor (Project Expedition) sends a waiver the traveler has to sign.", "body": "<ol type=\"1\">\n<li>Find the booking from the tour ID or booking number in the vendor’s message.<\/li>\n<li>Send the waiver to the advisor in a Zendesk side conversation.<\/li>\n<li>Remark the booking that the waiver was sent.<\/li>\n<li>Keep the ticket pending until the signed waiver comes back.<\/li>\n<\/ol>", "escalate": "Travel is close and the signed waiver hasn’t come back.", "complete": "The advisor has the waiver, the booking is remarked, and the ticket stays pending until it’s signed and returned.", "text": "A tour vendor (Project Expedition) sends a waiver the traveler has to sign. Find the booking from the tour ID or booking number in the vendor’s message. Send the waiver to the advisor in a Zendesk side conversation. Remark the booking that the waiver was sent. Keep the ticket pending until the signed waiver comes back. Travel is close and the signed waiver hasn’t come back. The advisor has the waiver, the booking is remarked, and the ticket stays pending until it’s signed and returned."}, {"id": "req-notdone", "kind": "proc", "stage": "in", "title": "A request wasn’t honored", "aliases": ["wrong bed", "bedding not honored", "two beds", "no connecting room", "request not honored", "view", "floor"], "updated": null, "rule": "A request that wasn’t guaranteed isn’t automatically a failure. Still try to make it better.", "use": "Bedding, connecting rooms, floor, view or a similar request wasn’t provided.", "body": "<ol type=\"1\">\n<li>Check whether it was <strong>guaranteed<\/strong> or only <strong>requested<\/strong>. Read the supplier comments and booking documents.<\/li>\n<li>Check the room category actually supports what was asked for.<\/li>\n<li>Contact the property and ask what it can do now, such as a room move or a different setup.<\/li>\n<li>If the documents only showed a request, explain that clearly to the traveler.<\/li>\n<li>Treat unusual impact separately, for example young children separated from their parents.<\/li>\n<li>Note what was requested or guaranteed, the property’s response, the options and the traveler’s decision.<\/li>\n<\/ol>\n<p><strong>Groups:<\/strong> the bedding shown in Groups Manager is the request on file, not a guarantee.<\/p>", "escalate": "It creates a safety concern, or no reasonable fix is available.", "complete": "The property fixed it, or the traveler has the verified options and knows what to expect.", "text": "A request that wasn’t guaranteed isn’t automatically a failure. Still try to make it better. Bedding, connecting rooms, floor, view or a similar request wasn’t provided. Check whether it was guaranteed or only requested . Read the supplier comments and booking documents. Check the room category actually supports what was asked for. Contact the property and ask what it can do now, such as a room move or a different setup. If the documents only showed a request, explain that clearly to the traveler. Treat unusual impact separately, for example young children separated from their parents. Note what was requested or guaranteed, the property’s response, the options and the traveler’s decision. Groups: the bedding shown in Groups Manager is the request on file, not a guarantee. It creates a safety concern, or no reasonable fix is available. The property fixed it, or the traveler has the verified options and knows what to expect."}]}, {"id": "groups", "group": "Products", "title": "Groups", "sub": "Groups Manager: find the room, service it, take payment, documents and notes", "compare": "<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><\/th>\n<th>Pre-Travel<\/th>\n<th>In-Travel<\/th>\n<th>Post-Travel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Who owns it<\/td>\n<td>The Groups Coordinator (GC)<\/td>\n<td>L2 for the live issue, with the GC and the hotel<\/td>\n<td>Groups and Finance; specialist for extended complaints<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>What controls<\/td>\n<td>The group contract<\/td>\n<td>The group contract (a missed first night may still be charged)<\/td>\n<td>The group contract; commission settles after travel<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Your limits<\/td>\n<td>No agency fees; no FIT workflows<\/td>\n<td>FTC up to $250; goodwill within your limit<\/td>\n<td>Same<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "items": [{"id": "grp-rules", "kind": "shared", "stage": "all", "title": "Group rules", "aliases": ["group", "groups", "group contract", "groups coordinator", "gc", "agent email", "agent login", "group id", "destination wedding", "group tsp"], "updated": null, "rule": "The group contract controls. Never apply FIT assumptions to group penalties, no-shows, changes or TSP.", "use": "", "body": "<ul>\n<li><strong>The group contract controls<\/strong>, not FIT rules. Groups can go into penalty much earlier.<\/li>\n<li><strong>One Group ID holds many bookings.<\/strong> 63498 is the group; <strong>63498-10<\/strong> is room 10. Always identify the specific room before you troubleshoot.<\/li>\n<li>The <strong>Groups Coordinator (GC)<\/strong> owns the group: building it, advisor communication, changes and pre-travel servicing. Some large agencies have a Classic Groups team instead.<\/li>\n<li><strong>Agent Email<\/strong> is the advisor’s real contact email. <strong>Agent Login ID<\/strong> is for the group website. Don’t mix them up.<\/li>\n<li><strong>DBL, TPL, QUAD<\/strong> mean how many people, not beds. <strong>Bedding<\/strong> in Groups Manager is the request on file, not a guarantee.<\/li>\n<li>Group TSP is more restrictive and mostly insurance. Refer claims to TripMate.<\/li>\n<li>If core group information is missing or wrong, involve Groups management. The Groups team loads it.<\/li>\n<\/ul>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>L2 does<\/th>\n<th>L2 doesn’t (Groups does)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Find groups and rooms, research travelers, review components, warnings and history<\/td>\n<td>Create or contract the group<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Add notes, review contracted pricing, calculate approved adjustments<\/td>\n<td>Manage contracted inventory or concessions<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Take approved payments, review payments, process approved refunds<\/td>\n<td>Group accounting or allocating group funds<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Pull rooming lists, review and resend documents<\/td>\n<td>Pre-travel group servicing, or deciding penalties from Groups Manager alone<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "escalate": "", "complete": "", "text": "The group contract controls. Never apply FIT assumptions to group penalties, no-shows, changes or TSP. The group contract controls , not FIT rules. Groups can go into penalty much earlier. One Group ID holds many bookings. 63498 is the group; 63498-10 is room 10. Always identify the specific room before you troubleshoot. The Groups Coordinator (GC) owns the group: building it, advisor communication, changes and pre-travel servicing. Some large agencies have a Classic Groups team instead. Agent Email is the advisor’s real contact email. Agent Login ID is for the group website. Don’t mix them up. DBL, TPL, QUAD mean how many people, not beds. Bedding in Groups Manager is the request on file, not a guarantee. Group TSP is more restrictive and mostly insurance. Refer claims to TripMate. If core group information is missing or wrong, involve Groups management. The Groups team loads it. L2 does L2 doesn’t (Groups does) Find groups and rooms, research travelers, review components, warnings and history Create or contract the group Add notes, review contracted pricing, calculate approved adjustments Manage contracted inventory or concessions Take approved payments, review payments, process approved refunds Group accounting or allocating group funds Pull rooming lists, review and resend documents Pre-travel group servicing, or deciding penalties from Groups Manager alone"}, {"id": "grp-find", "kind": "proc", "stage": "all", "title": "Find a group and the right room", "aliases": ["find group", "search group", "search by pax name", "view group", "room list", "refresh", "group booking number", "crossed out", "warnings"], "updated": null, "rule": "", "use": "A group traveler or advisor calls and you need to find their booking.", "body": "<ol type=\"1\">\n<li><strong>Know the Group ID?<\/strong> Home → <strong>View Group<\/strong>, enter it, select <strong>Go To<\/strong>.<\/li>\n<li><strong>Don’t know it?<\/strong> Home → <strong>Search By Pax Name<\/strong> with first and last name. With a very common name, ask for the Group ID, room number or travel documents first; broad searches can freeze Groups Manager.<\/li>\n<li>Open the group. Check the advisor, Groups Coordinator, hotel, travel dates and status.<\/li>\n<li>Click any teal <strong>Warning/Advisory<\/strong> title to read it. No warning doesn’t mean there’s no hotel issue.<\/li>\n<li>Go to <strong>Bookings<\/strong> to see the rooms. Room not showing? Select <strong>Refresh<\/strong>; not every room loads at first.<\/li>\n<li>Hover over names, or open the booking, to see more than the first two travelers.<\/li>\n<li>A crossed-out booking is usually cancelled. Check its history before assuming the traveler was never in the group.<\/li>\n<li>Double-click the room to open <strong>Booking Information<\/strong>. Select <strong>Group<\/strong> to go back.<\/li>\n<\/ol>", "escalate": "", "complete": "You have the right Group ID and room, and you’ve read the warnings and history.", "text": "A group traveler or advisor calls and you need to find their booking. Know the Group ID? Home → View Group , enter it, select Go To . Don’t know it? Home → Search By Pax Name with first and last name. With a very common name, ask for the Group ID, room number or travel documents first; broad searches can freeze Groups Manager. Open the group. Check the advisor, Groups Coordinator, hotel, travel dates and status. Click any teal Warning/Advisory title to read it. No warning doesn’t mean there’s no hotel issue. Go to Bookings to see the rooms. Room not showing? Select Refresh ; not every room loads at first. Hover over names, or open the booking, to see more than the first two travelers. A crossed-out booking is usually cancelled. Check its history before assuming the traveler was never in the group. Double-click the room to open Booking Information . Select Group to go back. You have the right Group ID and room, and you’ve read the warnings and history."}, {"id": "grp-issue", "kind": "proc", "stage": "in", "title": "Group traveler has a problem during the trip", "aliases": ["group problem", "group complaint", "group in travel", "group no show", "rooming list wrong"], "updated": null, "rule": "Read the contract and rooming details before you change or promise anything.", "use": "A group traveler has a hotel, transfer, rooming, cancellation or service problem.", "body": "<ol type=\"1\">\n<li>Find the group and room (<a class=\"xref\" href=\"#grp-find\">Find a group and the right room<\/a>) and read the contract and penalty details.<\/li>\n<li>Solve the traveler’s immediate need.<\/li>\n<li>Contact the hotel or vendor and ask for a fix or waiver.<\/li>\n<li>Involve Groups leadership if it needs contract interpretation, a rooming-list correction, or anything group-wide.<\/li>\n<li>Use goodwill or FTC only within your limits (<a class=\"xref\" href=\"#rec-ftc\">Issue a Future Travel Credit<\/a>), and keep the contract in mind.<\/li>\n<li>Note it in <strong>Group History<\/strong> with the booking number.<\/li>\n<\/ol>\n<p>A first-night no-show caused by an airline problem may still be charged under the group contract. Ask for a waiver, but don’t promise one.<\/p>", "escalate": "It needs contract interpretation, affects the whole group, or the money is beyond your authority.", "complete": "The traveler’s issue is fixed and the group records and owners are aligned.", "text": "Read the contract and rooming details before you change or promise anything. A group traveler has a hotel, transfer, rooming, cancellation or service problem. Find the group and room ( Find a group and the right room ) and read the contract and penalty details. Solve the traveler’s immediate need. Contact the hotel or vendor and ask for a fix or waiver. Involve Groups leadership if it needs contract interpretation, a rooming-list correction, or anything group-wide. Use goodwill or FTC only within your limits ( Issue a Future Travel Credit ), and keep the contract in mind. Note it in Group History with the booking number. A first-night no-show caused by an airline problem may still be charged under the group contract. Ask for a waiver, but don’t promise one. It needs contract interpretation, affects the whole group, or the money is beyond your authority. The traveler’s issue is fixed and the group records and owners are aligned."}, {"id": "grp-pricing", "kind": "proc", "stage": "all", "title": "Price an extra night or change for a group room", "aliases": ["group pricing", "extra night group", "extend group", "sell rate", "cost rate", "contracted rate", "group rate"], "updated": null, "rule": "", "use": "A group traveler wants an extra night or a change that needs pricing.", "body": "<ol type=\"1\">\n<li>Open the individual booking. Confirm the room category and occupancy.<\/li>\n<li>Go to <strong>Pricing<\/strong> and find the <strong>highlighted<\/strong> room categories; those are contracted. Not everything listed is available at the group rate.<\/li>\n<li>Expand the category and find the occupancy (SGL, DBL, TPL).<\/li>\n<li>Use the <strong>Sell<\/strong> rate to calculate. Never share the Cost (net) rate.<\/li>\n<li>Confirm the hotel can actually accommodate it. Pricing doesn’t confirm availability.<\/li>\n<li>Take payment if needed (<a class=\"xref\" href=\"#grp-pay\">Take a payment on a group booking<\/a>).<\/li>\n<li>Note it in <strong>Group History<\/strong>.<\/li>\n<\/ol>", "escalate": "", "complete": "The hotel confirmed, the Sell rate was used, payment is taken and the change is noted.", "text": "A group traveler wants an extra night or a change that needs pricing. Open the individual booking. Confirm the room category and occupancy. Go to Pricing and find the highlighted room categories; those are contracted. Not everything listed is available at the group rate. Expand the category and find the occupancy (SGL, DBL, TPL). Use the Sell rate to calculate. Never share the Cost (net) rate. Confirm the hotel can actually accommodate it. Pricing doesn’t confirm availability. Take payment if needed ( Take a payment on a group booking ). Note it in Group History . The hotel confirmed, the Sell rate was used, payment is taken and the change is noted."}, {"id": "grp-pay", "kind": "proc", "stage": "all", "title": "Take a payment on a group booking", "aliases": ["group payment", "pay group", "process credit card", "take payment group", "amount due", "show payments"], "updated": null, "rule": "Where you start the payment decides where it lands.", "use": "A group traveler or advisor is paying.", "body": "<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Payment is for<\/th>\n<th>Start from<\/th>\n<th>It applies to<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>The whole group<\/td>\n<td><strong>Payment → Process Credit Card<\/strong><\/td>\n<td>Group ID only<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>One specific room<\/td>\n<td><strong>Bookings → PAY<\/strong> on that room<\/td>\n<td>Group ID <strong>and<\/strong> Booking ID<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>For an in-travel change to one room, use <strong>PAY<\/strong> on that room. Check the summary shows the Booking ID before you submit.<\/p>\n<p><strong>Amount Due isn’t always owed.<\/strong> Group payments may sit at the group level and not be allocated yet. L2 doesn’t allocate group funds. Check the payment history first.<\/p>\n<p><strong>To see a room’s payments:<\/strong> Payment → <strong>Show Payments for booking #<\/strong>.<\/p>", "escalate": "", "complete": "The payment shows on the right group or room and is noted in Group History.", "text": "Where you start the payment decides where it lands. A group traveler or advisor is paying. Payment is for Start from It applies to The whole group Payment → Process Credit Card Group ID only One specific room Bookings → PAY on that room Group ID and Booking ID For an in-travel change to one room, use PAY on that room. Check the summary shows the Booking ID before you submit. Amount Due isn’t always owed. Group payments may sit at the group level and not be allocated yet. L2 doesn’t allocate group funds. Check the payment history first. To see a room’s payments: Payment → Show Payments for booking # . The payment shows on the right group or room and is noted in Group History."}, {"id": "grp-money", "kind": "shared", "stage": "all", "title": "Group refunds, adjustments, commission and fees", "aliases": ["group refund", "group adjustment", "group commission", "group agency fee"], "updated": null, "rule": "", "use": "", "body": "<ul>\n<li><strong>Refunds:<\/strong> <a class=\"xref\" href=\"#refunds-f\">Refund a Group booking<\/a>. They process immediately, so check Group ID, Booking ID, card and amount first.<\/li>\n<li><strong>Adjustments:<\/strong> tie them to the individual booking with the right service date, and record whether the supplier, TSP or Classic is paying. Don’t use the FIT Plex adjustment process.<\/li>\n<li><strong>Commission:<\/strong> usually paid after the group travels. Don’t treat a change as a recall if commission hasn’t been paid. If unsure, check with Groups.<\/li>\n<li><strong>Agency fees:<\/strong> L2 never adds an agency or planning fee to a group booking.<\/li>\n<\/ul>", "escalate": "", "complete": "", "text": "Refunds: Refund a Group booking . They process immediately, so check Group ID, Booking ID, card and amount first. Adjustments: tie them to the individual booking with the right service date, and record whether the supplier, TSP or Classic is paying. Don’t use the FIT Plex adjustment process. Commission: usually paid after the group travels. Don’t treat a change as a recall if commission hasn’t been paid. If unsure, check with Groups. Agency fees: L2 never adds an agency or planning fee to a group booking."}, {"id": "grp-docs", "kind": "proc", "stage": "all", "title": "Rooming list and documents", "aliases": ["rooming list", "passenger rooming list", "resend documents", "view docs", "generate docs", "statement", "group documents"], "updated": null, "rule": "", "use": "You need to see who’s in which room, or check or resend travel documents.", "body": "<p><strong>Get a rooming list:<\/strong> Reports → Vendor → <strong>Passenger Rooming List<\/strong> → choose the hotel (a group can have several) → enter your email → submit. It’s emailed to you.<\/p>\n<p><strong>See documents already sent:<\/strong> Reports → <strong>View Docs<\/strong>. Click an item to download the PDF.<\/p>\n<p><strong>Resend documents:<\/strong><\/p>\n<ol type=\"1\">\n<li>Reports → <strong>Generate Docs<\/strong>.<\/li>\n<li>In <strong>Select Bookings for Docs<\/strong>, choose the room. Check it’s the right one.<\/li>\n<li>Select <strong>OK<\/strong>, enter the recipient email, add a message if needed, and send.<\/li>\n<\/ol>", "escalate": "", "complete": "The right rooming list or documents went to the right person.", "text": "You need to see who’s in which room, or check or resend travel documents. Get a rooming list: Reports → Vendor → Passenger Rooming List → choose the hotel (a group can have several) → enter your email → submit. It’s emailed to you. See documents already sent: Reports → View Docs . Click an item to download the PDF. Resend documents: Reports → Generate Docs . In Select Bookings for Docs , choose the room. Check it’s the right one. Select OK , enter the recipient email, add a message if needed, and send. The right rooming list or documents went to the right person."}, {"id": "grp-notes", "kind": "proc", "stage": "all", "title": "Add a note to a group", "aliases": ["group history", "add note group", "history message", "group notes"], "updated": null, "rule": "Put L2 notes in Group History, not the room’s history.", "use": "You need to record something on a group booking.", "body": "<ol type=\"1\">\n<li>Open <strong>History<\/strong> at the group level.<\/li>\n<li>Scroll to the bottom, to <strong>Add a New History Message<\/strong>.<\/li>\n<li>Start with the booking number if it’s about one room, for example: “Booking #10: TA called about bedding…”<\/li>\n<li>Save it.<\/li>\n<\/ol>\n<p>Use the room’s own History tab for <strong>research<\/strong> only, not for notes; room-level notes get missed.<\/p>", "escalate": "", "complete": "The note is in Group History with the booking number.", "text": "Put L2 notes in Group History, not the room’s history. You need to record something on a group booking. Open History at the group level. Scroll to the bottom, to Add a New History Message . Start with the booking number if it’s about one room, for example: “Booking #10: TA called about bedding…” Save it. Use the room’s own History tab for research only, not for notes; room-level notes get missed. The note is in Group History with the booking number."}, {"id": "grp-ref", "kind": "shared", "stage": "all", "title": "Where to find it in Groups Manager", "aliases": ["groups manager", "quick reference", "where to find", "contract tab", "concession"], "updated": null, "rule": "", "use": "", "body": "<table>\n<thead>\n<tr class=\"header\">\n<th>Need<\/th>\n<th>Go to<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Group by number<\/td>\n<td>Home → View Group<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Group by traveler<\/td>\n<td>Home → Search By Pax Name<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Advisory<\/td>\n<td>Group → click the teal title<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>A room<\/td>\n<td>Bookings (Refresh if missing)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Back to the group<\/td>\n<td>Group<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Add a note<\/td>\n<td>Group History<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Contracted rates<\/td>\n<td>Pricing<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Group payment<\/td>\n<td>Payment → Process Credit Card<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Room payment<\/td>\n<td>Bookings → PAY<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Payments by room<\/td>\n<td>Payment → Show Payments for booking #<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Refund<\/td>\n<td>Payment → right-click the card → Credit This Card<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Rooming list<\/td>\n<td>Reports → Passenger Rooming List<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Past documents<\/td>\n<td>Reports → View Docs<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Resend documents<\/td>\n<td>Reports → Generate Docs<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Use with caution:<\/strong> the <strong>Contract<\/strong> area may not reflect later changes, so don’t rely on it alone for penalty decisions. A blank <strong>Concession<\/strong> field doesn’t mean there’s no concession; if a contracted benefit is missing, gather details and escalate to Groups.<\/p>", "escalate": "", "complete": "", "text": "Need Go to Group by number Home → View Group Group by traveler Home → Search By Pax Name Advisory Group → click the teal title A room Bookings (Refresh if missing) Back to the group Group Add a note Group History Contracted rates Pricing Group payment Payment → Process Credit Card Room payment Bookings → PAY Payments by room Payment → Show Payments for booking # Refund Payment → right-click the card → Credit This Card Rooming list Reports → Passenger Rooming List Past documents Reports → View Docs Resend documents Reports → Generate Docs Use with caution: the Contract area may not reflect later changes, so don’t rely on it alone for penalty decisions. A blank Concession field doesn’t mean there’s no concession; if a contracted benefit is missing, gather details and escalate to Groups."}]}, {"id": "refunds", "group": "Money", "title": "Cancellations and refunds", "sub": "Penalties, refunds, transfers and who pays", "compare": "<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><\/th>\n<th>Pre-Travel<\/th>\n<th>In-Travel<\/th>\n<th>Post-Travel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Client refund timing<\/td>\n<td><strong>14 business days<\/strong><\/td>\n<td><strong>7–10 business days<\/strong><\/td>\n<td>Same as when the change happened, not when they called<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Future Travel Credit<\/td>\n<td>Not available<\/td>\n<td>Up to $250 per booking<\/td>\n<td>Up to $250 per booking (specialist)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Goodwill<\/td>\n<td>Not available<\/td>\n<td>Up to $100 per booking if margin stays at 5% or more<\/td>\n<td>Same, through the specialist<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Who owns it<\/td>\n<td>L2; Finance processes the refund<\/td>\n<td>L2 handles the live issue and the money<\/td>\n<td>Simple status: L2. New complaint over 24 hours: Post-Travel specialist<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "items": [{"id": "refunds-path", "kind": "shared", "stage": "all", "title": "Which path?", "aliases": ["which refund", "refund queue", "expedite", "money transfer", "cybersource", "group refund", "path"], "updated": "Updated Oct 28", "rule": "Pick the path before you touch any money.", "use": "", "body": "<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Situation<\/th>\n<th>What to do<\/th>\n<th>Steps<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Regular refund<\/td>\n<td><strong>Plex Refund queue<\/strong> only<\/td>\n<td><a class=\"xref\" href=\"#refunds-a\">Cancel or change before travel, with a refund<\/a> (before travel), <a class=\"xref\" href=\"#refunds-b\">Supplier approves a refund during the trip<\/a> (during)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Expedited refund<\/td>\n<td>Plex Refund queue <strong>plus<\/strong> email Finance<\/td>\n<td><a class=\"xref\" href=\"#refunds-x\">Expedited or overdue refund<\/a><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>“The refund hasn’t arrived”<\/td>\n<td>Confirm the queue request exists and is past its timeframe, then email Finance only. No second request.<\/td>\n<td><a class=\"xref\" href=\"#refunds-x\">Expedited or overdue refund<\/a><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Move money to another booking<\/td>\n<td><strong>Money Transfer Request<\/strong> queue on the source booking. Backup: email Res Support. Not Finance.<\/td>\n<td><a class=\"xref\" href=\"#refunds-d\">Move money to another Classic booking<\/a><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Paid in CyberSource but not in Plex, or a duplicate charge<\/td>\n<td>Email Finance directly. No refund queue.<\/td>\n<td><a class=\"xref\" href=\"#refunds-e\">Payment shows in CyberSource but not in Plex<\/a><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Group booking<\/td>\n<td>Groups Manager → Payment → <strong>Credit This Card<\/strong><\/td>\n<td><a class=\"xref\" href=\"#refunds-f\">Refund a Group booking<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "escalate": "", "complete": "", "text": "Pick the path before you touch any money. Situation What to do Steps Regular refund Plex Refund queue only Cancel or change before travel, with a refund (before travel), Supplier approves a refund during the trip (during) Expedited refund Plex Refund queue plus email Finance Expedited or overdue refund “The refund hasn’t arrived” Confirm the queue request e
